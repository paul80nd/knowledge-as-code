# knowledge-as-code: template manifest
#
# `template/` is what a corpus is made of. This file says, for each file in it, whether a corpus
# receives that file once and then owns it, or receives it again every time it takes a newer
# framework.
#
# Every file here resolves to exactly one of the two layers below. The rules are read in order and
# the first match wins, so a rule carving one file out of a folder is written above the rule
# claiming the folder.
#
# `.corpus.yaml` is not here. A corpus's descriptor is written fresh when the corpus is created,
# from what the invocation was told, rather than copied from a file that would have to carry
# somebody else's name.

# The version of the template's shape. Increment when a corpus has to respond to the change:
# a file added or removed, a file renamed, or a file moving between the two layers.
version: 2

layers:

  overlay:
    rule: Identical in every corpus, and written again whenever the corpus takes a newer framework.
    notes: >
      The schema the tool enforces, the framework's own documentation, and the tree a corpus's
      plugin is built from. An edit to one of these is a divergence from the framework rather than
      a customisation of it, and the next overlay takes it back.

  withheld:
    rule: The template's own machinery, and never written into a corpus at all.
    notes: >
      This file and the page describing it. A corpus is told what it holds by `.corpus.yaml` and by
      the folders it stood up, and has nothing to ask of a manifest describing the tree it came
      from.

  seed:
    rule: Written once, when the corpus is created, and never touched again.
    notes: >
      Starting points a corpus fills with its own content: the page saying what each type is for
      here, the template a contributor copies, and the agent guidance for working in the corpus.
      Each arrives carrying the example estate's wording, which the corpus rewrites in its own
      domain.

rules:

  # ── withheld ───────────────────────────────────────────────────────────────

  - path:
      - "manifest.yaml"
      - "README.md"
    layer: withheld
    note: The template describing itself, which is a fact about this folder and not about a corpus.

  # ── overlay ────────────────────────────────────────────────────────────────

  - path: ".schema/**"
    layer: overlay
    note: >
      The machine-readable schema. Which of it a corpus receives is `types:` in `.corpus.yaml`, so
      a declined type's file is not written rather than written and ignored.

  - path:
      - "knowledge-as-code.md"
      - "knowledge-as-code/**"
    layer: overlay
    note: >
      The framework's own documentation: the taxonomy, the metadata fields, how to write, and what
      each tier asks. Shared word for word, because a corpus that rewrote them would be running a
      framework of its own.

  - path: "glossary/knowledge-as-code.md"
    layer: overlay
    note: >
      The framework's own vocabulary, inherited word for word. A corpus writes its own glossaries
      beside it and leaves this one alone. Matched by name because everything else in a type folder
      belongs to the corpus.

  # ── the plugin ─────────────────────────────────────────────────────────────

  # Both `.plugin/` rules sit here, out of layer order, because the order is what decides. A
  # `.plugin/**` overlay rule written among the rules above would claim the manifest before this
  # rule reached it, and a corpus would lose the one file in the plugin it names for itself.

  - path: ".plugin/.claude-plugin/plugin.json"
    layer: seed
    note: >
      The plugin manifest. Each corpus names, versions and licenses its own plugin, and declares
      under `metadata.components` which record types each component needs: a skill reading the
      glossary is dead weight in a corpus that declined the type.

  - path: ".plugin/**"
    layer: overlay
    note: >
      The tree a plugin is built from. Its skills and hooks serve an agent working in a repository
      that consumes a corpus rather than one working in the corpus itself, and they read the export
      through `${CLAUDE_PLUGIN_ROOT}` rather than opening the tree, so every corpus ships the same
      words.

  # ── seed ───────────────────────────────────────────────────────────────────

  - path: "**/_template.md"
    layer: seed
    note: Templates a corpus fills with example values from its own domain.

  - path: "CLAUDE.md"
    layer: seed
    note: >
      Agent guidance for working in the corpus. The framework provides the structure and the corpus
      fills it with its own conventions.

  - path: "*.md"
    layer: seed
    note: >
      Type root pages: what the type is, why it exists, and how to contribute one. The rules above
      carve out the framework's own pages, which are not a corpus's to rewrite. Written as a
      pattern rather than as seventeen names, so adding a type is adding its schema and its pages
      and nothing else.

  # A file added here and classified by nothing is the corpus's from the moment it arrives. That is
  # the safe way round: a corpus's own edit is never overwritten by a file nobody thought about.

  - { path: "**", layer: seed }
