# CI for this corpus, on Azure Pipelines.
#
# Restores the corpora this one consumes, then runs the validator, the freshness check and the two
# packaging commands on every pull request into main. It writes back one thing: the comment
# `kac validate` posts on a pull request with findings. `generate --check` reports staleness and names
# the command you run locally, and the export and the bundle land in an untracked `.dist/` the agent
# throws away. Publishing what was built is a separate act, and no step here does it.
#
# Wiring PR validation, which is the part that catches people out: this is an Azure Repos repository,
# where the `pr:` trigger below is ignored. Add this pipeline as a required build validation on main:
#   Project settings -> Repositories -> <your-repo> -> Policies -> Branch Policies ->
#   main -> Build Validation -> + -> select this pipeline -> Required.
# The `pr:` block is kept for intent, and works as written if the repository is mirrored to GitHub.
#
# Posting the findings to the pull request needs one more console setting: give the project's build
# service *Contribute to pull requests* on this repository, under Project settings -> Repositories ->
# <your-repo> -> Security.
#
# Restoring from an Azure Artifacts feed reads it as the pipeline's build service, which is
# `<project> Build Service (<org>)`, or `Project Collection Build Service (<org>)` where the job's
# authorization scope is the collection. It can read a feed in this project by default. For a feed in
# another project, add it to the feed as a Feed Reader, under Artifacts -> <the feed> -> Feed
# settings -> Permissions.
#
# Dependabot reads none of the pins below, so you move each by hand:
# * `kac` is pinned in `.config/dotnet-tools.json`, at the version `kac new` wrote. Move it with
#   `dotnet tool update KnowledgeAsCode.Tool`, and commit the file.
# * The .NET SDK is pinned at 10.0.402, because the validate step has the access token. Move it to a
#   release listed at https://dotnet.microsoft.com/download/dotnet/10.0.
# * `UseDotNet@2` runs the newest release of major 2 your organisation has installed. To pin one, write
#   its full version after the `@`, as `UseDotNet@2.<minor>.<patch>`, copied from the task's log. Your
#   organisation must have that version.

trigger: none # no CI on branch pushes; PR validation is via branch policy

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

steps:
  # `validate --since` reads the branch a pull request targets, which a shallow clone lacks.
  - checkout: self
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: Install the .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.402

  # Installs the version `.config/dotnet-tools.json` pins, so a step with the access token runs no
  # release you did not choose.
  - script: dotnet tool restore
    displayName: Install the pinned kac
    workingDirectory: $(Build.SourcesDirectory)

  # Fetches each corpus `consumes:` declares into `.imports/`, which `validate` reads, and does nothing
  # where `consumes:` is empty. A folder `source:` must exist on the agent, because no step here builds
  # it. A script sees the access token only where its step maps it.
  - script: dotnet tool run kac restore
    displayName: Restore the corpora this one consumes
    workingDirectory: $(Build.SourcesDirectory)
    env:
      KAC_REGISTRY_TOKEN: $(System.AccessToken)

  # One invocation per subcommand, run sequentially. Concurrent runs contend over the same output.
  # Only this step and the restore step get the token. This one posts with it, and the restore step
  # reads a private feed with it. On a pull request, `--since` compares each record with the branch it
  # targets. The target branch is set on a pull
  # request alone, as refs/heads/main, and the comparison wants origin/main.
  - script: |
      target="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
      dotnet tool run kac validate ${target:+--since "origin/$target"}
    displayName: Validate frontmatter, links and structure
    workingDirectory: $(Build.SourcesDirectory)
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - script: dotnet tool run kac generate --check
    displayName: Check generated output is fresh
    workingDirectory: $(Build.SourcesDirectory)

  # Proves the corpus still exports, and that the plugin still assembles from what it wrote. Delete
  # both steps if this corpus publishes neither.
  - script: dotnet tool run kac export
    displayName: Build the export
    workingDirectory: $(Build.SourcesDirectory)

  - script: dotnet tool run kac bundle
    displayName: Assemble the plugin bundle
    workingDirectory: $(Build.SourcesDirectory)
