# yaml-language-server: $schema=./meta/type.schema.json

type: glossary
label: Glossary
label-plural: Glossaries
folder: glossary
page: glossary.md
tier: descriptive
lifecycle: living
summary: The ubiquitous language. Terms whose meaning is specific to us, or which are easily confused.
goes-here: A term whose meaning isn't obvious, or that we use in a specific way
detail: >
  One glossary per bounded context, each small enough to read end to end. A term that needs explaining every
  time it appears belongs in the most general glossary that admits it, and everything else links to it.

lineage:
  prior-art: "Evans, *Domain-Driven Design*: ubiquitous language"
  alignment: >
    A rigorous shared vocabulary maintained against ambiguity, scoped to a bounded context and used identically
    within it
  divergence: >
    Evans' language is spoken as much as written, and lives in the model and the code. Ours is a set of
    documents, and nothing holds the code to agreeing with them

notes: >
  Folder is singular because a corpus has one glossary, held in several files. One of two exceptions to the
  plural-folder rule, alongside `data/`.

  A glossary covers one bounded context or product surface: the framework itself, or a system that names
  things its own way. Never a topic. A term goes in the most general glossary that admits it, and a narrower
  one redefines it only where the meaning genuinely differs.

  A term is an H3 heading, a one-sentence definition, an optional `**Not:** …` line naming what it is most often
  confused with, and optional links to the owning service or an explanation. Those `**Not:**` lines are the most
  useful content in the file. One paragraph per term, because a glossary is read end to end and every paragraph
  is paid for by every reader. The list is alphabetical and flat (no A–Z sub-headings), so that it scans and
  greps cleanly. The tool checks that order, and it checks that the entries are there: `part-none` reports a `Terms`
  section holding no headings, and `part-empty` a heading with nothing beneath it. Nothing reads the words themselves,
  so whoever reviews the file holds an entry to its single sentence and its single paragraph. The rules below that
  would read a term's shape are declared and not built.

id:
  prefix: gls
  style: slug
  notes: >
    Named for the context rather than for the words it holds, so the corpus-wide glossary takes the corpus's own
    name and a system's glossary takes the system's.

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [draft, active]
    description: '`draft` while the terms are still settling.'

  narrows:
    required: false
    type: id
    ref: glossary
    description: The more general glossary this one narrows, where one sits above it.
    notes: >
      Absent on a glossary nothing sits above: the corpus-wide one, and the framework's own. It records the
      ordering the resolution rule reads, so "the most general glossary that admits this term" becomes a
      question a reader answers from the index rather than from knowing the estate. A glossary every corpus
      shares leaves it empty even where that corpus has a more general one, because a shared file cannot
      name a record only one corpus holds.

  review-by:
    required: true
    type: date
    description: Quoted. A glossary is reviewed whole, rather than a term at a time.

sections:
  required: [Scope, Terms]
  optional: []
  notes: >
    `Scope` says which context this glossary admits, and a contributor holding a word reads it to decide
    whether the word belongs here. The terms themselves are H3s under `Terms`, and a cross-reference names
    their anchors.

# Where a glossary keeps the parts something else can cite. A term is an H3 under `Terms`, and its
# address is the anchor the heading slugs to, so `gls-knowledge-as-code.corpus` names the entry a link
# to `#corpus` would land on. Why the address is derived here and written out on a policy is settled in
# <https://paul80nd.github.io/knowledge-as-code/framework/metadata/>.
parts:
  source: headings
  section: Terms
  noun: term
  level: 3
  aside: Not

# What a glossary contributes to a published export, and how much of each piece travels. `Terms` is
# absent from the sections because the terms under it are parts, and `parts:` above carries them.
export:
  fields: [id, title, narrows, status, review-by]
  sections:
    Scope: full
  parts: full
  notes: >
    A term travels whole: the definition and the `**Not:**` line beneath it, carried as two pieces
    because they answer two questions. A definition on its own is mostly guessable from the word, so
    an export that dropped the `**Not:**` line would carry the guessable half.

    The fields are the glossary's, and together they are what a consumer judges an entry by. `Scope`
    says which context admits the term. `status` and `review-by` say how far the file has settled and
    when it was last meant to be read, and the export repeats those two onto every term it writes:
    the flat file is what gets grepped, and whoever grepped it has not opened the record.

    `review-by` is the signal a vendored export otherwise lacks. A copy taken a year ago reads exactly
    as it did on the day it was taken, and `status: draft` says the terms were settling rather than
    that the date has passed.

    `owner` stays behind, and the split between the two is not about which is more useful. A date is a
    fact about the content, and a consumer holds it against today's date knowing nothing about this
    corpus. An owner is a fact about this corpus's stewardship, and it stops being actionable the
    moment the export leaves: whoever holds a vendored copy has no standing to ask, and the name goes
    stale with nothing in the export to say so.

index:
  columns: [id, title, narrows, status, owner, review-by]
  sort: id

rules:
  - id: redefinitions-are-reciprocal
    description: >
      Where one glossary redefines a term another holds, each entry links to the other entry's anchor.
    # "The other entry", and not the other file. A link to `other.md` lands a reader at the top of the
    # glossary rather than on the term, and an export carries the cross-reference a link states, so a
    # link naming no term leaves it nothing to carry. Why the export refuses to guess the counterpart,
    # rather than reading it from the term's own spelling, is at
    # https://paul80nd.github.io/knowledge-as-code/cli/export/
    #
    # The reference runs upward only where the general glossary is synced: a file every corpus shares
    # cannot name a record only this one holds.
  - id: carried-in-full-by-digest
    description: >
      No entry runs beyond one paragraph, and this corpus's digest takes the glossaries in the order the
      export writes them.
    # A glossary is read end to end, so every entry's length is paid by every reader. The rule governs
    # the digest this corpus writes for itself, which has a budget. With several glossaries, "carry the
    # glossary in full" names no single file: the digest takes them in some order and cuts off when the
    # budget is spent, which three glossaries are enough to do.
    #
    # That order is the export's (roots by id, each root's chain beneath it), and it carries generality
    # only inside a chain. Across unrelated roots it is stable and arbitrary, so which of two roots loses
    # its tail to the budget is arbitrary too. Whoever builds the digest has to answer that, and naming
    # an order here is not the same as having answered it.
    #
    # A consumer corpus receives the `export:` block above instead, and that is bounded per term.
  - id: undefined-terms
    description: >
      Reports terms appearing more than N times across the corpus with no glossary entry.
  - id: unused-terms
    description: Reports entries nothing uses, where a use inside the term's own context counts as one.
  - id: terms-are-alphabetical
    description: A glossary's entries read in alphabetical order, compared without regard to casing.
    severity: warning
  - id: terms-are-singular
    description: Entry headings are singular and in canonical casing.
