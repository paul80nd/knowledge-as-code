# yaml-language-server: $schema=./meta/type.schema.json

type: integration
label: Integration
label-plural: Integrations
folder: integrations
page: integrations.md
tier: descriptive
lifecycle: living
summary: "An external system we depend on: the contract, the auth, the failure modes, their SLA and our fallback."
goes-here: A third-party or external system we depend on
detail: >
  Every integration point needs a deliberate failure mode and a fallback, so the type requires both. It also
  names who to call when the system is down.

lineage:
  prior-art: "[Nygard, *Release It!* (2nd ed.)](https://pragprog.com/titles/mnee2/release-it-second-edition/) — integration points"
  alignment: >
    That every integration point needs a deliberate failure mode and fallback, so the type requires both
  divergence: >
    A pattern book, not a document type — and prior art for only half the fields. The commercial ones come from
    supplier management

id:
  prefix: int
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, trial, retired]
    description: Whether the integration is live, on trial, or retired.

  vendor:
    required: true
    type: string
    description: Who supplies it.

  used-by:
    required: true
    type: list
    of: id
    ref: services
    notes: An integration nothing uses is a candidate for retirement.

  criticality:
    required: true
    type: enum
    values: $enums.criticality
    description: Judged by what a customer experiences when it is unavailable.

  their-sla:
    required: false
    type: string
    notes: What the contract actually says, not what the marketing page implies.

sections:
  required: [What it does, Contract, Failure modes]
  optional: [Their SLA, Commercials, Contacts, Related]

index:
  columns: [id, title, vendor, criticality, their-sla, status]
  sort: id

rules:
  - id: fallback-required
    description: The Failure modes section mentions a fallback somewhere, or says there is none.
    severity: warning
    # The section as a whole rather than each mode within it: nothing here can tell one failure mode from
    # the next, so this catches the document that never mentions a fallback, not the one missing a case.
    expr: "section_matches('Failure modes', '(?i)fallback')"
    message: >
      The Failure modes section names no fallback. Say what happens instead when this fails, or say plainly
      that nothing does.
  - id: no-credentials
    description: Nothing reads as a token, key, password or connection string.
    severity: error
    # An assignment, not a mention: a document explaining how credentials are handled says "password"
    # constantly and is right to. What it never does is follow one with a value.
    expr: >-
      not matches('(?i)(password|passwd|secret|api[_-]?key|access[_-]?key|token)\s*[:=]\s*["'']?[A-Za-z0-9/+_.-]{8,}')
    message: >
      Something here reads as a credential rather than as a reference to one. Name the mechanism and where
      the value is held; never the value.
