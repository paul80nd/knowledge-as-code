# CI for this corpus, on GitHub Actions.
#
# Runs the validator, the freshness check and the two packaging commands on every pull request into
# main. It writes back one thing: the comment `kac validate` posts on a pull request with findings.
# `generate --check` reports staleness and names the command you run locally, and the export and the
# bundle land in an untracked `.dist/` the runner throws away. Publishing what was built is a separate
# act, and no step here does it.
#
# Each action is pinned to a commit, because a tag can be moved to other code, and `kac` is pinned in
# `.config/dotnet-tools.json`. `.github/dependabot.yml` moves each of them.
#
# The .NET SDK is pinned at 10.0.402, because the validate job has a write token. Dependabot does not
# read `dotnet-version`, so you move it by hand to a release listed at
# https://dotnet.microsoft.com/download/dotnet/10.0.
#
# The Azure Pipelines twin sits at `azure-pipelines.yml`. Keep whichever one your corpus runs on and
# delete the other.

name: kac

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # `kac validate` posts its findings to the pull request as a comment, and needs this to write one.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `validate --since` reads the branch a pull request targets, which a shallow clone lacks.
          fetch-depth: 0
          # The checkout keeps no copy of the job's token, so no later step can push with it.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402

      # Installs the version `.config/dotnet-tools.json` pins, so a job with a write token runs no
      # release you did not choose. `.github/dependabot.yml` proposes each new one as a pull request.
      - name: Install the pinned kac
        run: dotnet tool restore

      # One invocation per subcommand, run sequentially. Concurrent runs contend over the same output.
      # Only this step gets the token, because only it posts. On a pull request, `--since` compares each
      # record with the branch it targets. A push to main has no base, and passes no `--since`.
      - name: Validate frontmatter, links and structure
        run: dotnet tool run kac validate ${BASE_REF:+--since "origin/$BASE_REF"}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}

      - name: Check generated output is fresh
        run: dotnet tool run kac generate --check

      # Proves the corpus still exports, and that the plugin still assembles from what it wrote. Delete
      # both steps if this corpus publishes neither.
      - name: Build the export
        run: dotnet tool run kac export

      - name: Assemble the plugin bundle
        run: dotnet tool run kac bundle
