# CI for this corpus, on GitHub Actions.
#
# Runs the validator, the freshness check and the two packaging commands on every pull request into
# main. It writes nothing back: `generate --check` reports staleness and names the command you run
# locally, and the export and the bundle land in an untracked `.dist/` the runner throws away.
# Publishing what was built is a separate act, and no step here does it.
#
# The Azure Pipelines twin sits at `azure-pipelines.yml`. Keep whichever one your corpus runs on and
# delete the other.

name: kac

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Installed globally, so this runs whichever version nuget.org holds on the day. Pin it instead
      # by committing a tool manifest (`dotnet new tool-manifest && dotnet tool install
      # KnowledgeAsCode.Tool`) and swapping this step for `dotnet tool restore`. Then every machine and
      # every build runs the version the corpus was written against.
      - name: Install kac
        run: dotnet tool install --global KnowledgeAsCode.Tool

      # One invocation per subcommand, run sequentially. Concurrent runs contend over the same output.
      - name: Validate frontmatter, links and structure
        run: kac validate

      - name: Check generated output is fresh
        run: kac generate --check

      # Proves the corpus still exports, and that the plugin still assembles from what it wrote. Delete
      # both steps if this corpus publishes neither.
      - name: Build the export
        run: kac export

      - name: Assemble the plugin bundle
        run: kac bundle
