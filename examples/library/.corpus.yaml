# knowledge-as-code: corpus descriptor
#
# Says what this corpus is and where it stands against the framework it took.
#
# The template manifest (`manifest.yaml`, at this repository's root) says which files a corpus is made
# of. This file records:
# - what this corpus is called, and where it publishes
# - which version of its own content this corpus is on
# - which template version it runs, and where it takes that from
# - which record types it has adopted
# - any file it holds differently on purpose
#
# Three versions live here, so none of them is called `version` alone.
#
# The file is this corpus's own: never overlaid, never reconciled. It sits at the repository root rather
# than with the framework's files.
#
# https://paul80nd.github.io/knowledge-as-code/corpus-descriptor/ says what every key here means.

# The version of this file's own format. Stamped by `kac update`, because the
# shape of the file is the tool's rather than the corpus's.
descriptor-version: 1

# The name of this corpus.
corpus: example-libraries

# The version of what this corpus knows: its records, and the meanings they carry.
#
# Not the format of this file, which `descriptor-version` above states. Not the
# template this corpus runs, which `upstream.template-version` below states.
#
# It is the number to quote when one corpus tells another which version of the
# content it has. Semantically versioned:
# - major, where a meaning changed or a published URL broke
# - minor, for additions
# - patch, for wording
#
# The number is a notification and nothing refuses to load because it moved.
# Bumped by hand, and nothing but a person writes it.
content-version: "0.1.0"

# What this corpus is, for a reader who meets it as a package or an installed plugin rather than as a
# repository. `kac export` carries all four, `kac pack` writes them into the package a registry lists,
# and `kac bundle` writes them into the plugin manifest somebody installs.
#
# A key left bare is carried into neither. A licence nobody chose and an author nobody named are claims
# about a person, so a corpus that has not said asserts nothing.
display-name: Example Libraries
description: >
  A worked example corpus shipped with knowledge-as-code, holding the invented estate of a fictional public-library
  consortium. It is here to show what a corpus holds, and it governs nobody.
license: MIT
author:
  name: Paul Law
  url: https://github.com/paul80nd

# How this corpus is published. One of: azure-devops | azure-devops-wiki | github | mkdocs | none.
publishing-target: github

# Recorded rather than inferred, so `kac export` can build the link a reader follows
# and name what an agent needs to fetch a record's source.
#
# `github` says the repository is itself the published form, and a record is read
# rendered on github.com. This repository also carries `azure-pipelines.yml` and
# `.order`, which are seeds for a corpus published to an Azure DevOps wiki rather than
# files this target uses.
#
# `none` says a corpus is not published. An export from one carries no links, and says
# so in its manifest rather than emitting a link that resolves nowhere.

# Where the published form of this corpus is served from.
#
# Only where it is served from lives here. How a record's path and a term's anchor join a
# base is a property of `publishing-target` and lives in the tool, so every corpus on
# one target builds the same link and none of them writes the rule down a second time.
#
# Absent where `publishing-target: none`, which is the one value that needs no base.
publishing:
  # Where the published corpus is browsed. An agent reads a record's source from the
  # same place, through a client that authenticates to the target.
  base: https://github.com/paul80nd/knowledge-as-code

  # The folder the corpus sits in, where the repository holds more than the corpus.
  #
  # The commit a link resolves against sits between the base and the record's path, so a
  # corpus in a subdirectory cannot say this by writing the folder into its base.
  #
  # Absent where the corpus is the repository, which is the ordinary case.
  path-prefix: examples/library

# Where this corpus takes the framework from.
#
# This corpus sits inside the repository that serves the template, so it takes from that repository's
# root rather than over the network. `kac update --check --from ../../` holds it to that template.
upstream:
  # URL of the repository serving the template.
  url: ../../

  # The folder inside that repository holding `manifest.yaml`. Absent means its root, which is where
  # this repository keeps it.
  path:

  # The branch or tag to take from. Followed on every update, so a corpus tracks a moving line rather
  # than a fixed point.
  ref:

  # What the last take resolved to. Recorded and never followed, so a reader can see exactly what
  # arrived without the corpus being pinned to it.
  commit:

  # The version of the template's shape this corpus is on. Stamped by `kac update`.
  template-version: 5

  # The day the framework last arrived.
  taken-on: "2026-08-24"

# How far an update goes. One of: cautious | full.
#
# `cautious` writes a seed only where this corpus has none. A seed is the corpus's own words, and
# refreshing every one of them would open each update with three dozen files to revert by hand.
#
# `full` refreshes them too, and hands the reconciliation to the diff. Overlay files are written either
# way, because they are the framework's rather than the corpus's.
update-policy: cautious

# The record types this corpus has adopted.
# Validation, index generation and what an update writes all cover the types listed here.
#
# Declared rather than inferred. A corpus that omits the key has the tool read
# adoption off the folders it finds instead, which says "these folders happen to
# be here" where this says "these are the types we chose". Only the second is
# something validation can hold a corpus to.
types:
  - adrs
  - capabilities
  - data
  - glossary
  - integrations
  - processes
  - runbooks
  - services

# What `kac export` leaves behind.
#
# Empty by default, and that is the important part: a record still in draft, and one
# whose review date has passed, both travel. Each carries its own state, so a consumer
# reads what the corpus actually holds and decides for itself how far to trust it.
#
# Filtering here would make the corpus's own state invisible downstream: a consumer
# would see a smaller, tidier vocabulary and no sign that anything had been withheld.
# The option exists for a corpus that publishes to an audience it cannot warn.
#
# Two values: `draft` drops a record whose status says so, and `overdue` drops one
# whose `review-by` is in the past.
export:
  exclude: []

# Where `kac bundle` reads the plugin tree from.
#
# Absent means `.plugin/` at this corpus's root, which is what a corpus standing on its own holds and
# what `kac new` creates. This corpus sits inside the repository serving the template, so it reads the
# skills and hooks from the one tree there and keeps no copy of its own.
#
# Relative to this corpus's root, as `upstream.url` is.
#
# The manifest is never read from the shared tree. It carries the name this plugin installs under, so it
# stays at `.plugin/.claude-plugin/plugin.json` here, along with the components this corpus declares. A
# file this corpus writes beside it wins over the shared tree's copy of the same path.
plugin:
  from: ../../template/.plugin

# Files this corpus deliberately holds differently from the framework.
#
# Each entry names the file and says why. `kac update` reads and writes neither, in either direction, so
# this is the one way to say "I own this" about a file the overlay would otherwise reclaim on every run.
# Delete an entry once the file matches the framework again.
#
# Example:
#
# skip:
#   - path: .plugin/hooks/breadcrumb
#     reason: Patched for our proxy.

skip: []
