# The gate on a pull request for a copy of this whole repository, on Azure DevOps.
#
# It is for somebody building or customising the framework itself, so it runs every corpus under
# examples/, the template, the plugin each corpus builds, and the tool's own three test layers. It
# covers the same ground as ../.github/workflows/kac.yml, which splits those steps across jobs it can
# run in parallel. A flat step list cannot, so the corpus steps are looped here instead.
#
# examples/library/azure-pipelines.yml is a different file for a different reader: a corpus's own
# pipeline, forked by each corpus, running kac over that corpus and nothing else. A corpus holds no
# template/ and no tests, so it has no use for this one.
#
# Azure Pipelines finds no YAML by itself. Point the pipeline at this path when you create it:
#   Pipelines -> New pipeline -> Azure Repos Git -> your repo -> Existing Azure Pipelines YAML file
#   -> /.azuredevops/kac.yml
#
# Wiring PR validation (important): this is an Azure Repos repository, where the YAML `pr:` trigger
# below is IGNORED. Add this pipeline as a required Branch Policy -> Build Validation on `main`:
#   Project settings -> Repositories -> <your-repo> -> Policies -> Branch Policies -> main ->
#   Build Validation -> + -> select this pipeline -> Required.
# The `pr:` block is kept for intent, and works as-is if the repo is ever mirrored to GitHub.
#
# Nothing this pipeline produces is written back over a file a human edits. `generate --check` only
# reports staleness, naming the command to run locally.
#
# tooling/tests/round-trip.sh is deliberately absent. It fetches each record from the host
# `publishing:` in .corpus.yaml names, which is raw.githubusercontent.com, and a commit that lives
# only in Azure Repos was never pushed there. ../.github/workflows/kac.yml runs it.

trigger: none                 # no CI on branch pushes; PR validation is via branch policy

pr:
  branches:
    include:
      - main

parameters:
  # The corpora this repository holds, expanded into steps when the pipeline compiles. Narrow it on a
  # manual run to gate one corpus while working on it.
  - name: corpora
    type: object
    default:
      - library
      - engineering
      - payments

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  # One invocation per subcommand, run sequentially. Concurrent runs build the same project and
  # contend over its output, so the kac runs must not overlap.
  #
  # Each runs from a corpus directory, because kac takes the first ancestor holding a .corpus.yaml as
  # one. The tool is the one this repository builds rather than one installed on the agent.
  #
  # Every corpus declares a different `types:`, so running all of them is what proves the framework
  # holds for a corpus that adopted a subset and not only for one that adopted the lot.
  - ${{ each corpus in parameters.corpora }}:
      # payments consumes engineering, and what it consumes is a sealed package rather than the corpus
      # next door. Built here rather than relied on from engineering's own steps above, so narrowing
      # `corpora` to payments alone still runs.
      - ${{ if eq(corpus, 'payments') }}:
          - script: |
              dotnet run --project ../../tooling/kac -- export
              dotnet run --project ../../tooling/kac -- pack
            displayName: Build the package this corpus consumes (${{ corpus }})
            workingDirectory: $(Build.SourcesDirectory)/examples/engineering

          # .imports/ is not committed, so a fresh checkout holds none of it and `validate` fails
          # naming this command. A corpus consuming nothing skips the step.
          - script: dotnet run --project ../../tooling/kac -- restore
            displayName: Restore what this corpus consumes (${{ corpus }})
            workingDirectory: $(Build.SourcesDirectory)/examples/${{ corpus }}

      - script: dotnet run --project ../../tooling/kac -- validate
        displayName: Validate frontmatter, links and structure (${{ corpus }})
        workingDirectory: $(Build.SourcesDirectory)/examples/${{ corpus }}

      - script: dotnet run --project ../../tooling/kac -- generate --check
        displayName: Check generated output is fresh (${{ corpus }})
        workingDirectory: $(Build.SourcesDirectory)/examples/${{ corpus }}

      # Each corpus holds a materialised copy of what the template sends, so this is what keeps every
      # tree equal to the template in both directions.
      - script: dotnet run --project ../../tooling/kac -- update --check --from ../../
        displayName: Check the corpus is in step with the template (${{ corpus }})
        workingDirectory: $(Build.SourcesDirectory)/examples/${{ corpus }}

      - script: dotnet run --project ../../tooling/kac -- export
        displayName: Build the export (${{ corpus }})
        workingDirectory: $(Build.SourcesDirectory)/examples/${{ corpus }}

      - script: dotnet run --project ../../tooling/kac -- bundle
        displayName: Assemble the plugin bundle (${{ corpus }})
        workingDirectory: $(Build.SourcesDirectory)/examples/${{ corpus }}

      # Only the corpus that publishes. A pack is refused without a shortcode, and engineering is the
      # one corpus here declaring one: it is the governance layer the others would consume.
      - ${{ if eq(corpus, 'engineering') }}:
          - script: dotnet run --project ../../tooling/kac -- pack
            displayName: Seal the export into a package (${{ corpus }})
            workingDirectory: $(Build.SourcesDirectory)/examples/${{ corpus }}

  # `generate --check` is askable only here. The corpus the installed tool stands up further down is
  # generated as it is created, so nothing there holds these committed copies fresh.
  - script: dotnet run --project ../tooling/kac -- validate
    displayName: Validate the template where it is authored
    workingDirectory: $(Build.SourcesDirectory)/template

  - script: dotnet run --project ../tooling/kac -- generate --check
    displayName: Check the template's generated output is fresh
    workingDirectory: $(Build.SourcesDirectory)/template

  # Taken at `latest` rather than pinned, because the bundle has to be valid against the CLI a
  # reader actually runs.
  - script: npm install -g @anthropic-ai/claude-code@latest
    displayName: Install the Claude Code CLI

  # A clean `claude plugin validate` prints one line whatever it looked at, and a plugin holding no
  # component at all passes it. The two guards below close that: bundle.json's components must
  # really be in the tree, and .claude-plugin/ must hold the manifest and nothing else, because a
  # component filed in there is loaded by nothing.
  #
  # Word for word the script in ../.github/workflows/kac.yml, so it is held to the POSIX subset Git
  # Bash and older macOS bash agree on, with no command substitution, whose `$(...)` an Azure
  # pipeline reads as its own macro before the shell sees it.
  #
  # It follows the CLI install rather than the bundle it checks, because the install happens once and
  # a flat step list cannot interleave it with the loop above.
  - ${{ each corpus in parameters.corpora }}:
      - script: |
          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict

          jq -r '.included[].path' .dist/plugin/bundle.json > "$TEMPDIR/included.txt"

          missing=''
          while read -r component; do
            [ -d ".dist/plugin/$component" ] || missing="$missing $component"
          done < "$TEMPDIR/included.txt"

          if [ -n "$missing" ]; then
            echo "bundle.json includes components the assembled plugin does not hold:$missing"
            exit 1
          fi

          find .dist/plugin/.claude-plugin -mindepth 1 -maxdepth 1 ! -name plugin.json > "$TEMPDIR/stray.txt"

          if [ -s "$TEMPDIR/stray.txt" ]; then
            echo "filed inside .claude-plugin/, where nothing loads it:"
            cat "$TEMPDIR/stray.txt"
            exit 1
          fi
        displayName: Validate the assembled plugin and its marketplace (${{ corpus }})
        workingDirectory: $(Build.SourcesDirectory)/examples/${{ corpus }}
        env:
          TEMPDIR: $(Agent.TempDirectory)

  # `bundle-empty` in the golden suite pins what an emptied plugin holds. What it cannot say is
  # whether that plugin is still valid to install, which is what this asks.
  - script: |
      mkdir -p "$TEMPDIR/no-types"
      cp -R ../../.schema "$TEMPDIR/no-types/.schema"
      # The tree this corpus reads through plugin.from, and its own manifest over the top: the two
      # halves bundle merges. Copying this corpus's .plugin alone would carry the manifest and no
      # component file, so nothing would be left for the trim to strip.
      cp -R ../../template/.plugin "$TEMPDIR/no-types/.plugin"
      cp .plugin/.claude-plugin/plugin.json "$TEMPDIR/no-types/.plugin/.claude-plugin/plugin.json"

      # kac reads a folder as a corpus by this file. The name and the version are what a plugin is
      # installed by and updated on, and the bundle takes both from here, so a corpus adopting no
      # type still states them.
      printf 'descriptor-version: 1\ncorpus: no-types\ncontent-version: "0.1.0"\n' \
        > "$TEMPDIR/no-types/.corpus.yaml"

      cd "$TEMPDIR/no-types"
      dotnet run --project "$SOURCES/tooling/kac" -- export
      dotnet run --project "$SOURCES/tooling/kac" -- bundle

      claude plugin validate ./.dist/plugin --strict
      claude plugin validate ./.dist --strict

      if ! jq -e '.included == [] and (.trimmed | length) > 0' .dist/plugin/bundle.json > /dev/null; then
        echo "a corpus with no type bundled something that reads a type it does not hold"
        exit 1
      fi
    displayName: Bundle a corpus that adopted no type, and validate what it produced
    workingDirectory: $(Build.SourcesDirectory)/examples/library
    env:
      TEMPDIR: $(Agent.TempDirectory)
      SOURCES: $(Build.SourcesDirectory)

  # tooling/README.md#tests says what each layer covers and why all three are here.
  - script: dotnet test tooling/kac.tests
    displayName: Run kac.core unit tests
    workingDirectory: $(Build.SourcesDirectory)

  - script: dotnet test tooling/kac.features
    displayName: Run kac feature tests
    workingDirectory: $(Build.SourcesDirectory)

  - script: dotnet run tooling/kac-tests.cs
    displayName: Run the golden test suite
    workingDirectory: $(Build.SourcesDirectory)

  # The import half proved end to end: publish from examples/engineering, consume it from
  # examples/payments, then rename a clause upstream and assert the downstream build goes red naming
  # it. Unlike round-trip.sh this reaches no network, because the two corpora exchange a sealed
  # package through a folder, so it runs here as well as on GitHub.
  - script: sh tooling/tests/import-round-trip.sh
    displayName: Publish from one corpus, consume it from another, and break it on purpose
    workingDirectory: $(Build.SourcesDirectory)

  # Pack fails on package metadata no test layer above reads, such as a readme the project names and
  # nobody wrote. Installing what was packed catches a package that is well-formed and still does
  # not resolve to a runnable command.
  - script: |
      dotnet pack tooling/kac/kac.csproj -o .dist/pack
      dotnet tool install --tool-path .dist/tools --add-source .dist/pack KnowledgeAsCode.Tool
      cd "$TEMP_ROOT"
      "$SOURCES/.dist/tools/kac" --version

      # `new` validates before it returns. The two verbs after it put the same questions to a
      # separate process, which is what finds a corpus only its creator can read.
      mkdir -p "$TEMP_ROOT/created"
      cd "$TEMP_ROOT/created"
      "$SOURCES/.dist/tools/kac" new --yes --from "$SOURCES" --name created --ci github
      "$SOURCES/.dist/tools/kac" validate
      "$SOURCES/.dist/tools/kac" generate --check
    displayName: Pack the tool, then stand a corpus up with the installed copy
    workingDirectory: $(Build.SourcesDirectory)
    env:
      TEMP_ROOT: $(Agent.TempDirectory)
      SOURCES: $(Build.SourcesDirectory)
