# knowledge-as-code — mechanism sync state for THIS corpus
#
# `knowledge-as-code/manifest.yaml` says what is shared. This file says which version of it this
# corpus is running, and where it has deliberately stepped away. It is `local`: never synced, never
# reconciled — which is why it sits at the repo root rather than with the shared mechanism.
#
# Written by `kac mechanism --sync`; read by `kac mechanism --check`.

version: 1

corpus: knowledge-as-code

role: source
# One of: source | consumer.
#
#   source   — a copy of the pattern that answers for it. Changes originate or are reconciled here,
#              and propagate outward. A source carries the `verification` layer: the tests, the
#              fixtures and the guidance for changing the tool.
#   consumer — a corpus that receives the synced layer from a source. Local edits to that layer are
#              drift. A consumer carries the tool and not the machinery that proves it: the tool
#              reaches it already proven, and a fixture tree nobody runs is noise.
#
# A consumer may well be where a change is *authored* — real content is the only thing that
# reveals a schema is wrong — but the change is not settled until it lands in a source.
#
# The role does not decide direction of travel. A source with an upstream is a mirror, and syncs
# from it like anything else. `--sync` refuses at one place only: the head of the chain, which is
# the corpus naming no upstream at all.

publishing-target: none
# One of: azure-devops-wiki | github | mkdocs | none. Determines which `forked` publishing files
# this corpus is expected to carry. Recorded rather than inferred, so the check can say "you are
# missing the ADO nav file" instead of silently passing.
#
# `none` here because this repository is the pattern rather than a published wiki. It carries
# `azure-pipelines.yml` and `.order` as *seeds* for corpora that are.

upstream:
  url:               # unset — this corpus is the source
  mechanism-version: 3
  synced-from:       # n/a for a source
  synced-on:         "2026-08-08"

# Files in the `synced` layer that this corpus deliberately holds differently. Each records its
# reason, so that a necessary deviation does not have to masquerade as drift and the next person can
# tell the two apart. `kac mechanism --check` reports these as accepted rather than failing, and
# flags any that have since become identical again (delete those). `--sync` steps over them.
#
#   accepted-divergences:
#     - path: .tooling/kac.cs
#       reason: Pinned to .NET 8 — this build agent has no .NET 10 SDK.
#       since: 2026-08-03
#       revisit: When the agent image is upgraded.

accepted-divergences: []
