# The documentation site for `kac`, published to GitHub Pages by .github/workflows/publish-docs.yml.
# `docs/` holds every page and nothing else does: a page in both trees is the drift this site exists to end.

site_name: knowledge-as-code
site_description: Validator and generator for a knowledge-as-code corpus, driven by its own schema.
site_url: https://paul80nd.github.io/knowledge-as-code/
site_author: Paul Law

repo_url: https://github.com/paul80nd/knowledge-as-code
repo_name: paul80nd/knowledge-as-code
edit_uri: edit/main/docs/

copyright: MIT licensed.

# Strict mode fails a dead link. A page the nav does not list is only reported at INFO, so `NavigationTests` has it.
strict: true

# A dead anchor is otherwise INFO, which strict does not promote. This key takes no `error`, so `warn` fails the build.
validation:
  links:
    anchors: warn

# The pins the workflow installs from sit beside the pages, so Dependabot finds one directory.
exclude_docs: |
  requirements.txt

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    # `edit_uri` above renders as a pencil on each page only where this feature is on.
    - content.action.edit
    - content.code.copy
    - navigation.footer
    # `navigation.indexes` puts each section's own index page behind the section's name. Without
    # `navigation.sections` beside it, the two sections then collapse, so a reader browsing the flat
    # pages is not scrolling past sixteen entries to reach the changelog.
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system setting
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light

# Two gaps in the sidebar, and nothing else. `docs/assets/extra.css` says which and why.
extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # A ```mermaid block renders as a diagram. `docs/reference/generation.md` holds the subset every diagram keeps to.
  #
  # The theme fetches https://unpkg.com/mermaid@11/dist/mermaid.min.js at page load, and only for a page
  # carrying one of these. It is the one thing this site asks of a host other than Pages, the version is
  # the theme's to choose rather than ours to pin, and a reader who cannot reach unpkg.com reads the
  # diagram's source instead of seeing the picture. Every such block renders on github.com either way.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Publishes tooling/kac/CHANGELOG.md without a second copy. `check_paths` fails a moved path.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

# Declaring `plugins:` drops the default `search`, so it is listed by name.
plugins:
  - search
  # A moved page, then the page that replaced it. `NavigationTests` fails a target the nav does not list.
  - redirects:
      redirect_maps:
        'ci.md': 'use/ci.md'
        'cli/bundle.md': 'use/cli/bundle.md'
        'cli/checks.md': 'use/cli/checks.md'
        'cli/export.md': 'use/cli/export.md'
        'cli/generate.md': 'use/cli/generate.md'
        'cli/index.md': 'use/cli/index.md'
        'cli/new.md': 'use/cli/new.md'
        'cli/pack.md': 'use/cli/pack.md'
        'cli/report.md': 'use/cli/report.md'
        'cli/restore.md': 'use/cli/restore.md'
        'cli/update.md': 'use/cli/update.md'
        'cli/validate.md': 'use/cli/validate.md'
        'corpus-descriptor.md': 'use/corpus-descriptor.md'
        'design/checks.md': 'reference/checks.md'
        'design/discovery.md': 'use/discovery.md'
        'design/export.md': 'reference/export.md'
        'design/expressions.md': 'reference/expressions.md'
        'design/generation.md': 'reference/generation.md'
        'design/held-to.md': 'reference/held-to.md'
        'design/imports.md': 'use/imports.md'
        'design/index.md': 'reference/index.md'
        'design/layers.md': 'use/layers.md'
        'design/plugin.md': 'maintaining/plugin.md'
        'design/reports.md': 'use/cli/report.md'
        'design/shaping-a-type.md': 'framework/shaping-a-type.md'
        'framework/automation.md': 'use/ci.md#what-the-checks-ask'
        'getting-started.md': 'use/getting-started.md'
        'one-corpus-or-several.md': 'use/one-corpus-or-several.md'
        'skills.md': 'use/skills.md'
        'troubleshooting.md': 'use/troubleshooting.md'

# The verb alone in the sidebar. Each page's own heading then says what that verb does.
nav:
  - Introduction: index.md
  - Use it:
      - use/index.md
      - Compared with alternatives: use/compared.md
      - Getting started: use/getting-started.md
      - One corpus or several: use/one-corpus-or-several.md
      - Running it in CI: use/ci.md
      - Troubleshooting: use/troubleshooting.md
      - The corpus descriptor: use/corpus-descriptor.md
      - Discovery: use/discovery.md
      - Layers: use/layers.md
      - Imports: use/imports.md
      - Skills: use/skills.md
      - CLI reference:
          - use/cli/index.md
          - new: use/cli/new.md
          - validate: use/cli/validate.md
          - generate: use/cli/generate.md
          - restore: use/cli/restore.md
          - export: use/cli/export.md
          - bundle: use/cli/bundle.md
          - pack: use/cli/pack.md
          - checks: use/cli/checks.md
          - report: use/cli/report.md
          - update: use/cli/update.md
  - The framework:
      - framework/index.md
      - Principles: framework/principles.md
      - Taxonomy: framework/taxonomy.md
      - The default types: framework/types.md
      - Metadata: framework/metadata.md
      - Contributing: framework/contributing.md
      - Lineage: framework/lineage.md
      - Shaping a type: framework/shaping-a-type.md
  - Schema reference:
      - reference/index.md
      - Rule expressions: reference/expressions.md
      - Checks: reference/checks.md
      - What the schema is held to: reference/held-to.md
      - Generation: reference/generation.md
      - The export format: reference/export.md
  - Maintaining kac:
      - maintaining/index.md
      - Architecture: maintaining/architecture.md
      - Build, test and release: maintaining/build-test-release.md
      - Forking: maintaining/forking.md
      - Contributing: maintaining/contributing.md
      - The documentation charter: maintaining/charter.md
      - Checks in C#: maintaining/checks.md
      - Adding a report: maintaining/reports.md
      - The plugin bundle: maintaining/plugin.md
  - Changelog: changelog.md
