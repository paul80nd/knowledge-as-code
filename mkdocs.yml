# The documentation site for `kac`, published to GitHub Pages by .github/workflows/publish-docs.yml.
#
# The site documents the tool. It is not a corpus, and `publishing-target: mkdocs` in a corpus descriptor is a
# separate thing that this build does not exercise. MkDocs is here because it is what tool documentation uses.
#
# `docs/` holds every page and nothing else does: a page in both trees is the drift this site exists to end.

site_name: knowledge-as-code
site_description: Validator and generator for a knowledge-as-code corpus, driven by its own schema.
site_url: https://paul80nd.github.io/knowledge-as-code/
site_author: Paul Law

repo_url: https://github.com/paul80nd/knowledge-as-code
repo_name: paul80nd/knowledge-as-code
edit_uri: edit/main/docs/

copyright: MIT licensed.

# Strict mode fails a dead link. A page the nav does not list is only reported at INFO, so `NavigationTests` has it.
strict: true

# The pins the workflow installs from. It sits beside the pages so Dependabot finds one directory, and the
# site is not a place to serve it from.
exclude_docs: |
  requirements.txt

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    # `edit_uri` above renders as a pencil on each page only where this feature is on.
    - content.action.edit
    - content.code.copy
    - navigation.footer
    # `navigation.indexes` puts each section's own index page behind the section's name. Without
    # `navigation.sections` beside it, the two sections then collapse, so a reader browsing the flat
    # pages is not scrolling past sixteen entries to reach the changelog.
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    # The reader's own setting decides, and the two toggles below override it either way.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system setting
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light

# Two gaps in the sidebar, and nothing else. `docs/assets/extra.css` says which and why.
extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # A ```mermaid block is rendered as a diagram rather than as code. The fence is the plain one GitHub
  # renders natively, so one file draws the same picture on the site and in the repository, and a corpus
  # publishing to an Azure DevOps wiki needs nothing else. `docs/design/generation.md` carries the subset
  # every diagram here is held to, which is narrower than Mermaid's own.
  #
  # The theme fetches https://unpkg.com/mermaid@11/dist/mermaid.min.js at page load, and only for a page
  # carrying one of these. It is the one thing this site asks of a host other than Pages, the version is
  # the theme's to choose rather than ours to pin, and a reader who cannot reach unpkg.com reads the
  # diagram's source instead of seeing the picture. Every such block renders on github.com either way.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Publishes tooling/kac/CHANGELOG.md without a second copy of it, so the file stays beside the project whose
  # versions it records. `check_paths` fails a moved path rather than publishing an empty page.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

# The verb alone in the sidebar. Each page's own heading then says what that verb does, which is the line
# a reader wants once they are on the page and noise in a list of eight.
nav:
  - Introduction: index.md
  - Getting started: getting-started.md
  - Running it in CI: ci.md
  - Troubleshooting: troubleshooting.md
  - The framework:
      - framework/index.md
      - Principles: framework/principles.md
      - Taxonomy: framework/taxonomy.md
      - The default types: framework/types.md
      - Metadata: framework/metadata.md
      - Contributing: framework/contributing.md
      - Automation: framework/automation.md
      - Lineage: framework/lineage.md
  - CLI reference:
      - cli/index.md
      - new: cli/new.md
      - validate: cli/validate.md
      - generate: cli/generate.md
      - restore: cli/restore.md
      - export: cli/export.md
      - bundle: cli/bundle.md
      - pack: cli/pack.md
      - checks: cli/checks.md
      - update: cli/update.md
  - Design:
      - design/index.md
      - Discovery: design/discovery.md
      - Checks: design/checks.md
      - Rule expressions: design/expressions.md
      - What the schema is held to: design/held-to.md
      - Generation: design/generation.md
      - The export format: design/export.md
      - The plugin bundle: design/plugin.md
      - Layers: design/layers.md
  - The corpus descriptor: corpus-descriptor.md
  - Changelog: changelog.md
