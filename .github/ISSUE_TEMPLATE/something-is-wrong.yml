name: Something is wrong
description: A defect, a contradiction, or a place where the documentation and the tool disagree.

body:
  - type: markdown
    attributes:
      value: |
        Issues here are working notes rather than a queue. They are read and considered, some sit for a while, and
        none are assigned. This repository is not taking contributions —
        [CONTRIBUTING](https://github.com/paul80nd/knowledge-as-code/blob/main/.github/CONTRIBUTING.md) says why.

        Where the documentation and the tool disagree, the tool is the more useful half of the report: it is
        executable and the prose is not.

  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: A file path, a check name, or the command you ran.
      placeholder: .schema/adrs.yaml, or ./kac validate

  - type: input
    id: commit
    attributes:
      label: Commit
      description: There are no releases, so the commit you are on if you have it.
