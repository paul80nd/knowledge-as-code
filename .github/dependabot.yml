# What Dependabot keeps current in this repository.
#
# Every project under `tooling/` carries ordinary `PackageReference`s and is tracked below.
# Two pins sit outside what Dependabot reads. `kac-tests.cs` is a file-based app, and a
# `#:package` directive is not a manifest — dependabot-core#15184 is the request that it should.
# It pins nothing today, so there is nothing there to move by hand. actionlint is a Go binary
# installed by version in workflows/kac.yml, and that line is moved by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The pins in the GitHub Actions starter a new corpus receives. The entry above reads `.github/workflows` alone.
  - package-ecosystem: github-actions
    directory: /template/.github/workflows
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directories:
      - /tooling/kac
      - /tooling/kac.core
      - /tooling/kac.features
      - /tooling/kac.tests
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # The test packages move as a set. `Reqnroll.xunit.v3` is built against a particular
      # `xunit.v3`, and both test projects carry the same three, so raised one at a time
      # they would arrive as pull requests that cannot be merged alone.
      test-packages:
        patterns:
          - xunit*
          - Reqnroll*
          - Microsoft.NET.Test.Sdk
      # tol-spectre-console approves both at one range, and one assessment covers them together.
      spectre:
        patterns:
          - Spectre.Console*

  # MkDocs and its theme, pinned in docs/requirements.txt so a theme release changes the site when we take it.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
    # From 1.2.3, mkdocs-redirects requires properdocs. tol-mkdocs-redirects says why, and #1058 decides the toolchain.
    ignore:
      - dependency-name: mkdocs-redirects
        versions: [">= 1.2.3"]

  # yamllint, pinned in .github/requirements.txt, so a linter release changes what the gate rejects
  # when we take it. actionlint sits beside it in the same job and is a Go binary with no manifest,
  # so its pin is moved by hand and workflows/kac.yml says what it pins today.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
