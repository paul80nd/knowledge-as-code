# What Dependabot keeps current in this repository.
#
# Every project under `tooling/` carries ordinary `PackageReference`s and is tracked below.
# One pin sits outside what Dependabot reads. actionlint is a Go binary installed by version in
# workflows/kac.yml, and that line is moved by hand.
#
# Every ecosystem waits seven days before it proposes a new release, so a compromised one has a week
# to be found and withdrawn before it reaches a pull request. A security update is never delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown: {default-days: 7}
    commit-message:
      prefix: ci

  # The pins in the GitHub Actions starter a new corpus receives. The entry above reads `.github/workflows` alone.
  - package-ecosystem: github-actions
    directory: /template/.github/workflows
    schedule:
      interval: weekly
    cooldown: {default-days: 7}
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directories:
      - /tooling/kac
      - /tooling/kac.core
      - /tooling/kac.features
      - /tooling/kac.goldens
      - /tooling/kac.tests
    schedule:
      interval: weekly
    cooldown: {default-days: 7}
    commit-message:
      prefix: build
    groups:
      # The test packages move as a set. `Reqnroll.xunit.v3` is built against a particular
      # `xunit.v3`, so raised one at a time they would arrive as pull requests that cannot be
      # merged alone.
      test-packages:
        patterns:
          - xunit*
          - Reqnroll*
      # tol-spectre-console approves both at one range, and one assessment covers them together.
      spectre:
        patterns:
          - Spectre.Console*

  # global.json pins the SDK with `rollForward: disable`, so CI and a contributor build with one version.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown: {default-days: 7}
    commit-message:
      prefix: build
    # tol-dotnet-sdk approves the 10.0 line, so a new major is a decision for that record and not a patch.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # Zensical, pinned in docs/requirements.txt so a release of the site generator changes the site when we take it.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    cooldown: {default-days: 7}
    commit-message:
      prefix: docs

  # yamllint and zizmor, pinned in .github/requirements.txt, so a linter release changes what the gate
  # rejects when the pin moves. actionlint runs in the same job and is a Go binary with no manifest,
  # so its pin is moved by hand and workflows/kac.yml says what it pins today.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown: {default-days: 7}
    commit-message:
      prefix: ci
