# What Dependabot keeps current in this repository.
#
# Every project under `tooling/` carries ordinary `PackageReference`s and is tracked below.
# `kac-tests.cs` is the exception: it is a file-based app, and a `#:package` directive is not
# a manifest Dependabot reads — dependabot-core#15184 is the request that it should. It pins
# nothing today, so there is nothing there to move by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directories:
      - /tooling/kac
      - /tooling/kac.core
      - /tooling/kac.features
      - /tooling/kac.tests
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # The test packages move as a set. `Reqnroll.xunit.v3` is built against a particular
      # `xunit.v3`, and both test projects carry the same three, so raised one at a time
      # they would arrive as pull requests that cannot be merged alone.
      test-packages:
        patterns:
          - xunit*
          - Reqnroll*
          - Microsoft.NET.Test.Sdk

  # MkDocs and its theme, pinned in docs/requirements.txt so a theme release changes the site when we take it.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
