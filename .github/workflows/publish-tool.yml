# Publishing the kac tool to nuget.org (GitHub Actions).
#
# publish-plugin.yml publishes what the corpus knows; this publishes the tool that reads it. Both run on
# a push to main, and both take the version from the source rather than from the run — the plugin's from
# `content-version` in .corpus.yaml, the tool's from `<Version>` in tooling/kac/kac.csproj. A push whose
# version is already published does nothing but say so, which is what most merges do here.
#
# The version is hand-moved before the merge rather than read from a tag. A published version is a
# promise about the command surface, and nothing can derive that from a diff, so it is written down
# beside the thing it describes. It also leaves one habit covering both artefacts instead of two.
#
# A published version is permanent: nuget.org will unlist one but never free the number, so a broken
# 0.1.0 cannot be replaced, only followed by 0.1.1. That is why all three test layers run again here,
# and why the package pushed is the package that was proved rather than a second build of it.
#
# Nothing here holds a publishing key. nuget.org is told once, in a trusted publishing policy, that it
# trusts this repository's `publish-tool.yml` running in the `nuget.org` environment; the run then proves
# it is that by exchanging a token GitHub signs for a key good for an hour. So there is no long-lived
# credential to leak, rotate or store, and a fork of this repository cannot publish under this name.

name: publish-tool

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Two merges in quick succession would otherwise race. nuget.org lists an accepted version minutes after
# it takes it, so the second run would read a version list that does not yet name what the first sent.
# Queued rather than cancelled: the loser may carry a version the winner does not.
concurrency:
  group: publish-tool
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hung step would otherwise hold the concurrency group for the runner's six-hour default and queue
    # every merge behind it. Twenty minutes is several times the longest run this does.
    timeout-minutes: 20
    # `id-token: write` lets GitHub issue this job the signed token nuget.org exchanges for a key. It is
    # the whole of what the job is trusted with, and it is granted here rather than at the top of the file
    # so that it belongs to the one job that publishes.
    permissions:
      contents: read
      id-token: write
    # Named in the trusted publishing policy as well as here, so nuget.org accepts a token only from a run
    # that reached this environment. It is also where a required reviewer would be added, which would put
    # a human between a merge and a publish.
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/KnowledgeAsCode.Tool
    steps:
      # Actions are pinned to a commit rather than a tag: a tag is mutable, so a moved tag would
      # change what runs here without changing this file. Dependabot moves the pins, and the trailing
      # comment is what makes the diff legible when it does.
      - name: Check out the commit that merged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Asked first, so a merge that moved no version costs a checkout and a web request rather than the
      # whole suite. Every step below is held to what this decides.
      #
      # The version is read from the project rather than from a packed file, because nothing is packed
      # yet. `dotnet pack` reads the same property, and the push at the foot names the file by this
      # version, so a package that came out under a different one fails there rather than being sent.
      #
      # The flat container lists every version of a package under its lowercased id, and answers 404 for
      # a package that has never been published — the first run here, and not a failure.
      - name: Decide whether this version is new
        id: decide
        run: |
          set -e

          VERSION=$(dotnet msbuild tooling/kac/kac.csproj -getProperty:Version)
          INDEX=https://api.nuget.org/v3-flatcontainer/knowledgeascode.tool/index.json

          NEW=true
          if curl -sf "$INDEX" -o "$RUNNER_TEMP/versions.json"; then
            if jq -e --arg v "$VERSION" '.versions | index($v)' "$RUNNER_TEMP/versions.json" > /dev/null; then
              NEW=false
            fi
          fi

          if [ "$NEW" = false ]; then
            echo "version $VERSION is already on nuget.org — nothing to publish."
          else
            echo "version $VERSION is not on nuget.org — it will be published."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      # The gate ran these against the pull request's head. What merged is a different commit, because
      # main moved beneath it, so the three layers are asked again before anything permanent happens.
      - name: Run kac.core unit tests
        if: steps.decide.outputs.new == 'true'
        run: dotnet test tooling/kac.tests

      - name: Run kac feature tests
        if: steps.decide.outputs.new == 'true'
        run: dotnet test tooling/kac.features

      - name: Run the golden test suite
        if: steps.decide.outputs.new == 'true'
        run: dotnet run tooling/kac-tests.cs

      # Packed once. Both steps below read this same file and it is this file that is pushed, so what
      # nuget.org receives is what was proved rather than a rebuild that agreed with it at the time.
      #
      # `dotnet pack` also fails on package metadata that has gone missing — a readme the project names
      # and nobody wrote, a licence expression that is not one — which none of the three layers notice.
      - name: Pack the tool
        if: steps.decide.outputs.new == 'true'
        run: dotnet pack tooling/kac/kac.csproj -o .dist/pack

      # A tool package can be well-formed and still not resolve to a runnable command. `--version` is the
      # one question that needs no corpus, so it is asked from a directory that is not one.
      - name: Install what was packed and ask it its version
        if: steps.decide.outputs.new == 'true'
        run: |
          dotnet tool install --tool-path .dist/tools --add-source .dist/pack KnowledgeAsCode.Tool
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.dist/tools/kac" --version

      # The key this returns is good for an hour and can be issued only once per token, so it is asked for
      # last — with the package already packed and proved, and the push as the very next thing that runs.
      - name: Exchange this job's identity for a short-lived nuget.org key
        id: nuget-login
        if: steps.decide.outputs.new == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org profile name, not the email address. Held as a secret because nuget.org's own
          # guidance asks for that, and it is the only thing this workflow still takes from outside itself.
          user: ${{ secrets.NUGET_USER }}

      # `--skip-duplicate` covers the window the decision above cannot see into: nuget.org accepts a
      # version minutes before it lists one, so a run inside that window reads a list that does not name
      # it yet. Without this, that run fails on a conflict rather than passing with nothing to do.
      - name: Publish to nuget.org
        if: steps.decide.outputs.new == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -e

          dotnet nuget push ".dist/pack/KnowledgeAsCode.Tool.$VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

          echo "published version $VERSION to nuget.org."
