# Publishes what landed. On every push to main it rebuilds each worked corpus's export and bundle from
# the merge commit and writes them to the `marketplace` branch, which is what a reader adds to Claude
# Code. One marketplace, one directory per plugin, assembled here because `bundle` runs in one corpus
# and knows only that corpus's own.
#
# The corpora are here so that somebody deciding whether to adopt the framework can install one and ask
# it questions. Every one but `dog-fooding` describes an invented estate and is meant to. `dog-fooding`
# describes the repository they all come from. Each plugin's description says which it is, and
# `.corpus.yaml` is where the corpus states it.
#
# One job here holds write, and the branch is what makes that safe: orphaned, never merged back, and
# holding no file anyone authors, so nothing CI builds can reach the source a human edits. The one
# place that could go wrong is the emptied worktree below, which is asserted rather than assumed.
#
# The two jobs exist so nothing unpinned runs beside the token. The Claude Code CLI is installed at
# `latest` on purpose, so it belongs where a moved tag cannot reach a push. Do not merge them back.

name: publish-plugin

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Queued rather than cancelled: the loser still carries a version the winner does not.
concurrency:
  group: publish-marketplace
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # The corpora that publish a plugin, in the order the marketplace lists them. A corpus joins by
  # adopting a type something in the plugin tree reads, or it ships a plugin with no component in it.
  CORPORA: 'library engineering payments dog-fooding'

jobs:
  # Everything that has to be true before anything is published, in a job that cannot publish.
  verify:
    strategy:
      fail-fast: false
      matrix:
        corpus:
          - library
          - engineering
          - payments
          - dog-fooding
    runs-on: ubuntu-latest
    # Stated rather than inherited: it is why an unpinned CLI may run in this job.
    permissions:
      contents: read
    # Short enough that a hung `npm install` fails rather than holding the group for six hours.
    timeout-minutes: 20
    steps:
      # Pinned to a commit because a tag is mutable. Dependabot moves the pins.
      - name: Check out the commit that merged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # payments and dog-fooding name `../engineering/.dist/package` as their `source:`, and `kac pack`
      # is what writes there. Each job holds its own checkout, so this step packs engineering itself
      # rather than taking what the engineering job already produced.
      - name: Build the package this corpus consumes
        if: matrix.corpus == 'payments' || matrix.corpus == 'dog-fooding'
        working-directory: examples/engineering
        run: |
          dotnet run --project ../../tooling/kac -- export
          dotnet run --project ../../tooling/kac -- pack

      # .imports/ is not committed, so a fresh checkout holds none of it and `validate` fails naming
      # this command. A corpus consuming nothing skips the step.
      - name: Restore what this corpus consumes
        if: matrix.corpus == 'payments' || matrix.corpus == 'dog-fooding'
        working-directory: examples/${{ matrix.corpus }}
        run: dotnet run --project ../../tooling/kac -- restore

      # The gate ran against the pull request's head, and main moved beneath it, so this asks again.
      - name: Validate frontmatter, links and structure
        working-directory: examples/${{ matrix.corpus }}
        run: dotnet run --project ../../tooling/kac -- validate

      - name: Build the export
        working-directory: examples/${{ matrix.corpus }}
        run: dotnet run --project ../../tooling/kac -- export

      - name: Assemble the plugin bundle
        working-directory: examples/${{ matrix.corpus }}
        run: dotnet run --project ../../tooling/kac -- bundle

      # Unpinned for the reason kac.yml gives, which holds only where the CLI cannot reach a push.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # The last thing between a broken bundle and the people who have it installed.
      - name: Validate the assembled plugin and its marketplace
        working-directory: examples/${{ matrix.corpus }}
        run: |
          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict

  # The only job granted write. It rebuilds rather than taking an artifact from `verify`: two runs
  # from one commit produce identical bytes but for the manifest's `generatedAt`, so a hand-off would
  # preserve nothing and add a second way for the two trees to disagree.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Shorter than `verify` because there is no npm here, and long enough that a push waiting on a
    # remote lock fails rather than parking the concurrency group for six hours.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Whole history: the publish commits on top of a fetched branch tip, and a shallow parent is
      # the one shape of push worth not discovering in production.
      - name: Check out the commit that merged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # An export carries what its corpus consumes, and refuses where nothing is restored for one. So
      # the producer's package is built and restored before the loop below reaches a consumer, as
      # `verify` already does. This job holds its own checkout, so nothing `verify` did is on it.
      - name: Build and restore the package a corpus here consumes
        run: |
          set -e

          ( cd examples/engineering \
            && dotnet run --project ../../tooling/kac -- export \
            && dotnet run --project ../../tooling/kac -- pack )

          for consumer in payments dog-fooding; do
            ( cd "examples/$consumer" && dotnet run --project ../../tooling/kac -- restore )
          done

      # Each corpus in turn, because the branch holds one marketplace offering every plugin. `bundle`
      # writes a marketplace naming the corpus it ran in, which is what installs a plugin from a path
      # while it is being proved. The published one offers them all at once, and is assembled below.
      - name: Build every plugin the marketplace offers
        run: |
          set -e

          for corpus in $CORPORA; do
            ( cd "examples/$corpus" \
              && dotnet run --project ../../tooling/kac -- export \
              && dotnet run --project ../../tooling/kac -- bundle )
          done

      # Claude Code offers an update only when a manifest's `version` string changes, so a push
      # carrying the same content-version reaches nobody. Every plugin matching what the branch
      # already holds ends the job here rather than leaving a commit that says otherwise.
      - name: Decide whether anything is new
        env:
          BRANCH: marketplace
        run: |
          set -e

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
          fi

          NEW=''
          for corpus in $CORPORA; do
            BUILT=$(jq -r '.version' "examples/$corpus/.dist/plugin/.claude-plugin/plugin.json")
            NAME=$(jq -r '.name' "examples/$corpus/.dist/plugin/.claude-plugin/plugin.json")

            PUBLISHED=$(git show "origin/$BRANCH:$NAME/.claude-plugin/plugin.json" 2> /dev/null \
              | jq -r '.version // empty')

            if [ "$BUILT" != "$PUBLISHED" ]; then
              echo "$NAME $BUILT is new; the branch holds ${PUBLISHED:-nothing}."
              NEW=yes
            else
              echo "$NAME $BUILT is already on $BRANCH."
            fi
          done

          if [ -z "$NEW" ]; then
            echo "every plugin is already published. Nothing to publish."
            echo "Bump content-version in the corpus you changed to release it."
          fi

          echo "NEW=$NEW" >> "$GITHUB_ENV"

      - name: Publish the marketplace branch
        if: env.NEW == 'yes'
        env:
          BRANCH: marketplace
          MARKETPLACE: knowledge-as-code
          WORKTREE: ${{ runner.temp }}/marketplace
        run: |
          set -e

          EXISTS=''
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            EXISTS=yes
          fi

          # A worktree rather than a second clone, so the branch is built with the credentials the
          # checkout already holds. The push at the foot names the ref it writes, so neither arm
          # needs a local branch whatever shape it leaves HEAD in.
          if [ -n "$EXISTS" ]; then
            git worktree add --detach "$WORKTREE" "origin/$BRANCH"
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" checkout --orphan "$BRANCH"
          fi

          # `checkout --orphan` keeps the index and working tree by design, so until this runs the
          # worktree still holds every file in main and the `git add -A` below would stage them.
          # Asserted rather than assumed: this is what keeps the source out of the published branch.
          git -C "$WORKTREE" rm -rf --quiet .

          if [ -n "$(git -C "$WORKTREE" ls-files)" ]; then
            echo "the worktree still tracks files after being emptied — refusing to publish over the source."
            exit 1
          fi

          # One directory per plugin, named for the plugin, because that is what the marketplace
          # entries below point at. The export is left behind: each plugin already carries the same
          # bytes under `corpus/`.
          ENTRIES=''
          ROWS=''
          for corpus in $CORPORA; do
            BUILT="examples/$corpus/.dist/plugin"
            NAME=$(jq -r '.name' "$BUILT/.claude-plugin/plugin.json")
            cp -R "$BUILT" "$WORKTREE/$NAME"

            ENTRY=$(jq -c --arg name "$NAME" --arg source "./$NAME" \
              '{name: $name, description: .description, source: $source}' \
              "$BUILT/.claude-plugin/plugin.json")
            ENTRIES="$ENTRIES$ENTRY,"

            VERSION=$(jq -r '.version' "$BUILT/.claude-plugin/plugin.json")
            ROWS="$ROWS| \`$NAME\` | \`$VERSION\` |
          "
          done

          # One marketplace offering every plugin, which `bundle` does not write because it runs in one
          # corpus and knows only that corpus's own.
          mkdir -p "$WORKTREE/.claude-plugin"
          echo "[${ENTRIES%,}]" | jq \
            --arg marketplace "$MARKETPLACE" \
            '{"$schema": "https://anthropic.com/claude-code/marketplace.schema.json",
              name: $marketplace,
              description: "The worked example corpora that ship with knowledge-as-code, each as an installable plugin.",
              owner: {name: "Paul Law"},
              plugins: .}' > "$WORKTREE/.claude-plugin/marketplace.json"

          # Tells someone arriving in a browser where the source is, that these corpora are invented,
          # and that editing here is pointless.
          cat > "$WORKTREE/README.md" <<EOF
          # knowledge-as-code — the plugin marketplace

          Generated. Every file here is built by [\`publish-plugin.yml\`][workflow] on each push to
          \`main\` and replaced whole on the next one. Nothing here is edited by hand, and this branch
          is never merged into \`main\`.

          [workflow]: https://github.com/$GITHUB_REPOSITORY/blob/main/.github/workflows/publish-plugin.yml

          The source is on [\`main\`](https://github.com/$GITHUB_REPOSITORY).

          ## What these are

          Each plugin here carries one of the **worked corpora** that ship with knowledge-as-code. Install
          one and ask it questions. The estates they describe are invented and govern nobody, except
          \`example-dogfooding\`, which describes the repository they all come from.

          ## Installing

          \`\`\`
          /plugin marketplace add $GITHUB_REPOSITORY@$BRANCH
          /plugin install <plugin>@$MARKETPLACE
          \`\`\`

          ## This build

          | Plugin | Corpus content version |
          |---|---|
          $ROWS
          Built from [\`$GITHUB_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).
          EOF

          cd "$WORKTREE"
          git add -A

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish the $MARKETPLACE marketplace" \
                     -m "Built from $GITHUB_SHA."

          git push origin "HEAD:refs/heads/$BRANCH"

          echo "published $MARKETPLACE to $BRANCH."
