# Publishing the plugin bundle (GitHub Actions).
#
# kac.yml proves a change before it lands; this publishes what landed. On every push to main it
# rebuilds the export and the bundle from the commit that merged, and writes the result to the
# `marketplace` branch — the branch a reader adds to Claude Code.
#
# One job here is granted write, and the rule the other two files state is what makes that safe
# rather than an exception to it. "A workflow must never push" is about generated files landing back
# over the source a human edits, which is the failure `index --check` is shaped around: CI and an
# author write the same file and the author loses. The `marketplace` branch shares no commit with
# main, nothing merges it back, and it holds no file anyone authors. So no branch carrying
# human-authored source is ever written to here, and there is no path by which published output
# reaches the source tree. The rule holds by construction rather than by discipline, and that is why
# the branch is orphaned rather than merely separate, and why the one place the orphan could carry
# the source out is asserted rather than assumed.
#
# The work is split across two jobs so that the write is scoped as narrowly as the checkout is.
# `verify` proves the bundle and holds read; `publish` writes the branch and holds write. Nothing
# unpinned runs in the job holding the token: the Claude Code CLI is installed at `latest` on
# purpose, and `latest` is a moving target, so it belongs where a moved tag cannot reach a push.
# Do not merge the two jobs back to save a build — that is what the split costs and what it buys.
#
# Unlike `.tooling/tests/round-trip.sh`, the script below is not shared with azure-pipelines.yml —
# publishing to Azure DevOps is a pipeline of its own rather than a translation of this one, for
# the same reason both CI files are forked in .tooling/manifest.yaml. So it uses `$(...)` freely,
# where a script the two platforms share cannot.

name: publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Two merges in quick succession would otherwise race for the same branch tip. Queued rather than
# cancelled: the loser still carries a version the winner does not.
concurrency:
  group: publish-marketplace
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # Everything that has to be true before anything is published, in a job that cannot publish.
  verify:
    runs-on: ubuntu-latest
    # Stated rather than inherited from the file default. It is the reason an unpinned CLI is
    # allowed to run here at all, so it should be readable without scrolling up.
    permissions:
      contents: read
    # A hung `npm install` would otherwise hold the concurrency group for the runner's six-hour
    # default and queue every merge behind it. Twenty minutes is several times the longest run this
    # does, so it fires on a hang rather than on a slow morning.
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit rather than a tag: a tag is mutable, so a moved tag would
      # change what runs here without changing this file. Dependabot moves the pins, and the trailing
      # comment is what makes the diff legible when it does.
      - name: Check out the commit that merged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # One invocation per subcommand, run sequentially. File-based apps share build output, so the
      # kac runs must not execute concurrently.
      #
      # The gate ran against the pull request's head. What merged is a different commit, because
      # main moved beneath it, so the corpus is validated once more before anything is published.
      - name: Validate frontmatter, links and structure
        run: dotnet run .tooling/kac.cs -- validate

      - name: Build the export
        run: dotnet run .tooling/kac.cs -- export

      - name: Assemble the plugin bundle
        run: dotnet run .tooling/kac.cs -- bundle

      # Taken at `latest` rather than pinned, for the reason kac.yml gives: the bundle has to be
      # valid against the CLI a reader actually runs, so pinning it would settle into proving the
      # bundle against a CLI nobody has. That reason holds only where the CLI cannot reach a push,
      # which is what confines this step and the one after it to the read-only job.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # The last thing standing between a broken bundle and the people who have it installed. The
      # gate ran this too; running it again is what covers the merge commit it never saw.
      - name: Validate the assembled plugin and its marketplace
        run: |
          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict

  # The only job granted write, and the only one that writes a ref on the remote.
  #
  # It rebuilds rather than taking an artifact from `verify`. The two builds differ only in the
  # export manifest's `generatedAt` — `export.md` states that two runs from one commit produce
  # identical bytes but for that field — so there is nothing an artifact hand-off would preserve,
  # and it would add a second way for the published tree to disagree with the validated one.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Shorter than `verify` because there is no npm here, and long enough that a push waiting on a
    # remote lock fails rather than parking the concurrency group for six hours.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The whole history rather than the last commit. The publish below commits on top of the
      # branch tip it fetched, and a commit whose parent arrived in a shallow fetch is the one shape
      # of push worth not discovering in production.
      - name: Check out the commit that merged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Every link the export writes names the commit HEAD stands on, which here is the commit that
      # merged — a commit the raw host serves. One invocation per subcommand, run sequentially.
      - name: Build the export
        run: dotnet run .tooling/kac.cs -- export

      - name: Assemble the plugin bundle
        run: dotnet run .tooling/kac.cs -- bundle

      # A version that has not moved publishes nothing. Claude Code pins an installed plugin to the
      # `version` in its manifest and offers an update only when that string changes, so a push
      # carrying the same content-version reaches nobody and leaves a commit saying otherwise. The
      # version already on the branch is read first, and a match ends the job here.
      #
      # `kac bundle` stamps the corpus content-version into the manifest, so this compares the two
      # corpora rather than two build numbers. The consequence is the one the corpus asks for: a
      # change to a record that does not move content-version in .corpus.yaml is not published.
      - name: Publish the bundle to the marketplace branch
        env:
          BRANCH: marketplace
          WORKTREE: ${{ runner.temp }}/marketplace
        run: |
          set -e

          BUILT=$(jq -r '.version' .dist/plugin/.claude-plugin/plugin.json)

          # Both names are read rather than written down, the way round-trip.sh reads them: a corpus
          # names its own plugin and its own marketplace, and the two words a reader types to install
          # are those names rather than anything this file knows.
          PLUGIN=$(jq -r '.plugins[0].name' .dist/.claude-plugin/marketplace.json)
          MARKETPLACE=$(jq -r '.name' .dist/.claude-plugin/marketplace.json)

          PUBLISHED=''
          EXISTS=''
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            EXISTS=yes
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            PUBLISHED=$(git show "origin/$BRANCH:plugin/.claude-plugin/plugin.json" 2> /dev/null \
              | jq -r '.version // empty')
          fi

          if [ "$BUILT" = "$PUBLISHED" ]; then
            echo "content-version $BUILT is already on $BRANCH — nothing to publish."
            exit 0
          fi

          # A worktree rather than a second clone, so the branch is built with the credentials the
          # checkout already holds. The two arms leave HEAD in different shapes — detached at the
          # published tip, or on the unborn branch `--orphan` creates — and neither needs a local
          # branch of its own, because the push at the foot names the ref it writes rather than
          # relying on whatever HEAD is called.
          if [ -n "$EXISTS" ]; then
            git worktree add --detach "$WORKTREE" "origin/$BRANCH"
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" checkout --orphan "$BRANCH"
          fi

          # Emptied in both arms, so the branch holds what this build put there and nothing a
          # previous one left. It is also the whole of the orphan case's safety: `checkout --orphan`
          # keeps the index and the working tree by design, so until this has run the worktree still
          # holds every file in main, and the `git add -A` below would stage them. Asserted rather
          # than assumed, because that assertion is what makes "no path from what CI builds to the
          # source" a property of this script instead of a claim about it.
          git -C "$WORKTREE" rm -rf --quiet .

          if [ -n "$(git -C "$WORKTREE" ls-files)" ]; then
            echo "the worktree still tracks files after being emptied — refusing to publish over the source."
            exit 1
          fi

          # `.dist/` is the marketplace root, so its contents become the branch root: the plugin
          # source in marketplace.json is `./plugin` and resolves against whatever directory holds
          # `.claude-plugin/`. The export is left behind — the plugin carries its own copy under
          # `corpus/`, and the one at `.dist/export/` is the same bytes a second time.
          cp -R .dist/.claude-plugin "$WORKTREE/.claude-plugin"
          cp -R .dist/plugin "$WORKTREE/plugin"

          # Someone arriving at this branch in a browser sees generated files and no source. This is
          # what tells them where the source is and that editing here is pointless.
          cat > "$WORKTREE/README.md" <<EOF
          # knowledge-as-code — the plugin marketplace

          Generated. Every file here is built by
          [\`.github/workflows/publish.yml\`](https://github.com/$GITHUB_REPOSITORY/blob/main/.github/workflows/publish.yml)
          on each push to \`main\` and replaced whole on the next one. Nothing here is edited by hand,
          and this branch is never merged into \`main\`.

          The source is on [\`main\`](https://github.com/$GITHUB_REPOSITORY).

          ## Installing

          \`\`\`
          /plugin marketplace add $GITHUB_REPOSITORY@$BRANCH
          /plugin install $PLUGIN@$MARKETPLACE
          \`\`\`

          ## This build

          | | |
          |---|---|
          | Corpus content version | \`$BUILT\` |
          | Built from | [\`$GITHUB_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |
          EOF

          cd "$WORKTREE"
          git add -A

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish $PLUGIN $BUILT" \
                     -m "Built from $GITHUB_SHA."

          git push origin "HEAD:refs/heads/$BRANCH"

          echo "published content-version $BUILT to $BRANCH."
