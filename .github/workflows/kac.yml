# The gate on a pull request: kac run over each corpus under examples/ and over the one at template/,
# a corpus stood up from nothing by the packed tool, the plugin each corpus builds, and the tool's own
# three test layers. The corpus half mirrors examples/library/azure-pipelines.yml, which is a corpus's
# own pipeline and therefore reads no template/.
#
# Nothing CI produces is written back over a file a human edits, and read-only permission is what
# keeps it that way. `generate --check` only reports staleness, naming the command to run locally.

name: kac

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # Every corpus, in parallel. Each declares a different `types:`, so running all three is what proves
  # the framework holds for a corpus that adopted a subset and not only for one that adopted the lot.
  # Each writes its own .dist/ under its own root, so the three never collide.
  corpora:
    strategy:
      fail-fast: false
      matrix:
        corpus:
          - library
          - engineering
          - payments
    runs-on: ubuntu-latest
    # kac takes the first ancestor holding a .corpus.yaml as the corpus, so the working directory is
    # what selects one. There is no flag that names a corpus.
    defaults:
      run:
        working-directory: examples/${{ matrix.corpus }}
    steps:
      # Pinned to a commit because a tag is mutable. Dependabot moves the pins.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # payments consumes engineering, and what it consumes is a sealed package rather than the corpus
      # next door. So the producer's package is built here before the consumer asks for it. Each job
      # holds its own checkout, so nothing another job in this matrix did is on this runner.
      - name: Build the package this corpus consumes
        if: matrix.corpus == 'payments'
        working-directory: examples/engineering
        run: |
          dotnet run --project ../../tooling/kac -- export
          dotnet run --project ../../tooling/kac -- pack

      # .imports/ is not committed, so a fresh checkout holds none of it and `validate` fails naming
      # this command. A corpus consuming nothing skips the step.
      - name: Restore what this corpus consumes
        if: matrix.corpus == 'payments'
        run: dotnet run --project ../../tooling/kac -- restore

      - name: Validate frontmatter, links and structure
        run: dotnet run --project ../../tooling/kac -- validate

      - name: Check generated output is fresh
        run: dotnet run --project ../../tooling/kac -- generate --check

      # Each corpus holds a materialised copy of what the template sends, so this is what keeps every
      # tree equal to the template in both directions.
      - name: Check the corpus is in step with the template
        run: dotnet run --project ../../tooling/kac -- update --check --from ../../

      - name: Build the export
        run: dotnet run --project ../../tooling/kac -- export

      - name: Assemble the plugin bundle
        run: dotnet run --project ../../tooling/kac -- bundle

      # Only the corpus that publishes. A pack is refused without a shortcode, and engineering is the
      # one corpus here declaring one: it is the governance layer the others would consume, and the
      # only one publish-corpus.yml pushes. See docs/cli/pack.md.
      - name: Seal the export into a package
        if: matrix.corpus == 'engineering'
        run: dotnet run --project ../../tooling/kac -- pack

      # Unpinned on purpose: the bundle has to be valid against the CLI a reader actually runs, and
      # nothing in dependabot.yml would move an npm pin.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # A clean `claude plugin validate` prints one line whatever it looked at, and a plugin holding
      # no component at all passes it. The two guards below close that: bundle.json's components must
      # really be in the tree, and .claude-plugin/ must hold the manifest and nothing else, because a
      # component filed in there is loaded by nothing.
      #
      # Word for word the script in azure-pipelines.yml, so it is held to the POSIX subset Git Bash
      # and older macOS bash agree on, with no `$(...)` for an Azure pipeline to read as its macro.
      - name: Validate the assembled plugin and its marketplace
        shell: sh
        env:
          TEMPDIR: ${{ runner.temp }}
        run: |
          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict

          jq -r '.included[].path' .dist/plugin/bundle.json > "$TEMPDIR/included.txt"

          missing=''
          while read -r component; do
            [ -d ".dist/plugin/$component" ] || missing="$missing $component"
          done < "$TEMPDIR/included.txt"

          if [ -n "$missing" ]; then
            echo "bundle.json includes components the assembled plugin does not hold:$missing"
            exit 1
          fi

          find .dist/plugin/.claude-plugin -mindepth 1 -maxdepth 1 ! -name plugin.json > "$TEMPDIR/stray.txt"

          if [ -s "$TEMPDIR/stray.txt" ]; then
            echo "filed inside .claude-plugin/, where nothing loads it:"
            cat "$TEMPDIR/stray.txt"
            exit 1
          fi

  # The template, the tool and a corpus stood up from nothing. None of it is per-corpus, so it runs
  # once beside the matrix above.
  tool:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # `generate --check` is askable only here. The corpus the installed tool stands up further down
      # is generated as it is created, so nothing there holds these committed copies fresh.
      # A corpus's own azure-pipelines.yml reads no template/, because a corpus has none to look at.
      - name: Validate the template where it is authored
        working-directory: template
        run: dotnet run --project ../tooling/kac -- validate

      - name: Check the template's generated output is fresh
        working-directory: template
        run: dotnet run --project ../tooling/kac -- generate --check

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # `bundle-empty` in the golden suite pins what an emptied plugin holds. What it cannot say is
      # whether that plugin is still valid to install, which is what this asks.
      - name: Bundle a corpus that adopted no type, and validate what it produced
        shell: sh
        working-directory: examples/library
        env:
          TEMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$TEMPDIR/no-types"
          cp -R ../../.schema "$TEMPDIR/no-types/.schema"
          # The tree this corpus reads through plugin.from, and its own manifest over the top: the two
          # halves bundle merges. Copying this corpus's .plugin alone would carry the manifest and no
          # component file, so nothing would be left for the trim to strip.
          cp -R ../../template/.plugin "$TEMPDIR/no-types/.plugin"
          cp .plugin/.claude-plugin/plugin.json "$TEMPDIR/no-types/.plugin/.claude-plugin/plugin.json"

          # kac reads a folder as a corpus by this file. The name and the version are what a plugin is
          # installed by and updated on, and the bundle takes both from here, so a corpus adopting no
          # type still states them.
          printf 'descriptor-version: 1\ncorpus: no-types\ncontent-version: "0.1.0"\n' \
            > "$TEMPDIR/no-types/.corpus.yaml"

          cd "$TEMPDIR/no-types"
          dotnet run --project "$GITHUB_WORKSPACE/tooling/kac" -- export
          dotnet run --project "$GITHUB_WORKSPACE/tooling/kac" -- bundle

          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict

          if ! jq -e '.included == [] and (.trimmed | length) > 0' .dist/plugin/bundle.json > /dev/null; then
            echo "a corpus with no type bundled something that reads a type it does not hold"
            exit 1
          fi

      # tooling/README.md#tests says what each layer covers and why all three are here.
      - name: Run kac.core unit tests
        run: dotnet test tooling/kac.tests

      - name: Run kac feature tests
        run: dotnet test tooling/kac.features

      - name: Run the golden test suite
        run: dotnet run tooling/kac-tests.cs

      # Pack fails on package metadata no test layer above reads, such as a readme the project names
      # and nobody wrote. Installing what was packed catches a package that is well-formed and still
      # does not resolve to a runnable command.
      #
      # Word for word the script in .azuredevops/kac.yml, so the two names it reads are set below rather
      # than taken from whichever runner names them.
      - name: Pack the tool, then stand a corpus up with the installed copy
        shell: sh
        env:
          TEMP_ROOT: ${{ runner.temp }}
          SOURCES: ${{ github.workspace }}
        run: |
          dotnet pack tooling/kac/kac.csproj -o .dist/pack
          dotnet tool install --tool-path .dist/tools --add-source .dist/pack KnowledgeAsCode.Tool
          cd "$TEMP_ROOT"
          "$SOURCES/.dist/tools/kac" --version

          # `new` validates before it returns. The two verbs after it put the same questions to a
          # separate process, which is what finds a corpus only its creator can read.
          mkdir -p "$TEMP_ROOT/created"
          cd "$TEMP_ROOT/created"
          "$SOURCES/.dist/tools/kac" new --yes --from "$SOURCES" --name created --ci github
          "$SOURCES/.dist/tools/kac" validate
          "$SOURCES/.dist/tools/kac" generate --check

  # The one name the branch rule on `main` requires, and it does no work. `corpora` is a matrix, so it
  # reports as `corpora (library)` and two more rather than as `corpora`, and a rule naming a matrix job
  # waits for a check that never arrives. Gathering both jobs behind one name is what keeps the rule to
  # a single entry that survives a corpus being added or dropped.
  validate:
    needs:
      - corpora
      - tool
    runs-on: ubuntu-latest
    steps:
      - name: Report that the gate passed
        run: echo "corpora and tool both passed."

  # The documentation site, built the way publish-docs.yml builds it. A job of its own because it
  # needs Python and nothing else here does, and `strict:` in mkdocs.yml is what makes a dead link
  # or an unreachable page fail rather than warn.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs and the theme
        run: pip install -r docs/requirements.txt

      - name: Build the site
        run: mkdocs build

  # Installs what was assembled and asks each skill in it the questions that skill describes. On both
  # platforms because development happens on macOS and the first audience is on Windows.
  #
  # Two corpora, because the trim reads in two directions and one corpus can only show one of them.
  # `library` adopts glossary and not policies, so it proves that a skill whose type stayed behind is
  # gone from the install. `engineering` adopts both, so it proves that two skills ship over one
  # export and that neither names the other's file. `payments` adopts neither type and would prove
  # only that a plugin with no skill installs, which `bundle-empty` already pins.
  #
  # A job of its own because it needs a different checkout. The export stamps whatever commit HEAD
  # stands on into every link, and a pull_request run checks out a merge commit the raw host does
  # not serve, so the fetch would fail over the checkout rather than over the template.
  round-trip:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        corpus:
          - library
          - engineering
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/${{ matrix.corpus }}
    steps:
      - name: Check out the commit the export will name
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build the export
        run: dotnet run --project ../../tooling/kac -- export

      - name: Assemble the plugin bundle
        run: dotnet run --project ../../tooling/kac -- bundle

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install the plugin and ask each skill what it describes
        shell: bash
        run: sh ../../tooling/tests/round-trip.sh
