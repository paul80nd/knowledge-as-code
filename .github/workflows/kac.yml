# CI for this repository: the kac tool at `tooling/`, and the corpus at
# `example/` that proves it over real content.
#
# The corpus half is the GitHub equivalent of example/azure-pipelines.yml: it
# runs the kac validator, the generated-content freshness check, the export and
# the plugin bundle on pull requests into main. It NEVER commits anything it
# produces. `index --check` only verifies the tracked generated files are fresh
# and fails, naming the command a human runs locally (`./kac index`). The export
# and the bundle land in an untracked .dist/ that the runner throws away.
# This workflow is granted read-only contents permission and pushes nothing.
#
# What CI produces is never written back over a file a human edits. That is the
# rule, and read-only permission is how this workflow keeps it. publish.yml is
# granted write and keeps the same rule a different way: it writes only to an
# orphaned marketplace branch, which shares no commit with main and holds no
# file anyone authors, so there is no path from what CI builds to the source.

name: kac

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit rather than a tag: a tag is mutable, so a moved tag would
      # change what runs here without changing this file. Dependabot moves the pins, and the trailing
      # comment is what makes the diff legible when it does.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # One invocation per subcommand, run sequentially. File-based apps share
      # build output, so the kac runs must not execute concurrently.
      #
      # Each runs from `example/`, because kac takes the first ancestor holding a
      # `.schema/` as the corpus and the repository root is not one.
      - name: Validate frontmatter, links and structure
        working-directory: example
        run: dotnet run ../tooling/kac.cs -- validate

      - name: Check generated indexes are fresh
        working-directory: example
        run: dotnet run ../tooling/kac.cs -- index --check

      # Proves the corpus still exports. The shape it exports in is held by a committed
      # golden in the suite below.
      - name: Build the export
        working-directory: example
        run: dotnet run ../tooling/kac.cs -- export

      # Assembles what `export` wrote, together with the .plugin/ tree, into an installable
      # plugin under .dist/plugin/, with .dist/ itself as the marketplace naming it. The
      # fourth and last kac invocation, so the one-at-a-time rule above still holds.
      - name: Assemble the plugin bundle
        working-directory: example
        run: dotnet run ../tooling/kac.cs -- bundle

      # Taken at `latest` rather than pinned. The bundle has to be valid against the CLI a
      # reader actually runs, and no ecosystem in dependabot.yml moves an npm pin, so a pinned
      # version would settle into proving the bundle against a CLI nobody has.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # Two manifests are checked: the plugin a reader installs, and the marketplace offering
      # it. `--strict` fails on the warnings the runtime tolerates, which is what its own help
      # text asks CI to do.
      #
      # The CLI finds components by convention — a directory under skills/, a hooks/hooks.json —
      # and names one only when it has a fault to report. A clean run prints the manifest line
      # alone, so its silence says nothing about how much it looked at, and a plugin carrying no
      # component at all passes. The two guards after it are what close that. bundle.json lists
      # what this build put in, so the first asserts each of those components is really in the
      # tree; the second asserts .claude-plugin/ holds the manifest and nothing else, because a
      # component filed in there is loaded by nothing and reported by nothing.
      #
      # Held to the POSIX subset Git Bash and older macOS bash agree on: no arrays, no `[[`, no
      # process substitution, and no command substitution, whose `$(...)` an Azure pipeline reads
      # as its own macro before the shell ever sees it. The loop reads from a file rather than a
      # pipe, so the variable it sets survives into the test below it. TEMPDIR arrives from the
      # runner rather than being named inline, which is what leaves this script word for word the
      # one in azure-pipelines.yml.
      - name: Validate the assembled plugin and its marketplace
        shell: sh
        working-directory: example
        env:
          TEMPDIR: ${{ runner.temp }}
        run: |
          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict

          jq -r '.included[].path' .dist/plugin/bundle.json > "$TEMPDIR/included.txt"

          missing=''
          while read -r component; do
            [ -d ".dist/plugin/$component" ] || missing="$missing $component"
          done < "$TEMPDIR/included.txt"

          if [ -n "$missing" ]; then
            echo "bundle.json includes components the assembled plugin does not hold:$missing"
            exit 1
          fi

          find .dist/plugin/.claude-plugin -mindepth 1 -maxdepth 1 ! -name plugin.json > "$TEMPDIR/stray.txt"

          if [ -s "$TEMPDIR/stray.txt" ]; then
            echo "filed inside .claude-plugin/, where nothing loads it:"
            cat "$TEMPDIR/stray.txt"
            exit 1
          fi

      # A corpus that adopted no type still has to produce a plugin that installs. The bundle it
      # gets carries its manifest and the export, and nothing that reads either — both components
      # are trimmed, because a skill that would find nothing reads to a user exactly like a term the
      # corpus does not define. `bundle-empty` in the golden suite pins what that tree holds; what
      # it cannot say is whether the emptied plugin is still valid, which is what this asks.
      #
      # The throwaway root is a .schema/ and a .plugin/ and nothing else. kac takes the first
      # ancestor holding .schema as the repository root, so running from inside it is what makes
      # this a corpus with no records rather than a second run over the real one.
      - name: Bundle a corpus that adopted no type, and validate what it produced
        shell: sh
        working-directory: example
        env:
          TEMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$TEMPDIR/no-types"
          cp -R .schema "$TEMPDIR/no-types/.schema"
          cp -R .plugin "$TEMPDIR/no-types/.plugin"

          cd "$TEMPDIR/no-types"
          dotnet run "$GITHUB_WORKSPACE/tooling/kac.cs" -- export
          dotnet run "$GITHUB_WORKSPACE/tooling/kac.cs" -- bundle

          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict

          if ! jq -e '.included == [] and (.trimmed | length) > 0' .dist/plugin/bundle.json > /dev/null; then
            echo "a corpus with no type bundled something that reads a type it does not hold"
            exit 1
          fi

      # kac's own coverage, in three layers: focused xUnit unit tests over kac.core's shared
      # helpers; Reqnroll feature tests that drive the validator in-process as behaviour specs;
      # and the golden/subprocess suite (fixtures diffed against committed goldens, plus the
      # coverage + checks-table gates and the end-to-end CLI contract).
      - name: Run kac.core unit tests
        run: dotnet test tooling/kac.tests

      - name: Run kac feature tests
        run: dotnet test tooling/kac.features

      - name: Run the golden test suite
        run: dotnet run tooling/kac-tests.cs

  # The chain end to end, on the two platforms that matter. Everything in the job above is proved
  # over data; this installs what was assembled and asks it the questions its skill describes.
  #
  # Development happens on macOS and the first audience is on Windows, so a matrix here is where
  # that gap closes. The script is one file rather than two inline blocks, held to the subset Git
  # Bash and older macOS bash agree on; `bash` is the shell on both, which on a Windows runner is
  # Git Bash.
  #
  # It is a job of its own rather than more steps on the one above, because it needs a different
  # checkout. A pull_request run checks out the merge commit by default, and the export stamps
  # whatever commit HEAD stands on into every link it writes. A merge commit is not a commit the
  # raw host serves, so the fetch below would fail over the checkout rather than over the template.
  # Taking the head commit gives the export a ref that resolves.
  round-trip:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the commit the export will name
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build the export
        working-directory: example
        run: dotnet run ../tooling/kac.cs -- export

      - name: Assemble the plugin bundle
        working-directory: example
        run: dotnet run ../tooling/kac.cs -- bundle

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install the plugin and ask it what its skill describes
        shell: bash
        working-directory: example
        run: sh ../tooling/tests/round-trip.sh
