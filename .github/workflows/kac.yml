# The gate on a pull request: kac over each corpus under examples/ and template/, a corpus stood up by the
# packed tool, each corpus's plugin, and the tool's three test layers. The corpus half mirrors
# template/azure-pipelines.yml. Read-only `contents` keeps CI from writing over a file a human edits.

name: kac

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # xunit.v3 brings in Microsoft.Testing.Extensions.Telemetry, which reads this variable.
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  # Each corpus declares a different `types:`, so the matrix proves the framework holds for a subset too.
  corpora:
    strategy:
      fail-fast: false
      matrix:
        corpus:
          - library
          - engineering
          - payments
          - dog-fooding
    runs-on: ubuntu-latest
    # `validate` posts its findings to the pull request, which needs write access to its comments and nothing more.
    # A job with it installs nothing at a moving version, so the plugin checks run in `round-trip` below.
    permissions: {contents: read, pull-requests: write}
    # kac takes the nearest ancestor holding a .corpus.yaml as the corpus, so the working directory selects it.
    defaults:
      run:
        working-directory: examples/${{ matrix.corpus }}
    steps:
      # Pinned to a commit because a tag is mutable. Dependabot moves the pins.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout keeps no copy of the job's token, so no later step can push with it.
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Each job holds its own checkout, so this packs the `source:` payments and dog-fooding name itself.
      - name: Build the package this corpus consumes
        if: matrix.corpus == 'payments' || matrix.corpus == 'dog-fooding'
        working-directory: examples/engineering
        run: |
          dotnet run --project ../../tooling/kac -- export
          dotnet run --project ../../tooling/kac -- pack

      # .imports/ is not committed, so a fresh checkout has to restore before `validate` can pass.
      - name: Restore what this corpus consumes
        if: matrix.corpus == 'payments' || matrix.corpus == 'dog-fooding'
        run: dotnet run --project ../../tooling/kac -- restore

      # The token reaches this step alone, so no other step can write to the pull request.
      - name: Validate frontmatter, links and structure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run --project ../../tooling/kac -- validate

      - name: Check generated output is fresh
        run: dotnet run --project ../../tooling/kac -- generate --check

      - name: Check the corpus is in step with the template
        run: dotnet run --project ../../tooling/kac -- update --check --from ../../

      - name: Build the export
        run: dotnet run --project ../../tooling/kac -- export

      # publish-corpus.yml pushes every corpus, and a pack is refused without a shortcode, so the gate packs each.
      - name: Seal the export into a package
        run: dotnet run --project ../../tooling/kac -- pack

  # Nothing here is per-corpus, so it runs once beside the matrix above.
  tool:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `VerificationTests` and `ContentVersionTests` diff against the base branch, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Only here: the corpus stood up below is generated as it is created, and the starter reads no template/.
      - name: Validate the template where it is authored
        working-directory: template
        run: dotnet run --project ../tooling/kac -- validate

      - name: Check the template's generated output is fresh
        working-directory: template
        run: dotnet run --project ../tooling/kac -- generate --check

      # Unpinned for the reason the `corpora` job gives.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest # zizmor: ignore[adhoc-packages]

      # `bundle-empty` pins what an emptied plugin holds; this asks whether it is still valid to install.
      - name: Bundle a corpus that adopted no type, and validate what it produced
        shell: sh
        working-directory: examples/library
        env:
          TEMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$TEMPDIR/no-types"
          cp -R ../../.schema "$TEMPDIR/no-types/.schema"
          # The tree read through plugin.from, with this corpus's manifest over it: the two halves bundle merges.
          cp -R ../../template/.plugin "$TEMPDIR/no-types/.plugin"
          cp .plugin/.claude-plugin/plugin.json "$TEMPDIR/no-types/.plugin/.claude-plugin/plugin.json"

          # The bundle takes the plugin's name and version from here, so a corpus adopting no type still states them.
          printf 'descriptor-version: 1\ncorpus: no-types\ncontent-version: "0.1.0"\n' \
            > "$TEMPDIR/no-types/.corpus.yaml"

          cd "$TEMPDIR/no-types"
          dotnet run --project "$GITHUB_WORKSPACE/tooling/kac" -- export
          dotnet run --project "$GITHUB_WORKSPACE/tooling/kac" -- bundle

          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict

          # Nothing reading a type may ship. A `standalone` component reads no export, so it survives.
          if ! jq -e '[.included[] | select(.requires | length > 0)] == [] and (.trimmed | length) > 0' \
            .dist/plugin/bundle.json > /dev/null; then
            echo "a corpus with no type bundled something that reads a type it does not hold"
            exit 1
          fi

          if ! jq -e '[.included[].path] | index("skills/raise-finding") != null' \
            .dist/plugin/bundle.json > /dev/null; then
            echo "skills/raise-finding was trimmed, so a corpus holding no record cannot report that"
            exit 1
          fi

          # A skill supporting the lookups has nothing to support here, and leaves with the last of them.
          if ! jq -e '[.included[].path] | index("skills/request-deviation") == null' \
            .dist/plugin/bundle.json > /dev/null; then
            echo "a supporting skill shipped where no lookup did, so no clause reaches the reader"
            exit 1
          fi

      # docs/maintaining/build-test-release.md says what each layer proves.
      - name: Run kac.core unit tests
        # Empty on a push, where there is no base to compare, so the guards reading git history read nothing.
        env:
          KAC_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: dotnet test --project tooling/kac.tests

      - name: Run kac feature tests
        run: dotnet test --project tooling/kac.features

      - name: Run the golden test suite
        run: dotnet test --project tooling/kac.goldens

      # Pack fails on metadata no test reads, and installing catches a package that resolves to no command.
      - name: Pack the tool, then stand a corpus up with the installed copy
        shell: sh
        env:
          TEMP_ROOT: ${{ runner.temp }}
          SOURCES: ${{ github.workspace }}
        run: |
          dotnet pack tooling/kac/kac.csproj -o .dist/pack
          dotnet tool install --tool-path .dist/tools --add-source .dist/pack KnowledgeAsCode.Tool
          cd "$TEMP_ROOT"
          "$SOURCES/.dist/tools/kac" --version

          # `new` validates in-process. Asking again from a separate process finds a corpus only its creator can read.
          mkdir -p "$TEMP_ROOT/created"
          cd "$TEMP_ROOT/created"
          "$SOURCES/.dist/tools/kac" new --yes --from "$SOURCES" --name created --ci github
          "$SOURCES/.dist/tools/kac" validate
          "$SOURCES/.dist/tools/kac" generate --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # actionlint ships no manifest Dependabot reads, so its version is pinned here and moved by hand.
      - name: Install the linters
        run: |
          pip install -r .github/requirements.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # --strict, because `comments`, `comments-indentation` and `truthy` only warn in the default ruleset.
      - name: Check every YAML file
        run: yamllint --strict .

      # The runner carries shellcheck, so actionlint puts every `run:` block through it too.
      - name: Check the workflows
        run: |
          "$(go env GOPATH)"/bin/actionlint

      # The token lets zizmor ask GitHub whether each pinned commit belongs to the action it names.
      # Naming each `.github` folder makes zizmor audit the dependabot.yml beside the workflows.
      - name: Check the workflows and dependabot.yml for insecure patterns
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github template/.github

  # The one name the branch rule on `main` requires, and it does no work. A matrix job reports a name per
  # cell, as `corpora (library)` rather than as `corpora`, so a rule naming one waits for a check that
  # never arrives. Gathering every job behind one name keeps the rule to a single entry that survives a
  # corpus, a runner or a job being added or dropped.
  #
  # Every job belongs here. One left out still runs and blocks nothing. `WorkflowGateTests` fails it.
  #
  # `always()` runs the gate after a job fails, because GitHub counts a skipped required check as passing.
  validate:
    if: always()
    needs:
      - corpora
      - tool
      - lint
      - docs
      - round-trip
      - import-round-trip
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a job the gate waits for ended as $result."
              exit 1
            fi
          done
          echo "every job passed."

  # A job of its own because `strict:` in mkdocs.yml makes a dead link or a dead anchor fail.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Zensical
        run: pip install -r docs/requirements.txt

      - name: Build the site
        run: zensical build

  # Each corpus's plugin, assembled, checked against the Claude Code CLI, installed, and asked what each skill
  # describes. library, engineering and payments each show a different trim. dog-fooding has its plugin checked and
  # skips the install, because it is the same shape as payments. Read-only, because it installs that CLI at a moving
  # version.
  #
  # Windows runs payments alone. What breaks there is the shell and the paths, and payments also takes the import path.
  #
  # The checkout is the pull request's head. The export stamps whatever commit HEAD stands on into every link, and a
  # pull_request run checks out a merge commit the raw host does not serve, so the fetch would fail over the checkout
  # rather than over the template.
  round-trip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, corpus: library}
          - {os: ubuntu-latest, corpus: engineering}
          - {os: ubuntu-latest, corpus: payments}
          - {os: ubuntu-latest, corpus: dog-fooding}
          - {os: windows-latest, corpus: payments}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/${{ matrix.corpus }}
    steps:
      - name: Check out the commit the export will name
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # An export refuses where what it consumes is not restored, and this job has its own checkout.
      - name: Build the package this corpus consumes
        if: matrix.corpus == 'payments' || matrix.corpus == 'dog-fooding'
        working-directory: examples/engineering
        run: |
          dotnet run --project ../../tooling/kac -- export
          dotnet run --project ../../tooling/kac -- pack

      - name: Restore what this corpus consumes
        if: matrix.corpus == 'payments' || matrix.corpus == 'dog-fooding'
        run: dotnet run --project ../../tooling/kac -- restore

      - name: Build the export
        run: dotnet run --project ../../tooling/kac -- export

      - name: Assemble the plugin bundle
        run: dotnet run --project ../../tooling/kac -- bundle

      # Unpinned on purpose: the bundle has to be valid against the CLI a reader actually runs, and
      # nothing in dependabot.yml would move an npm pin. std-CI allows it in a job with `contents: read`.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest # zizmor: ignore[adhoc-packages]

      # A clean `claude plugin validate` prints one line whatever it looked at, and a plugin holding
      # no component at all passes it. bundled-components.sh closes that: the tree must hold every component
      # bundle.json kept and none it trimmed, and .claude-plugin/ must hold the manifest and nothing else.
      - name: Validate the assembled plugin and its marketplace
        shell: bash
        run: |
          claude plugin validate ./.dist/plugin --strict
          claude plugin validate ./.dist --strict
          sh ../../tooling/tests/bundled-components.sh .dist/plugin

      - name: Install the plugin and ask each skill what it describes
        if: matrix.corpus != 'dog-fooding'
        shell: bash
        run: sh ../../tooling/tests/round-trip.sh

  # Proves the `corpora (payments)` pass means something: asserts the citation resolved, then renames the
  # clause upstream and expects the downstream build to fail naming it. Both platforms, because the script
  # holds to the shell subset Git Bash and older macOS bash share. An ordinary checkout, because nothing here
  # fetches from the host the export names.
  import-round-trip:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish from one corpus, consume it from another, and break it on purpose
        shell: bash
        run: sh tooling/tests/import-round-trip.sh
