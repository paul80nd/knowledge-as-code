# Enums used by more than one type. Referenced as $enums.<name>.
# An enum used by exactly one type lives in that type's file.

version: 1

enums:

  criticality:
    values: [critical, important, supporting]
    notes: >
      Judged by what a customer experiences when it is unavailable. `critical` means customer-facing failure,
      `important` means degraded service, `supporting` means internal impact only. It drives runbook and NFR
      priority, so it should be honest rather than generous.
    used-by: [services, integrations]

  severity:
    values: [sev1, sev2, sev3]
    used-by: [runbooks, postmortems]

  rehearsal-frequency:
    values: [per-release, quarterly, annual]
    used-by: [processes, runbooks]

  review-cadence:
    values: [quarterly, biannual, annual]
    notes: Guidance for setting `review-by`; not itself a frontmatter field.
    used-by: [policies, standards, nfrs, faqs, explanations]
