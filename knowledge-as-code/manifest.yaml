# knowledge-as-code — portability manifest
#
# Declares which files are shared across every corpus running this framework, and which belong to
# the corpus that holds them. This file is the single definition of that boundary: it replaces the
# prose assertions that used to live in `taxonomy.md` and `automation.md`, which nothing could
# check.
#
# Read by `kac mechanism --check --against <path-or-url>`, which follows the same discipline as
# `index --check`: it recomputes, compares, names what is stale, exits non-zero, and never writes.
#
# This file is itself `synced` — every corpus holds the same copy. Per-corpus sync state (which
# upstream version this corpus is on, and what it has deliberately diverged from) lives in
# `.mechanism.lock` at the repo root, which is `local`.

version: 2
# The mechanism's version, matched by `upstream.mechanism-version` in each corpus's `.mechanism.lock`.
# It moves when the shared layer changes shape in a way a corpus has to act on — a renamed artefact, a
# new file every corpus must carry — rather than on every edit to a synced file. A corpus whose lock
# names an older version has work to do before its next sync.

layers:

  synced:
    rule: Byte-identical across every corpus running this framework.
    on-drift: error
    notes: >
      The framework itself — validator, tests, schema, and the documents that describe how the
      system works. Changes are made upstream and propagated; a local edit here is a defect, not a
      customisation. Anything in this layer must be free of corpus-specific content, which is why
      the test fixtures are synthetic rather than copied records.

  forked:
    rule: Seeded from upstream once, then owned locally. Never reconciled.
    on-drift: informational
    notes: >
      Files whose *shape* is the framework's and whose *content* is the corpus's. A type root page
      explains what a policy is in general and then gives examples in the local domain; a template
      carries local example values; the publishing config is specific to where this corpus is
      published. Divergence here is the point. The check lists these files so you can see how far
      they have drifted, but never fails on them.

  generated:
    rule: Derived from local frontmatter and schema. Never synced, never hand-edited.
    on-drift: ignore
    notes: >
      Output of `kac index`. Each corpus regenerates its own from its own records, so two corpora
      will always differ here and neither is wrong. Freshness is already covered by
      `index --check`; this layer exists so the sync check does not double-report it.

  local:
    rule: The corpus. Never shared.
    on-drift: ignore
    notes: >
      The knowledge itself, plus orientation and scaffolding specific to this repository. This is
      the default: a file matching no earlier rule is local. That direction is deliberate — a new
      mechanism file has to be declared shared, rather than becoming shared by accident.

  ignored:
    rule: Outside the model entirely.
    on-drift: ignore
    notes: Tooling, editor and OS artefacts. Not knowledge, not mechanism.

# Rules are evaluated in order; the first match wins. The final rule is a catch-all, so every file
# in the repository resolves to exactly one layer.

rules:

  # ── ignored ──────────────────────────────────────────────────────────────────────────────────
  - { path: ".git/**",                     layer: ignored }
  - { path: ".idea/**",                    layer: ignored }
  - { path: "**/.DS_Store",                layer: ignored }
  - { path: ".claude/settings.local.json", layer: ignored }

  # ── synced: the mechanism's own trees ────────────────────────────────────────────────────────
  # Ahead of `generated`, because the test fixtures contain golden _index.md files that are shared
  # test data, not generated output. Everything under `.tooling/` is mechanism whatever it is called.
  - path: ".tooling/**"
    layer: synced
    note: >
      Validator, generator, test runner and fixtures. Fixtures are part of the shared layer, so
      they must stay synthetic — a fixture built from a real record would ship one corpus's content
      to every other.

  - path: ".schema/**"
    layer: synced
    note: >
      The machine-readable schema — the contract the tool enforces. Dot-prefixed for the same
      reason as `.tooling/`: it is mechanism, not knowledge, so it stays out of the published wiki
      and out of the way in the repo. Kept as its own rule rather than folded under `.tooling/`
      because the tool is replaceable and the schema is the thing being agreed.

  # ── generated ────────────────────────────────────────────────────────────────────────────────
  # Matched before `synced`/`forked` so that generated files inside otherwise-shared folders
  # resolve correctly.
  - { path: "**/_index.md",                layer: generated, note: "Corpus indexes. Fixture _index.md files are caught by the .tooling/ rule above." }
  - { path: ".index.json",                 layer: generated, note: "Machine-readable corpus map." }
  - { path: "_reports/**",                 layer: generated, note: "Coverage and staleness reports." }

  # ── synced ───────────────────────────────────────────────────────────────────────────────────
  - path: ".claude/skills/**"
    layer: synced
    note: "Agent machinery — kb-review, with kb-search, kb-contribute and friends still to come."

  - { path: "knowledge-as-code/manifest.yaml",   layer: synced, note: "This file." }
  - { path: "knowledge-as-code/taxonomy.md",     layer: synced }
  - { path: "knowledge-as-code/metadata.md",     layer: synced }
  - { path: "knowledge-as-code/contributing.md", layer: synced }
  - { path: "knowledge-as-code/authoring.md",    layer: synced }
  - { path: "knowledge-as-code/principles.md",   layer: synced }
  - { path: "knowledge-as-code/lineage.md",      layer: synced }
  - { path: "knowledge-as-code/automation.md",   layer: synced }
  - { path: "knowledge-as-code.md",              layer: synced, note: "The framework overview. Describes the system generically, so it is shared, not framed for the local domain." }

  # ── forked ───────────────────────────────────────────────────────────────────────────────────
  - path: "azure-pipelines.yml"
    layer: forked
    note: >
      Publishing and CI target. This framework is deliberately opinionated toward Azure DevOps
      wiki; a corpus published elsewhere replaces this file rather than reconciling it.
  - { path: ".github/workflows/**",        layer: forked, note: "The GitHub equivalent of the above." }
  - { path: "**/.order",                   layer: forked, note: "ADO wiki navigation order." }
  - { path: ".gitignore",                  layer: forked }

  - path: "**/_template.md"
    layer: forked
    note: >
      OPEN QUESTION — the one judgement call in this manifest. Templates are schema-shaped, so a
      template that drifts from the schema produces records that fail validation, which argues for
      `synced`. Validation reports that drift against the template itself, so what `synced` would
      save is the work of following a schema change rather than a failure nobody sees. Against it, a
      template carries example values in the local domain — barely, now that the placeholder
      convention has left one reference to a real record across all of them. Provisionally `forked`;
      revisit once a second corpus exists and the cost is visible.

  - path: "CLAUDE.md"
    layer: forked
    note: >
      Agent guidance at the repo root. Hand-written, like a type root page, and like one it is a shape
      the framework sets filled with content the corpus owns — which is why it is `forked` rather than
      `synced`. The rules digest lands *inside* it as a generated block rather than replacing it, so
      that standing guidance and generated rules share the one page an agent always reads. The nested
      copies under `.tooling/` and `.schema/` describe the mechanism and are caught by those trees'
      `synced` rules above, which is right: they change when the mechanism does.

  - path: "frameworks.md"
    layer: forked
    note: >
      The register of external frameworks and what each obliges us to. `forked` for the same reason
      the type root pages are: the three postures and the rule that standing is stated here and
      nowhere else are the framework's, while which frameworks appear and what our standing against
      them is belong wholly to the corpus. A consumer keeps the shape and replaces every entry.

  # Type root pages: framework structure, shipped generic. They are `forked` rather than `synced`
  # because each corpus is expected to make them specific — `glossary.md` is the clearest case: its
  # conventions are the framework's, but the vocabulary that will earn its place is the corpus's own.
  - path:
      - "adrs.md"
      - "capabilities.md"
      - "controls.md"
      - "data.md"
      - "discoveries.md"
      - "explanations.md"
      - "faqs.md"
      - "glossary.md"
      - "integrations.md"
      - "nfrs.md"
      - "policies.md"
      - "postmortems.md"
      - "processes.md"
      - "runbooks.md"
      - "services.md"
      - "standards.md"
      - "tools.md"
    layer: forked

  # ── local ────────────────────────────────────────────────────────────────────────────────────
  - { path: "README.md",                        layer: local, note: "Orientation for this corpus." }
  - path:
      - ".github/CONTRIBUTING.md"
      - ".github/SECURITY.md"
      - ".github/ISSUE_TEMPLATE/**"
    layer: local
    note: >
      Whether this repository takes outside contributions, where a vulnerability in it is reported, and
      what it asks of an issue. Each is an answer a corpus gives for itself, so none is ever shared —
      which is also why they are stated here rather than left to the catch-all: the sibling
      `.github/workflows/**` rule is `forked`, and these files are not.
  - { path: "LICENSE",                          layer: local, note: "MIT; a derived corpus may relicense its own copy." }
  - { path: ".mechanism.lock",                  layer: local, note: "This corpus's sync state. Root-level and dot-prefixed, like any lockfile." }
  - { path: "_plan/**",                         layer: local, note: "Migration scaffolding — temporary." }

  - { path: "**",                               layer: local }
