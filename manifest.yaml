# The set of files a corpus receives from the template, read from anywhere in this repository. Each rule names
# its layer, and `to:` replaces the pattern's directory prefix, everything up to the last `/` before the first
# wildcard. The first matching rule wins, so a rule carving a file out of a folder sits above the folder's rule.

# The template's shape. Increment when a corpus has to respond: a file added, removed, renamed or moved between layers.
version: 23

# The oldest kac that reads this manifest. The template is fetched rather than shipped, so the two version apart.
minimum-tool: "0.6.0"

layers:

  overlay:
    rule: Identical in every corpus, and written again whenever the corpus takes a newer framework.
    notes: >
      The schema the tool enforces, the framework's own documentation, the writing rules a corpus
      author answers to, and the tree a corpus's plugin is built from. An edit to one of these is a
      divergence from the framework rather than a customisation of it, and the next overlay takes it
      back.

  seed:
    rule: Written once, when the corpus is created, and never touched again.
    notes: >
      Starting points a corpus fills with its own content: the page saying what each type is for here,
      the template a contributor copies, the agent guidance, and the repository-shaped files a corpus
      cannot work without. Each arrives carrying this repository's wording, which the corpus rewrites
      in its own domain.

  removed:
    rule: Deleted from a corpus when it takes a newer framework.
    notes: >
      A tombstone. A file missing from a template is as likely to be a mistake upstream as a deliberate
      removal, so a deletion is declared here and never inferred. The reach is the overlay: once a seed
      file has been written, it belongs to the corpus.

  withheld:
    rule: Never written into a corpus at all.
    notes: >
      This repository's own machinery: the tool, its tests, the documentation site, the worked corpora
      under `examples/`, and this file. A corpus is told what it holds by `.corpus.yaml` and by the
      folders it stood up, and has nothing to ask of the repository it came from.

rules:

  # Withheld files sit above the folder rules that would otherwise claim them.

  - path:
      - "manifest.yaml"
      - "template/README.md"
    layer: withheld
    note: The template describing itself, which is a fact about this repository and not about a corpus.

  - path: "template/.corpus.yaml"
    layer: withheld
    note: >
      Present so that `kac` reads `template/` as a corpus and can validate it here. A corpus's own
      descriptor is written fresh when the corpus is created, from what the invocation was told, rather
      than copied from a file carrying somebody else's name.

  - path: ".schema/CLAUDE.md"
    layer: removed
    note: >
      Agent guidance for changing the framework's schema, which points at the tool's source and tests. A
      corpus holds neither, and its sessions load the file each time they read a schema file.

  - path: ".schema/**"
    layer: overlay
    note: >
      The machine-readable schema, authored once at this root and read from here by every corpus in
      this repository. Which of it a corpus receives is `types:` in `.corpus.yaml`, so a declined type's
      file is not written rather than written and ignored. It lands at a corpus's own root, which is
      where the tool looks first, so no `to:` is needed.

  - path: "template/knowledge-as-code.md"
    to: ""
    layer: overlay
    note: >
      The framework's own documentation: the taxonomy, the metadata fields, how to contribute, and
      where the names came from. Shared word for word, because a corpus that rewrote them would be
      running a framework of its own.

  - path: "template/knowledge-as-code/**"
    to: "knowledge-as-code/"
    layer: overlay
    note: The pages under it, which is the same document set and the same argument as the page above.

  - path: "template/glossary/knowledge-as-code.md"
    to: "glossary/"
    layer: overlay
    note: >
      The framework's own vocabulary, inherited word for word. A corpus writes its own glossaries beside
      it and leaves this one alone. Matched by name because everything else in a type folder belongs to
      the corpus.

  - path:
      - ".claude/skills/technical-writing/**"
      - ".claude/skills/writing-a-record/**"
      - ".claude/skills/writing-a-report/**"
      - ".claude/skills/harvest-findings/**"
    layer: overlay
    note: >
      A skill travels where it governs a surface a corpus holds. Three of these are the writing rules:
      the floor every surface answers to, the voice for a record, and the verdicts a report adds on top
      of both. `harvest-findings` is the fourth, and it governs the corpus's own backlog: it triages the
      findings filed against the corpus and drafts the record one of them asks for, which is work only
      the maintainer holding the source can do. `writing-in-the-tool` and `writing-the-docs` describe C#
      and a documentation site that no corpus has, and `i-want-to` routes to this repository's own
      processes where a corpus reads its own through `process-lookup`. The catch-all withholds those
      three. A skill is addressed the same way from any repository root, so these land where they were
      read and need no `to:`.

  # Both `.plugin/` rules sit here, out of layer order, because the first match wins: a `.plugin/**` overlay
  # rule above this one would claim the manifest a corpus names for itself.

  - path: "template/.plugin/.claude-plugin/plugin.json"
    to: ".plugin/.claude-plugin/"
    layer: seed
    note: >
      The plugin manifest. Each corpus names, versions and licenses its own plugin, and declares under
      `metadata.components` which record types each component needs: a skill reading the glossary is
      dead weight in a corpus that declined the type.

  - path: "template/.plugin/**"
    to: ".plugin/"
    layer: overlay
    note: >
      The tree a plugin is built from. Its skills and hooks serve an agent working in a repository that
      consumes a corpus rather than one working in the corpus itself, and they read the export through
      `${CLAUDE_PLUGIN_ROOT}` rather than opening the tree, so every corpus ships the same words. A
      corpus naming `plugin.from` in its descriptor reads them from that one tree instead, and receives
      none of these.

  - path: "template/**/_template.md"
    to: ""
    layer: seed
    note: Templates a corpus fills with example values from its own domain.

  - path: "template/CLAUDE.md"
    to: ""
    layer: seed
    note: >
      Agent guidance for working in the corpus. The framework provides the structure and the corpus
      fills it with its own conventions.

  - path:
      - "template/.gitignore"
      - "template/.gitattributes"
    to: ""
    layer: seed
    note: >
      Load-bearing, and the reason a corpus cannot be a folder of Markdown alone. `kac` reads the git
      listing, so a corpus without an ignore file tracks `.dist/` and `_reports/` after `git add -A` and
      then validates its own generated output as records. Without `eol=lf` a Windows checkout presents
      CRLF and trips `generate --check`.

  - path: "template/.editorconfig"
    to: ""
    layer: seed
    note: >
      Editor conventions, so a save does not fight the generators. Whole rather than an addition to
      anything, because a corpus is created away from the repository these rules were written in and has
      to arrive carrying its own.

  - path: "template/.order"
    to: ""
    layer: seed
    note: >
      The navigation ordering an Azure DevOps wiki reads. It carries no `ci:` because it answers to how
      a corpus is published rather than to how it is built.

  - path: "template/azure-pipelines.yml"
    to: ""
    layer: seed
    ci: azure-devops
    note: >
      The Azure Pipelines starter. It arrives working and is then the corpus's own to change, because how
      a repository builds is a question about that repository.

  - path: "template/.github/workflows/kac.yml"
    to: ".github/workflows/"
    layer: seed
    ci: github
    note: The GitHub Actions starter, the twin of the pipeline above and the same bargain.

  - path: "template/*.md"
    to: ""
    layer: seed
    note: >
      Type root pages: what the type is, why it exists, and how to contribute one. The rules above carve
      out the framework's own pages, which are not a corpus's to rewrite. Written as a pattern rather
      than as one name per type, so adding a type is adding its schema and its pages and nothing else.

  # Everything else `template/` holds seeds, so a template file no rule names is the corpus's from arrival.
  - {path: "template/**", to: "", layer: seed}

  # Everything else withholds, so a file outside `template/` that nobody classified stays here.
  - {path: "**", layer: withheld}
