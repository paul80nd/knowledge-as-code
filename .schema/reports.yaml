# yaml-language-server: $schema=./meta/type.schema.json

type: report
label: Report
label-plural: Reports
folder: reports
page: reports.md
tier: descriptive
lifecycle: living
summary: A question about the corpus, answered across every record, with the judgement a person added.
goes-here: An answer about the corpus no single record states
detail: >
  Which clauses nothing implements, which framework references have only one citation. `kac report` fills
  every cell the corpus states, and leaves the judgement cells open. A report becomes a record here once
  somebody has answered them.

versus:
  explanations: >
    A report answers a question about the corpus itself. An explanation says how something in the estate
    works. If the answer would still be true with every record deleted, it is an explanation.
  discoveries: >
    A report is a walk over the corpus, repeatable and dated. A discovery is something somebody noticed
    once. If nothing would reproduce it, it is a discovery.

lineage:
  prior-art: "[Open Knowledge Format](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md) v0.2, the generated-document provenance keys"
  alignment: >
    `generated` states the producer and the moment, in OKF's `<producer>/<version>` form. `sources` lists
    each body of knowledge the document answers for
  divergence: >
    OKF puts no version on a source. This type does, because a reader needs to know which content the report
    is true of. It also requires a `verified` entry, which OKF leaves to the publisher

collision: >
  A report reads like an explanation, and a reader skimming one will file it as the other. An explanation
  survives every record being deleted. A report does not.

id:
  prefix: rpt
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the question it answers, which is what somebody searches for.

fields:

  status:
    required: true
    type: enum
    values: [draft, active, stale]
    description: Whether the report is drafted, current, or behind the corpus.

  generated:
    required: true
    type: object
    shape: event
    description: What produced the content and when.
    notes: >
      A regeneration overwrites this event, and `verified` is the field that keeps a history.
      See <https://paul80nd.github.io/knowledge-as-code/design/reports/#the-provenance-frontmatter>.

  sources:
    required: true
    type: list
    of: object
    entry:
      resource:
        required: true
        type: string
        description: The corpus the report answers for, by the name its descriptor gives it.
      version:
        required: true
        type: string
        description: Quoted. The `content-version` that corpus was at.
    min-items: 1
    description: Every corpus this report answers for, and the version of each it is true of.
    notes: >
      A consumer installs the corpus under a shortcode of its own, so `resource` states the corpus and never
      a path.

  verified:
    required: true
    type: list
    of: object
    shape: event
    min-items: 1
    description: Every verification this report has had, oldest first, one line each.
    notes: >
      The keys come from the `event` shape, and `verified` is the name the Open Knowledge Format gives the
      same list. The `by` prefix decides the exported `trust` tier, so `verified-by-a-known-actor` below
      limits an entry to a person or a producer.
      See <https://paul80nd.github.io/knowledge-as-code/design/reports/#the-provenance-frontmatter>.

sections:
  required: []
  optional: []
  notes: >
    Free-form throughout. `kac report` writes the headings the question needs.
    See <https://paul80nd.github.io/knowledge-as-code/design/export/#a-type-declaring-no-sections>.

export:
  version: 2
  fields: [id, title, status, generated, sources, verified, tags]
  notes: >
    The body never travels, and a reader follows the record's own links for it.
    See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#reports>.
index:
  columns: [id, title, status]
  sort: id

rules:
  - id: report-stale
    description: A report answers for the version of each corpus that is in front of the reader now.
    severity: warning

  - id: verified-by-a-known-actor
    description: A verification states a person or a producer, and never a `role:`.
    severity: error
    expr: "entries_match('verified', 'by', '^(human:[a-z0-9.-]+|[a-z0-9.-]+/[^ ]+)$')"
    message: >
      this verification states neither a person nor a producer. Write `human:alex.doe`, or an agent with
      its version, as `coverage-sweep/1.2.0`.

  - id: no-self-verification
    description: A report is not verified by the producer that generated it.
    severity: error

  - id: generated-by-a-producer
    description: '`generated.by` states what produced the content, in OKF''s `<producer>/<version>` form.'
    severity: error
    # The form is a slash with something after it. Producers version themselves however they like.
    expr: "entries_match('generated', 'by', '^[a-z0-9.-]+/[^ ]+$')"
    message: >
      `generated.by` is not in `<producer>/<version>` form. Write the producer and its version together,
      as `kac/0.24.0`, so a reader can tell which version wrote this.
