# yaml-language-server: $schema=./meta/type.schema.json

type: report
label: Report
label-plural: Reports
folder: reports
page: reports.md
tier: descriptive
lifecycle: living
summary: A question about the corpus, answered across every record, with the judgement a person added.
goes-here: An answer about the corpus no single record states
detail: >
  Which clauses nothing implements, which framework references have only one citation. `kac report` fills
  every cell the corpus states, and leaves the judgement cells open. A report becomes a record here once
  somebody has answered them.

versus:
  explanations: >
    A report answers a question about the corpus itself. An explanation says how something in the estate
    works. If the answer would still be true with every record deleted, it is an explanation.

lineage:
  prior-art: "[Open Knowledge Format](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md) v0.2, the generated-document provenance keys"
  alignment: >
    `generated` states who wrote the content and when, in OKF's actor convention. `sources` lists each body
    of knowledge the document answers for, and a report with no `verified` entry is OKF's unverified tier
  divergence: >
    OKF puts no version on a source. This type does, because a reader needs to know which content the report
    is true of. It also requires a `verified` entry once a report leaves `draft`, where OKF leaves
    verification to the publisher, and it admits one entry per actor where OKF admits a second entry for an
    actor already in the list. `generated.report` and `generated.tool` are additional keys, which OKF permits
    and defines nothing of its own for

collision: >
  A report reads like an explanation, and a reader skimming one will file it as the other. An explanation
  survives every record being deleted. A report does not.

id:
  prefix: rpt
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the question it answers, which is what somebody searches for.

fields:

  status:
    required: true
    type: enum
    values: [draft, active, stale]
    description: Whether the report is drafted, current, or behind the corpus.

  generated:
    required: true
    type: object
    entry:
      at:
        required: true
        type: timestamp
        description: The moment the content last meaningfully changed, in UTC as `2026-09-07T20:18:00Z`.
      by:
        required: true
        type: string
        description: Who wrote the content as it stands, as a tool, an agent or a person.
      report:
        required: false
        type: string
        description: The report `kac report` was run under, as `coverage`.
      tool:
        required: false
        type: string
        description: The tool that wrote the mechanical half, as `kac/0.26.0`.
    description: Who wrote the content as it stands, and when.
    notes: >
      `by` passes to whoever edits the output, so a report an agent completed states the agent and not `kac`.
      `report` and `tool` describe the run the content started from, and both stay absent where nobody ran one.
      A hand-raised `sources` version moves neither `at` nor `by`. Nor does rewriting the `Imported:` bullet an
      imported entry's raise touches: the tool restates that line from `sources`, so no meaning moves with it.
      See <https://paul80nd.github.io/knowledge-as-code/design/reports/#the-provenance-frontmatter>.

  sources:
    required: true
    type: list
    of: object
    entry:
      resource:
        required: true
        type: string
        description: The corpus the report answers for, by the name its descriptor gives it.
      version:
        required: true
        type: string
        description: Quoted. The `content-version` that corpus was at.
    min-items: 1
    description: Every corpus this report answers for, and the version of each it is true of.
    notes: >
      A consumer installs the corpus under a shortcode of its own, so `resource` states the corpus and never
      a path.

  verified:
    required: false
    required-when: 'status != draft'
    type: list
    of: object
    shape: event
    description: Who has checked this report, one entry per actor, oldest first.
    notes: >
      A draft states no verification, and every other status must. An actor is written once, and a check they make
      again moves the `at` on the entry they have. The keys come from the `event` shape, and `verified` is the name
      the Open Knowledge Format gives the same list. The `by` prefix decides the exported `trust` tier, so
      `verified-by-a-known-actor` below limits an entry to a known actor.
      See <https://paul80nd.github.io/knowledge-as-code/design/reports/#the-provenance-frontmatter>.

sections:
  required: []
  optional: []
  notes: >
    Free-form throughout. `kac report` writes the headings the question needs.
    See <https://paul80nd.github.io/knowledge-as-code/design/export/#a-type-declaring-no-sections>.

export:
  version: 2
  fields: [id, title, status, generated, sources, verified, tags]
  notes: >
    The body never travels, and a reader follows the record's own links for it.
    See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#reports>.
index:
  columns: [id, title, status]
  sort: id

rules:
  - id: report-stale
    description: A report answers for the version of each corpus that is in front of the reader now.
    severity: warning

  - id: verified-by-a-known-actor
    description: A verification states an actor the Open Knowledge Format defines, and never a `role:`.
    severity: error
    expr: "entries_match('verified', 'by', '^(human:[a-z0-9.-]+|process:[a-z0-9.-]+|[a-z0-9.-]+/[^ ]+)$')"
    message: >
      this verification states no known actor. Write `human:alex.doe`, `process:nightly-sweep`, or an agent
      with its version, as `coverage-sweep/1.2.0`.

  - id: no-self-verification
    description: A report is not verified by the actor named in `generated.by`.
    severity: error

  - id: one-verification-per-actor
    description: An actor is written once in `verified`, and a second check moves the `at` on the entry they have.
    severity: error
    expr: "entries_unique('verified', 'by')"
    message: >
      this actor already states a verification on this record. Move the `at` on the entry they have.

  - id: generated-by-a-known-actor
    description: '`generated.by` states an actor the Open Knowledge Format defines.'
    severity: error
    # The same forms `verified` takes. A person writing the content is `human:`, which the Open Knowledge
    # Format requires for hand-authored work.
    expr: "entries_match('generated', 'by', '^(human:[a-z0-9.-]+|process:[a-z0-9.-]+|[a-z0-9.-]+/[^ ]+)$')"
    message: >
      `generated.by` states no known actor. Write `human:alex.doe`, `process:nightly-sweep`, or a tool or
      agent with its version, as `kac/0.24.0`.
