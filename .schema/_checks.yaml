# Every check the validator implements, defined once.
#
# A type's own `rules:` block declares the checks that belong to one type. This file declares the rest:
# the checks that run against every document, whatever folder it sits in, and the ones that read the
# schema or the corpus rather than a record.
#
# `description` says what the check proves correct, in the words a reader meets. `kac checks` prints
# it. It is held to the same 120 characters a rule's description is, and for the same reason: it lands
# in a table cell whose column is padded to its widest row.
#
# `notes` is the reasoning, the boundary and the mechanics, which belong here where there is room for
# them. Why a check exists, what it deliberately does not cover, when it is skipped. What the code does
# to answer the question stays beside the code.
#
# `severity` is what the check reports at, and neither `warning` nor `info` fails the build. A warning is
# something to act on. An info reports a decision the corpus already made, or a question this run could
# not put, and reporting either as a problem teaches a reader to skim. `on-type-page: false`
# withholds it from the table generated onto a type page, for a check whose subject is the schema, a
# template or the page itself rather than a record somebody wrote.
#
# A check id a rule class reports under and this file does not declare fails `schema-dispatch` when the
# schema loads. The other way round is the coverage gate's to answer: every other check reports through
# a literal written where the check is, so an entry nothing reports is found by no fixture reaching it.

checks:

  # ── schema ───────────────────────────────────────────────────────────────────

  schema-unknown-key:
    severity: error
    on-type-page: false
    description: Every key in these files is one the loader reads.
    notes: >
      `notes:` is the exception, admitted at every level as commentary. There is no list of permitted
      keys anywhere: the loader records what it asks each mapping for and the remainder is reported, so
      a key gains its meaning and its admission in one edit, and a key that stops being read stops being
      admitted without anyone having to remember.

  schema-unreadable:
    severity: error
    on-type-page: false
    description: A declaration the loader can read as written.
    notes: >
      An `expr:` that will not compile or names no `severity:` or `message:`, a `required-when:` outside
      its three forms, `values: $enums.x` naming an enum `_enums.yaml` does not declare.

  schema-dispatch:
    severity: error
    on-type-page: false
    description: A declared value is one the tool acts on.
    notes: >
      The question is whether code acts on the value, not whether it is spelled correctly: `style:
      mnemonic` would pass a spelling test, and what makes it sound is the branch that reads it. Covers
      a rule id claiming a `severity:` nothing answers, `values:` on anything but an enum, `min-items:`
      on anything but a list, and an unknown `id.style` or `index.order`.

      A `ref:` and a `versus:` are outside it, because each names a type and a corpus adopts as many
      types as it has use for. One naming a type this corpus declined is asked nothing, and adopting the
      type later starts it with no edit here.

      It runs the other way too: a check id a rule class reports under that this file does not declare.
      A check declared here and reported by nothing is the coverage gate's to catch, by failing on a
      check no fixture can reach.

  schema-shape:
    severity: error
    on-type-page: false
    description: A type's declarations are well-formed and agree with one another.
    notes: >
      Where `schema-dispatch` asks whether code acts on a value, this asks whether a second declaration in the
      same file agrees with it. A type declaring no `folder:` has nowhere for its records to live, and one
      naming a folder other than the file's own name hides every record it holds, because the lookup from
      folder to schema is by file name. A `mirrors-section:` names a section the `sections:` block must also
      declare. A `description:` past 120 characters widens every row of the table it lands in.

  # ── frontmatter ──────────────────────────────────────────────────────────────

  type:
    severity: error
    on-type-page: false
    description: The document's folder maps to a type schema.
    notes: >
      Discovery excludes any folder that maps to no type, so no discovered document reaches this. It
      guards the callers that hand a document in directly, and the coverage gate lists it as
      unreachable rather than demanding a fixture for it.

  frontmatter-parses:
    severity: error
    description: The frontmatter block is present and is a valid YAML mapping.
    notes: >
      Reported and stopped: nothing below it can be judged, and a document whose frontmatter did not
      parse would otherwise report every field in it as missing.

  unknown-key:
    severity: error
    description: Every frontmatter key is a universal field, a type field, or a reserved ADO key.

  derived-key:
    severity: error
    description: A field the type derives from where the record sits is absent from frontmatter.
    notes: >
      A derived field is declared, so `unknown-key` admits it. Its value is the folders between the
      type's own folder and the file, and a written value is a second answer the two can disagree over.

      A record saved straight into its type folder gets an empty value, which is a normal state.

      Asked of a template too, because a template carrying the key teaches every record copied from it
      to carry one.

  key-order:
    severity: error
    description: Key order is a topological extension of the schema's declared field orders.
    notes: >
      Every pair the schema orders must hold, and a genuinely unconstrained pair is free. A total order
      would make the schema's field sequence a second obligation on every document, where what is
      actually wanted is that the universal keys precede the type's.

  required-field:
    severity: error
    description: Every required field is present, and every `required-when` field whose condition holds.
    notes: >
      Where the field a `required-when:` names is absent the condition does not hold, `!=` included:
      that absence is already being reported, and requiring a second field on top of it would report one
      omission as two.

  bare-key:
    severity: error
    description: An absent value is a bare key, never `null`, `~`, `""`, `''` or an em dash.
    notes: >
      One spelling of absence, so a search for a field nobody has filled in finds all of them. Each of
      the alternatives reads as a value to something.

  date-quoted:
    severity: error
    description: A date field is a quoted string.
    notes: >
      Unquoted, YAML reads it as a datetime and Azure DevOps renders it with a locale format and a
      timezone shift, so the page shows a date the file does not carry.

  date-format:
    severity: error
    description: A date field is `YYYY-MM-DD` and names a day the calendar has.

  enum:
    severity: error
    description: An enum value is a scalar the field's declared range carries.

  enum-lowercase:
    severity: error
    description: An enum value is lowercase.
    notes: Enums are grep targets first and prose second, and two casings of one value are two values to search for.

  list:
    severity: error
    on-type-page: false
    description: A list field is written as a YAML sequence.

  min-items:
    severity: error
    description: A list field carries at least the `min-items:` its schema declares.
    notes: >
      Reported against the field rather than an entry, because no entry is at fault. For the field whose
      value is its breadth: a FAQ's `symptom-keywords` is the one the schema tells authors to over-fill.

  min-records:
    severity: warning
    description: Each entry of a grouping field is carried by at least as many records as its floor.
    notes: >
      The opposite count to `min-items`: how many records carry each value, rather than how many values
      one record carries. It is what a field says when its values divide the type into groups worth
      browsing. A value carried by one record divides nothing, and belongs in a field free to be unique.
      Counted per type, case-insensitively, once per record however often one repeats a value.

  field-pattern:
    severity: error
    description: A value matches the `pattern:` its field declares, once per list entry and once per scalar value.

  list-order:
    severity: warning
    description: A list field's entries read in alphabetical order, with digit runs compared as numbers.
    notes: >
      No list field's sequence carries meaning, so alphabetical is the order that scan-reads and the one
      two authors agree on without discussion. Numbers compare as numbers, so `A.8.7` precedes `A.8.29`.
      Only the first pair out of order is reported.

  tier-matches-type:
    severity: error
    description: "`tier` equals the tier the type declares."

  id-prefix:
    severity: error
    description: "`id` carries the type's prefix."

  id-format:
    severity: error
    description: The id's discriminator has the shape the type's `id.style` declares.

  id-matches-filename:
    severity: error
    description: The id's discriminator matches the filename's, so both name the same document.

  # ── identity ─────────────────────────────────────────────────────────────────

  filename-pattern:
    severity: error
    description: The filename matches the type's `filename.pattern`.

  slug-length:
    severity: error
    description: The slug (the filename minus any `NNNN-` or mnemonic prefix) is within `slug-max`.
    notes: >
      A filename is a handle and the H1 carries the title. A slug that will not go under the limit is
      usually a document doing two things, so narrowing the scope beats abbreviating harder.

  h1:
    severity: error
    description: The document has an H1. Its text is the title, and nothing constrains it.

  identity:
    severity: error
    description: "An identity line of two code spans follows the H1: `` `Type: id` `STATUS` ``."
    notes: >
      A reader arrives at a record from a citation, so the top of the page answers what kind of document
      this is, which one, and whether it is in force. Frontmatter answers all three and renders as a
      table a reader may never look at.

  identity-type:
    severity: error
    description: The identity line's type name is the `label` the folder's schema declares.

  identity-id:
    severity: error
    description: The identity line's id is the frontmatter's, character for character.

  identity-status:
    severity: error
    description: The identity line's status is the frontmatter's, upper-cased.
    notes: >
      Lower-case in frontmatter because a machine reads it, upper-case on the line because a person
      reads it as a stamp. A document cannot go active and leave the line saying DRAFT.

  required-section:
    severity: error
    description: Every heading in `sections.required` is present.

  empty-section:
    severity: error
    description: A section the type declares carries something under its heading.
    notes: >
      An author with nothing to say cannot delete a required heading, so what they leave is a blank
      beneath it. A template's sections stand empty for the copy to fill. The section a type keeps its
      parts in is left to the checks that read them.

  placeholder-left:
    severity: error
    description: No `{{…}}` from the template survives into a record, outside code.
    notes: >
      Easy to do and easy to miss: the file has an id, a title and every section, so every other check
      passes and it reads as complete until someone follows a link to `{{a}}.md`. Reported once, naming
      the first. An unfinished copy holds a dozen.

  # ── the parts of a record ────────────────────────────────────────────────────

  part-id-unique:
    severity: error
    description: No two parts of a record share an address, so a citation names one of them.
    notes: >
      Asked of every source, so two glossary headings differing only in punctuation collide here and
      never reach the published anchors. Compared ordinally: two ids differing only in case are not two
      parts a reader could tell apart either.

  part-none:
    severity: error
    description: A section declared to hold parts written as headings holds at least one.
    notes: >
      What `clause-table`'s empty-table arm asks of the other source. A record promising parts and
      carrying none says nothing where it undertook to say something.

      Nothing else reports it. `required-section` is answered by the heading existing, and
      `empty-section` passes the parts section over. This check quotes the section, the word the type
      calls its parts, and the heading level to write them at.

      Reported and stopped, for the reason a broken table is: the checks after it read parts.

  part-empty:
    severity: error
    description: A part declared by a heading carries something under it.
    notes: >
      A heading is an address and a container both. An empty entry passes everything a reader can check
      from outside: a title, a working anchor and a citation that resolves. An export then carries it as
      a part holding no words and counts it among the rest. The table source needs no equivalent, since
      `clause-modal` stops a row with an empty clause cell first.

      The check hangs off the source, so anything declaring `source: headings` inherits it. It quotes
      the heading, because a glossary holds twenty entries and "one of these is empty" is not something
      anyone can act on. It reads the source as written, so a horizontal rule or an em dash standing in
      for the words counts as nothing written.

      An error, and `status: draft` is no exemption. Draft says the terms are still settling, and a
      heading with nothing under it is not a state to publish from.

  clause-table:
    severity: error
    description: The declared section holds a table headed with the block's `columns`, and at least one row.
    notes: >
      A missing table, a mis-headed one and an empty one are three faults the parser tells apart. Each
      is reported and stops the pass, because nothing beneath a broken table can be judged. A missing
      section is `required-section`'s to report, and saying it twice would make one fault look like two.

  clause-id-format:
    severity: error
    description: Each clause id is a single code span matching the block's `id-pattern`.
    notes: A code span because an id is a handle rather than a word, and flattened text cannot tell the two apart.

  clause-modal:
    severity: error
    description: Each clause opens with a declared modal, bold where it binds and plain where it does not.
    notes: >
      Bold carries the binding level visually, and a reader skimming a long table reads the weight
      before the words. A binding modal written plain reads as advice. An advisory one written bold
      reads as an obligation.

  clause-order:
    severity: warning
    description: Clause rows are grouped by binding level, in the order the type declares.
    notes: >
      Reported once, against the first row that breaks the grouping: a table sorted wholly the wrong way
      would otherwise report every row after the first.

  clause-compound:
    severity: warning
    description: A clause carries one obligation, not two sharing an id.
    notes: A second modal in a row means a citation of that id can only ever name half of what it means.

  # ── links ────────────────────────────────────────────────────────────────────

  link-resolves:
    severity: error
    description: Every internal link resolves, in any of the forms the wiki accepts.
    notes: >
      Repo-relative, wiki-root-absolute (a leading `/` is the repo root), inline, reference and shortcut
      reference links, with the `.md` optional because Azure DevOps resolves both. External
      `http(s)`, `mailto` and `tel` links are skipped.

  fragment-resolves:
    severity: error
    description: A link's `#fragment` names a heading in the document it points at.
    notes: >
      The anchor is the heading lower-cased, spaces hyphenated and punctuation dropped, which is the one
      form every renderer agrees on. Azure DevOps percent-encodes what GitHub discards, so a heading
      carrying `/`, `:` or `.` has two anchors. It fails here rather than only in the published wiki.

  undefined-label:
    severity: error
    description: A shortcut label shaped like any type's id has a link definition.

  label-canonical:
    severity: error
    description: An id-shaped shortcut label is written as the canonical id.
    notes: >
      Prefix lower-case, mnemonic upper-case, slug lower-case. Reference and definition match
      case-insensitively, so a mis-cased label resolves and nothing else would catch it. The label is
      its own display text, so it shows the reader an id that does not exist.

  part-ref:
    severity: error
    description: A part reference names a document that exists and carries that part.
    notes: >
      Written `pol-VURM.TIMEBOX` or `gls-knowledge-as-code.corpus`, and checked wherever it appears,
      since any type may cite a part.

      Every form the corpus writes is read: a code span, a link carrying the citation as its text or as
      its label, and a link naming the record with the part id against its closing bracket, as
      `[pol-VURM].TIMEBOX`. That third form needs one link definition however many parts of the record a
      document cites. The id has to touch the bracket, so a full stop closing a sentence after a link
      stays a full stop.

      Three ways it fails, each reported in the words that fit: the document does not exist, its type
      keeps no parts at all, or the part is not one it carries. A colon where the dot belongs is
      reported here too, naming the form to write.

      A citation may carry a producer's shortcode, as `eng:pol-VURM.TIMEBOX`, and then resolves against
      what `kac restore` unpacked under `.imports/`. An imported record may be cited whole that way, and
      a record this corpus holds never is.

      Three more ways it fails, each about the spelling rather than the record: a bare id naming a
      record this corpus imports, a scoped id naming one it holds, and a shortcode it consumes nothing
      under. The first two say the spelling to write instead. A citation into an import that has not
      been restored reports nothing here, and `import-restored` says it once instead.

  ref-resolves:
    severity: error
    description: An id in a field declaring a `ref:` names a document that exists, of a type the `ref:` names.
    notes: >
      Both halves are asked, of a scalar and a list alike, and whether or not the field also declares a
      `reciprocal:`. The wrong type is the quieter fault: it lands on a real page, so it reads as
      intentional and whatever walks the edge afterwards takes it at its word. A literal the field
      admits, such as `applies-to: [all]`, is not an id and is skipped.

      A field may reach a part and may carry a scope, as `implements: eng:pol-VURM.TIMEBOX`. Both halves
      of a part-level id are asked. The spelling faults `part-ref` reports across a boundary are
      reported here too, in the same words.

      A field declaring `part-required:` is held to the part as well, so the record named whole is
      refused there.

  reciprocal:
    severity: error
    description: A field declaring a `reciprocal:` agrees with its counterpart in both directions.
    notes: >
      Whether the target exists, and whether it is of a type the field may point at, are `ref-resolves`,
      so a dangling or wrong-type reference is reported once rather than twice.

  related-matches-section:
    severity: error
    description: A field declaring a `mirrors-section:` reconciles with the ids that section links to.
    notes: >
      In both directions and case-insensitively, in a bullet or in prose alike. Both directions is the
      part to weigh before declaring one: a section mentioning an id the field does not carry is a
      finding as much as the reverse, so the field has to be the whole truth about what the section
      names.

  mirrors-citations:
    severity: error
    description: A field declaring a `mirrors-citations:` reconciles with the lines carrying its label.
    notes: >
      The line is a footnote, written in italic with the label bold, and closing the section whose
      citations it gathers. A section covering nothing carries none. A line that is bold alone is the
      labelled prose a glossary writes its `Not` in, and is passed over.

      What reconciles is the union of the lines against the field, in both directions and
      case-insensitively. The field stays the whole truth about what the document answers, and the lines
      divide that truth between the sections.

      Three faults sit on a line: it is not italic, it closes no section, or it gathers no citation the
      field could carry. Its citations count whichever is reported. A document that only got the line
      wrong gets one finding, not one per id it named. A line that is not italic is reported and
      stopped, the other two being questions about a footnote.

  id-unique:
    severity: error
    description: An id is unique across the whole corpus.

  unused-definition:
    severity: warning
    description: Every link definition is referenced by something.

  bracket-literal:
    severity: warning
    on-type-page: false
    description: A `[...]` left in prose that reads as a reference has a definition behind it.
    notes: >
      A heuristic sibling of `undefined-label`, for the bracket that never became a link at all. Where the
      brackets sit decides a checkbox: `- [ ]` opening a list item is a marker, and the same brackets
      mid-sentence still warn. Use an inline link where the brackets are deliberate.

  type-setup:
    severity: error
    on-type-page: false
    description: A type the schema declares is stood up as both a page and a folder, or as neither.
    notes: >
      A declared type nobody has built yet is silent; half of one is not.

  shortcode:
    severity: error
    on-type-page: false
    description: The shortcode a corpus declares for itself can be written before a colon, and is no type's prefix.
    notes: >
      A shortcode is two to eight characters, lower case, opens on a letter, and carries letters and
      digits alone. It is what another corpus writes before the colon, as the `eng` in
      `eng:pol-VURM.TIMEBOX`. <https://paul80nd.github.io/knowledge-as-code/framework/metadata/> carries
      the notation.

      No hyphen, because the citation parser reads a hyphen before a colon as an id: a shortcode
      carrying one turns a scoped reference into a citation written with the wrong separator.

      Not a type prefix either, whatever the schema declares: `std:pol-VURM` reads as a standard. The
      prefixes come from the schema, so there is no list here to keep in step. Case is ignored for that
      comparison alone, so `STD` is told both that it is miscased and that the spelling underneath is
      taken.

      A corpus that declares no shortcode is not asked any of this.

  import-restored:
    severity: error
    on-type-page: false
    description: Every corpus this one declares in `consumes:` has been restored into `.imports/`.
    notes: >
      An error rather than a skip. A citation into a corpus that has not arrived is the one reference
      nothing else can answer for. A green local run would otherwise let a broken reference reach the
      default branch. The message names `kac restore`.

      Reported once against `.corpus.yaml`, and every citation into that shortcode then stays quiet.

  import-behind:
    severity: warning
    on-type-page: false
    description: Every corpus in `consumes:` is locked at the newest version its own range admits.
    notes: >
      The corpus said it would take that version and has not. `restore` keeps a lock its range still
      admits, so two restores of an unchanged descriptor write the same bytes. Asking is `validate`'s,
      once per run.

      A warning rather than an error. A version behind is not a broken corpus, and `kac restore` is what
      moves it.

  import-capped:
    severity: info
    on-type-page: false
    description: A newer version of a consumed corpus is published, and this corpus's range holds it back.
    notes: >
      Reported apart from `import-behind` because it is somebody's decision rather than their oversight.
      A range capping a corpus at a major is doing what it was written to do. The reader's choice is to
      widen it or to leave it alone.

  import-unreachable:
    severity: info
    on-type-page: false
    description: A lock in `consumes:` could not be checked against what its source publishes.
    notes: >
      A run behind a firewall, without the token a private feed wants, or against a folder that is not
      there cannot tell a current lock from a stale one. Saying so is the alternative to reporting every
      import as current, which would read as an assurance.

      A source answering with no versions at all reports here too, rather than as a lock that is
      current. A registry answers a private feed's anonymous reader exactly as it answers a package
      nobody has published.

      Information rather than a warning. The corpus is not at fault and no edit to it would help.

  framework-names-types:
    severity: error
    on-type-page: false
    description: The framework's own documents name a type rather than linking to one.
    notes: >
      And never link a record inside a type's folder. Those files are byte-identical in every corpus, so
      a link resolving here says nothing about where it is read: a corpus that never adopted standards
      has no `/standards` page to open. Generated blocks are exempt, being written from the types the
      corpus stood up.

  template-fields:
    severity: error
    on-type-page: false
    description: A type's template carries the fields a copy of it needs, usably, and no key the type does not declare.
    notes: >
      A placeholder opening a value has to be quoted, or YAML reads `review-by: {{date}}` as a mapping
      rather than as text. A defect here belongs to every future document and is found by the next
      author rather than the last.

  generated-block:
    severity: error
    on-type-page: false
    description: Every file `kac generate` writes a block into still carries both of that block's markers.
    notes: >
      A block whose markers have gone is written by nothing and, without this, reported by nothing:
      `generate --check` compares a file against what the generator would produce, and for a file it can
      find no marker in that is the file as it stands. The corpus's own `README.md` is the exception,
      where deleting the markers is how a corpus declines the block.

  page-frontmatter:
    severity: error
    on-type-page: false
    description: A type page carries no frontmatter of its own.
    notes: >
      A page describes the records beneath it and is not one, so it has no id, tier or status. Nothing
      else would say so, because a page is forked and a forked file is never compared against upstream.

  # ── content ──────────────────────────────────────────────────────────────────
  #
  # The four whose question needs more than the expression grammar can ask. Each is a class in
  # `kac.core/Rules/`, dispatched by the rule id its type declares, and reports under the id here.

  y-statement:
    severity: warning
    description: A Y-statement block-quote follows the H1, states all six moves, and is within `max-words`.
    notes: >
      The message names the move that is absent, which is why this is a class: an expression could
      report only that the block-quote is not a Y-statement, and that is the one thing its author
      already knows.

  alternatives-verdict:
    severity: warning
    description: Each *Alternatives Considered* bullet states an outcome.
    notes: >
      Heuristic: an explicit verdict word, or a contrastive or negative-outcome cue. An option listed
      only to be dismissed in a clause was not genuinely considered.

  entry-shape:
    severity: error
    description: Each entry of a list whose entries are objects is a mapping.
    notes: >
      The field's `entry:` block says what one holds, and a scalar written where a mapping belongs
      carries none of it. Reported against the entry, so a list with one bad line among ten names the
      line.

  entry-key:
    severity: error
    description: An object entry carries the keys its field declares, and every key it declares as required.
    notes: >
      Both faults under one id, because they are the same mistake read from either end: a key the shape
      does not declare, and a required key the entry omits. The message quotes the entry by whatever its
      naming key holds, and falls back to the line where that key is the one missing.

  alignment-rollup:
    severity: error
    description: A policy's `aligns-with` and its `Alignment` column carry the same framework references.
    notes: >
      Both directions, and the message names the reference and the side it is missing from. A reference
      in a cell and not in the roll-up leaves the generated index under-reporting what the policy
      covers. A reference in the roll-up and not in any cell is a claim of coverage no clause can show.

      A framework cited with no reference into it compares as the framework alone, so `[WCAG 2.2 AA]` in
      a cell answers an `aligns-with` entry carrying no `clauses:`.

  framework-posture:
    severity: error
    description: A framework a clause cites is placed on the corpus's framework register.
    notes: >
      The register says whether we are obliged to a framework, self-obligated to it, or borrowing from
      it. `alignment-rollup` reads that standing to decide which references its roll-up carries, so a
      framework the register does not place would be left out with nothing saying so.

      Reported once per framework rather than once per clause citing it.

  terms-alphabetical:
    severity: warning
    description: A glossary's entries read in alphabetical order.
    notes: Compared without regard to casing, and the message names the entry that moved.

  dependency-cycle:
    severity: warning
    description: The records' `depends-on` edges form no loop.
