# Every check the validator reports. A type's own rules are declared beside the type, in `.schema/<type>.yaml`.
# <https://paul80nd.github.io/knowledge-as-code/design/checks/> says what each key means and when to add an entry.
# `description` is one sentence under 120 characters. It renders into a table cell.

checks:

  # ── schema ───────────────────────────────────────────────────────────────────

  schema-unknown-key:
    severity: error
    on-type-page: false
    description: Every key in a schema file is one the loader reads.
    notes: >
      `notes:` is the exception, admitted at every level as commentary. No list of permitted keys exists anywhere.
      See <https://paul80nd.github.io/knowledge-as-code/design/held-to/#whether-code-acts-on-the-value>.

  schema-unreadable:
    severity: error
    on-type-page: false
    description: Every declaration in a schema file is one the loader can read as written.
    notes: >
      An `expr:` that will not compile arrives here, along with the other unreadable declarations listed at
      <https://paul80nd.github.io/knowledge-as-code/design/held-to/#what-the-pass-reports>.

  schema-dispatch:
    severity: error
    on-type-page: false
    description: Every value the schema declares is one the tool has code to act on.
    notes: >
      A `ref:` and a `versus:` sit outside this pass, since either may name a type the corpus declined. The opposite
      fault, a check declared here that nothing reports, is the coverage gate's to fail. See
      <https://paul80nd.github.io/knowledge-as-code/design/held-to/#ref-and-versus>.

  schema-shape:
    severity: error
    on-type-page: false
    description: A type's declarations are well-formed and agree with one another.
    notes: >
      The lookup from folder to schema goes by file name, so a type naming any other folder hides every record
      beneath it. See <https://paul80nd.github.io/knowledge-as-code/design/held-to/#what-schema-shape-asks>.

  # ── frontmatter ──────────────────────────────────────────────────────────────

  type:
    severity: error
    on-type-page: false
    description: The document's folder maps to a type the schema declares.
    notes: >
      Discovery skips a folder that maps to no type, so no discovered document arrives here. This guards the
      callers that hand a document in directly, and the coverage gate lists it as unreachable.

  frontmatter-parses:
    severity: error
    description: The frontmatter block is present and parses as a YAML mapping.
    notes: >
      Reported once, and the pass stops there. Nothing below unparsed frontmatter can be judged, and every field in
      it would otherwise report as missing.

  unknown-key:
    severity: error
    description: Every frontmatter key is a universal field, a type field, or a reserved ADO key.

  derived-key:
    severity: error
    description: A field the type derives from the record's folders is left out of frontmatter.
    notes: >
      A derived field is declared, so `unknown-key` admits it and this check reports the written value instead. A
      template is asked the same, since a template writing the key teaches every copy to write one. See
      <https://paul80nd.github.io/knowledge-as-code/framework/metadata/#a-derived-field> and
      <https://paul80nd.github.io/knowledge-as-code/design/discovery/#from-sub-path>.

  key-order:
    severity: error
    description: Key order is a topological extension of the schema's declared field orders.
    notes: >
      A document is read against both declared orders at once, so a pair neither order states is free. See
      <https://paul80nd.github.io/knowledge-as-code/design/checks/#the-key-order-rule>.

  required-field:
    severity: error
    description: Every required field is present, and every `required-when` field whose condition holds.
    notes: >
      A `required-when:` whose named field is absent does not hold, `!=` included. That absence is already
      reported, so no second field is demanded on top of it.

  bare-key:
    severity: error
    description: An absent value is a bare key, never `null`, `~`, `""`, `''`, an em dash or an unquoted `{{…}}`.
    notes: >
      One spelling of absence, so a search for a required field nobody has filled in finds all of them. Every other
      spelling reads as a value to something, and an unquoted `owner: {{owner}}` is the trap: YAML parses it as a
      mapping, and the field arrives empty. An optional field with nothing to say is left out, and
      `empty-optional-key` reports one written with no value.

  empty-optional-key:
    severity: warning
    description: An optional field is filled in or left out, never written with no value.
    notes: >
      A bare optional key says what leaving the key out says, so it is a line a reader scans past. An empty
      required key is `required-field`'s to report, and there the empty key is a state worth seeing. A field
      declaring `required-when:` is exempt, since another field's value decides whether it is optional.

  date-quoted:
    severity: error
    description: A date field is a quoted string.
    notes: >
      Unquoted, YAML reads a date as a datetime. Azure DevOps then renders it in a local format and shifts the
      timezone, so the page shows a day the file never stated.

  date-format:
    severity: error
    description: A date field is `YYYY-MM-DD` and states a day the calendar has.

  timestamp-format:
    severity: error
    description: A timestamp field is `YYYY-MM-DDThh:mm:ssZ` and states a moment the calendar has.
    notes: >
      A moment, in UTC and to the second. A fractional second and an offset other than `Z` are refused, so two
      records write one instant one way. Quoting goes unchecked here, though `date-quoted` asks it of a date. An
      unquoted date is reread as a datetime and shifted into the reader's zone, and a `Z` instant means the same
      moment either way. The house form is unquoted.

  int-format:
    severity: error
    description: An int field, and each entry of an int list, is a whole number the tool can read.
    notes: >
      Plain decimal, with an optional leading sign. A separator such as `1_000` and a base prefix such as `0x1f`
      are refused, though YAML reads both as numbers. A run of digits past what a 64-bit number takes reports under
      the same id.

  enum:
    severity: error
    description: An enum value is a scalar the field's declared range admits.

  enum-lowercase:
    severity: error
    description: An enum value is lowercase.
    notes: An enum value is a grep target first and prose second, and two casings of it are two things to search for.

  list:
    severity: error
    on-type-page: false
    description: A list field is written as a YAML sequence.

  min-items:
    severity: error
    description: A list field has at least as many entries as its `min-items:` declares.
    notes: >
      Reported against the field, since no one entry is at fault. Declare it on a field whose value is its
      breadth, such as a fix's `symptom-keywords`.

  min-records:
    severity: warning
    description: Each value of a grouping field is used by at least as many records as its floor.
    notes: >
      This counts records per value, where `min-items` counts values per record. Declare it on a field whose values
      divide the type into groups worth browsing: a value one record uses divides nothing, and belongs in a field
      free to be unique. Counted per type, case-insensitively, once per record however often one repeats a value.

  field-pattern:
    severity: error
    description: A value matches the `pattern:` its field declares, once per list entry and once per scalar value.

  list-order:
    severity: warning
    description: A list field's entries read in alphabetical order, with digit runs compared as numbers.
    notes: >
      No list field's order means anything, so alphabetical is the order that scan-reads and the one any two
      authors agree on. Digit runs compare as numbers, so `A.8.7` precedes `A.8.29`. Only the first pair out of
      order is reported.

  type-matches-folder:
    severity: error
    description: "`type` equals the singular type name the record's folder declares."

  tier-matches-type:
    severity: error
    description: "`tier` equals the tier the type declares."

  id-prefix:
    severity: error
    description: "`id` starts with the type's prefix."

  id-format:
    severity: error
    description: The id's discriminator has the shape the type's `id.style` declares.
    notes: >
      The record's own id, and nothing around it. A citation may open with a producer's shortcode and close with a
      part. Each of those is spelled to suit what it points at, so a policy's clause is a mnemonic and a standard's
      rule is a heading slug. Whether the part exists is `ref-resolves`.

  id-matches-filename:
    severity: error
    description: The id's discriminator is the same string as the filename's.

  # ── identity ─────────────────────────────────────────────────────────────────

  filename-pattern:
    severity: error
    description: The filename matches the type's `filename.pattern`.

  slug-length:
    severity: error
    description: The slug (the filename minus any `NNNN-` or mnemonic prefix) is within `slug-max`.
    notes: >
      A filename is a handle and the H1 is the title. A slug that will not come under the limit usually means a
      document doing two things, so narrow the scope before you abbreviate harder.

  h1:
    severity: error
    description: The document has an H1, and nothing constrains its text.

  identity:
    severity: error
    description: "An identity line of two code spans follows the H1: `` `Type: id` `STATUS` ``."
    notes: >
      The top of the page states what kind of document this is, which one, and whether it is in force. A reader
      arriving from a citation needs all three. Frontmatter states them too, and renders as a table a reader may
      never open.

  identity-type:
    severity: error
    description: The identity line's type name is the `label` the folder's schema declares.

  identity-id:
    severity: error
    description: The identity line's id is the frontmatter's, character for character.

  identity-status:
    severity: error
    description: The identity line's status is the frontmatter's, upper-cased.
    notes: >
      Lower-case in frontmatter for a machine, upper-case on the line for a person. A document cannot go active and
      leave the line reading DRAFT.

  required-section:
    severity: error
    description: Every heading in `sections.required` is present.

  empty-section:
    severity: error
    description: A section the type declares has something under its heading.
    notes: >
      An author with nothing to say cannot delete a required heading, so what they leave behind is a blank. A
      template is exempt, its sections standing empty for the copy to fill. So is the section a type keeps its
      parts in, which the checks that read the parts cover.

  placeholder-left:
    severity: error
    description: No `{{…}}` from the template survives into a record, outside code.
    notes: >
      Reported once, naming the first placeholder, since an unfinished copy has a dozen. The file has an id, a
      title and every section, so every other check passes and it reads as complete until someone follows a link to
      `{{a}}.md`.

  # ── the parts of a record ────────────────────────────────────────────────────

  part-id-unique:
    severity: error
    description: No two parts of one record share an address.
    notes: >
      Asked of every source, so two glossary headings differing only in punctuation collide here and never make it
      to the published anchors. Compared ordinally: two ids differing only in case are not parts a reader could
      tell apart either.

  part-none:
    severity: error
    description: A section that takes its parts from headings has at least one heading under it.
    notes: >
      The heading-sourced counterpart to `clause-table`'s empty-table arm. Nothing else reports it: the section
      heading existing satisfies `required-section`, and `empty-section` passes the parts section over.

  part-empty:
    severity: error
    description: A part declared by a heading has something under it.
    notes: >
      Reported at every status, `draft` included. The source is read as written, so a horizontal rule standing
      in for the words counts as nothing. A table source needs no equivalent, since `clause-modal` stops a row with
      an empty cell first.

  clause-table:
    severity: error
    description: The declared section has a table headed with the block's `columns`, and at least one row.
    notes: >
      A missing table, a mis-headed one and an empty one are three faults under this id. Each is reported and stops
      the pass, since nothing beneath a broken table can be judged. A missing section belongs to
      `required-section`, which reports it instead.

  clause-id-format:
    severity: error
    description: Each clause id is a single code span matching the block's `id-pattern`.
    notes: A code span, since flattened text cannot tell an id from a word beside it.

  clause-modal:
    severity: error
    description: Each clause opens with a declared modal, bold where it binds and plain where it does not.
    notes: >
      Bold shows the binding level, which a reader skimming a long table takes in before the words. A binding modal
      written plain reads as advice, and an advisory one written bold reads as an obligation.

  clause-order:
    severity: warning
    description: Clause rows are grouped by binding level, in the order the type declares.
    notes: >
      Reported once, against the first row that breaks the grouping. A table sorted the wrong way throughout would
      otherwise report every row after the first.

  clause-compound:
    severity: warning
    description: Each clause states a single obligation under its own id.
    notes: A second modal in a row means a citation of that id can only ever pick out half of what the row says.

  # ── links ────────────────────────────────────────────────────────────────────

  link-resolves:
    severity: error
    description: Every internal link resolves, in any of the forms the wiki accepts.
    notes: >
      Repo-relative and wiki-root-absolute paths, where a leading `/` is the repo root. Inline, reference and
      shortcut reference links all count, and the `.md` is optional because Azure DevOps resolves both spellings.
      An external `http(s)`, `mailto` or `tel` link is skipped.

  fragment-resolves:
    severity: error
    description: A link's `#fragment` matches a heading in the document it points at.
    notes: >
      The anchor is the heading lower-cased, with spaces hyphenated and punctuation dropped, the one form every
      renderer agrees on. Azure DevOps percent-encodes what GitHub discards, so a heading with `/`, `:` or `.` in
      it has two anchors and fails here, before the wiki publishes it.

  undefined-label:
    severity: error
    description: A shortcut label shaped like any type's id has a link definition.

  label-canonical:
    severity: error
    description: A shortcut label is the id of the record it leads to, written canonically.
    notes: >
      Prefix lower-case, mnemonic upper-case, slug lower-case. A label spelled canonically, and a label no id style
      recognises at all, are both then held against the id in the frontmatter of the record the definition resolves
      to. That frontmatter is where a type keeping the id out of the filename states it. The label is its own
      display text, so either fault shows the reader an id nothing has. A template is exempt, its definitions
      demonstrating the form under labels nobody has chosen yet.

  part-ref:
    severity: error
    description: A part reference points at a document that exists and has that part.
    notes: >
      Checked wherever it appears, since any type may cite a part. The message fits the case: the document does not
      exist, its type keeps no parts, the part is not one it has, a colon sits where the dot belongs, a bare id
      points at an imported record, a scoped id points at one this corpus keeps, or the shortcode picks out a
      corpus this one consumes nothing from. A citation into an unrestored import reports nothing here, and
      `import-restored` states it once instead. See
      <https://paul80nd.github.io/knowledge-as-code/framework/metadata/#referring-to-an-id> and
      <https://paul80nd.github.io/knowledge-as-code/design/imports/#spelling-a-citation>.

  ref-resolves:
    severity: error
    description: An id in a field declaring a `ref:` points at a document that exists, of a type the `ref:` admits.
    notes: >
      Both halves are asked, of a scalar and a list alike, and whether or not the field also declares a
      `reciprocal:`. A literal the field admits, such as `applies-to: [all]`, is no id and is skipped. A field
      declaring `part-required:` is asked for the part as well, and the spelling faults `part-ref` reports across a
      corpus boundary are reported here in the same words.

  reciprocal:
    severity: error
    description: A field declaring a `reciprocal:` agrees with its counterpart in both directions.
    notes: >
      Whether the target exists, and whether its type is one the field may point at, belong to `ref-resolves`, so a
      dangling or wrong-type reference is reported once.

  related-matches-section:
    severity: error
    description: A field declaring a `mirrors-section:` reconciles with the ids that section links to.
    notes: >
      In both directions and case-insensitively, in a bullet or in prose alike. A section mentioning an id the
      field omits is as much a finding as a field entry the section never mentions. Declare this only where the
      field states the whole truth about what the section links to.

  mirrors-citations:
    severity: error
    description: A field declaring a `mirrors-citations:` reconciles with the lines carrying its label.
    notes: >
      A line that is bold alone is the labelled prose a glossary writes its `Not` in, and is passed over. Four
      faults sit on a line: it is not italic, it closes no section, it cites nothing the field could admit, or it
      cites a record whole where the field declares `part-required:`. Each is reported against the line once,
      however many ids that line wrote. The first three leave those ids counting toward the union, and the fourth
      withholds the id. Not italic stops the pass, the rest being questions about a footnote. See
      <https://paul80nd.github.io/knowledge-as-code/framework/metadata/#referring-to-an-id>.

  id-unique:
    severity: error
    description: An id is unique across the whole corpus.

  unused-definition:
    severity: warning
    description: Every link definition is referenced by something.

  bracket-literal:
    severity: warning
    on-type-page: false
    description: A `[...]` left in prose that reads as a reference has a definition behind it.
    notes: >
      A heuristic sibling of `undefined-label`, for a bracket that never became a link at all. Position decides a
      checkbox: `- [ ]` opening a list item is a marker, and the same brackets mid-sentence still warn. Write an
      inline link where the brackets are deliberate.

  type-setup:
    severity: error
    on-type-page: false
    description: A type the schema declares has both a page and a folder, or has neither.
    notes: >
      A type nobody has built yet reports nothing. Half of one reports here.

  corpus-enum-undeclared:
    severity: error
    on-type-page: false
    description: A field whose range the corpus states is judged against a list the corpus has written.
    notes: >
      Two faults arrive under this id, and both leave the field impossible to satisfy: a range the corpus never
      wrote, and one with a value that is not lower case. Reported once against the descriptor, since nobody
      writing a record can fix either. See
      <https://paul80nd.github.io/knowledge-as-code/corpus-descriptor/#enums>.

  shortcode:
    severity: error
    on-type-page: false
    description: The shortcode a corpus declares for itself can be written before a colon, and is no type's prefix.
    notes: >
      A corpus declaring no shortcode is asked none of this. The type prefixes come from the schema, so there is no
      list here to keep in step. Case is ignored for that comparison alone: `STD` is told both that it is miscased
      and that the spelling underneath is taken. See
      <https://paul80nd.github.io/knowledge-as-code/framework/metadata/#the-shortcode>.

  import-restored:
    severity: error
    on-type-page: false
    description: Every corpus this one declares in `consumes:` has been restored into `.imports/`.
    notes: >
      An unrestored import is an error, and every citation into it stays quiet once this is reported. See
      <https://paul80nd.github.io/knowledge-as-code/design/imports/#a-missing-restore>.

  import-behind:
    severity: warning
    on-type-page: false
    description: Every corpus in `consumes:` is locked at the newest version its own range admits.
    notes: >
      Asked once per `validate` run, and reported against the source. See
      <https://paul80nd.github.io/knowledge-as-code/design/imports/#an-import-that-has-fallen-behind>.

  import-capped:
    severity: info
    on-type-page: false
    description: A newer version of a consumed corpus is published, and this corpus's range keeps it out.
    notes: >
      Reported apart from `import-behind`, since somebody chose the range. See
      <https://paul80nd.github.io/knowledge-as-code/design/imports/#an-import-that-has-fallen-behind>.

  import-unreachable:
    severity: info
    on-type-page: false
    description: A lock in `consumes:` could not be checked against what its source publishes.
    notes: >
      A source replying with no versions at all reports here, and never as a lock that is current: a registry
      replies to a private feed's anonymous reader exactly as it replies about a package nobody has published. See
      <https://paul80nd.github.io/knowledge-as-code/design/imports/#an-import-that-has-fallen-behind>.

  framework-names-types:
    severity: error
    on-type-page: false
    description: The framework's own documents name a type and never link to one.
    notes: >
      The same goes for a record inside a type's folder. These files are byte-identical in every corpus, so a link
      that resolves here says nothing about where it is read: a corpus that never adopted standards has no
      `/standards` page to open. A generated block is exempt, being written from the types the corpus adopted.

  template-fields:
    severity: error
    on-type-page: false
    description: A type's template has every field a copy needs, usably, and no key the type does not declare.
    notes: >
      A placeholder opening a value has to be quoted, or YAML reads `review-by: {{date}}` as a mapping and the
      field arrives empty. A defect here lands in every document copied from the template, and the next author
      finds it.

  generated-block:
    severity: error
    on-type-page: false
    description: Every file `kac generate` writes a block into still has both of that block's markers.
    notes: >
      A block whose markers have gone is written by nothing and, without this check, reported by nothing.
      `generate --check` compares a file against what the generator would produce, and where it finds no marker
      that is the file as it stands. The corpus's own `README.md` is the exception, where deleting the markers is
      how a corpus declines the block.

  page-frontmatter:
    severity: error
    on-type-page: false
    description: A type page has no frontmatter of its own.
    notes: >
      A page describes the records beneath it and is not one, so it has no id, tier or status. Nothing else reports
      it: a page is forked, and a forked file is never compared against upstream.

  # ── content ──────────────────────────────────────────────────────────────────

  y-statement:
    severity: warning
    description: A Y-statement block-quote follows the H1, states all six moves, and is within `max-words`.
    notes: >
      The message states the move that is absent. An expression could report only that the block-quote is no
      Y-statement, which is the one thing its author already knows, so this is written as a rule class.

  alternatives-verdict:
    severity: warning
    description: Each *Alternatives Considered* bullet states an outcome.
    notes: >
      A heuristic, matching an explicit verdict word or a contrastive or negative-outcome cue. An option a bullet
      dismisses in one clause was never genuinely considered.

  entry-shape:
    severity: error
    description: Each entry of a list whose entries are objects is a mapping.
    notes: >
      The field's `entry:` block says what an entry contains, and a scalar written where a mapping belongs supplies
      none of it. Reported against the entry, so one bad line among ten is the line the message quotes.

  entry-key:
    severity: error
    description: An object entry has the keys its field declares, and every key it declares as required.
    notes: >
      Two faults under one id: a key the shape does not declare, and a required key the entry omits. The message
      quotes the entry by its naming key, and falls back to the line number where that key is the one missing.

  alignment-rollup:
    severity: error
    description: A policy's `aligns-with` and its `Alignment` column state the same framework references.
    notes: >
      Checked in both directions, and the message states the reference and the side it is missing from. A framework
      cited with no reference into it compares as the framework alone, so `[WCAG 2.2 AA]` in a cell matches an
      `aligns-with` entry with no `clauses:`. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#the-framework-register>.

  framework-posture:
    severity: error
    description: A framework a clause cites is placed on the corpus's framework register.
    notes: >
      Reported once per framework, however many clauses cite it. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#the-framework-register>.

  framework-uncited:
    severity: error
    description: A framework on the corpus's framework register is cited by at least one clause.
    notes: >
      The register is found by following a clause's own link to it, so a corpus whose clauses cite nothing has no
      register in view and reports nothing. Reported against the policy that linked to the page, since the register
      has no frontmatter and is no record, and the message states the page instead. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#the-framework-register>.

  report-stale:
    severity: warning
    description: Each corpus a report lists in `sources` is still at the version the report states.
    notes: >
      A `resource` this corpus does not read is skipped, and reports nothing. See
      <https://paul80nd.github.io/knowledge-as-code/design/reports/#moving-the-version-without-regenerating>.

  self-verification:
    severity: error
    description: A report's `verified` list leaves out the producer that generated it.
    notes: >
      Reported against the entry, so the message points at the line to delete. The comparison is exact, so
      `kac/0.25.0` verifying a report `kac/0.24.0` generated stands: a later version reading the corpus again is a
      second look.
      See <https://paul80nd.github.io/knowledge-as-code/design/reports/#the-provenance-frontmatter>.

  terms-alphabetical:
    severity: warning
    description: A glossary's entries read in alphabetical order.
    notes: Compared without regard to casing, and the message states the entry that moved.

  dependency-cycle:
    severity: warning
    description: The records' `depends-on` edges form no loop.
    notes: >
      No one record shows the loop, which is a property of the edges together, so the message states the route it
      runs through. Reported once per loop, against the lowest id on it.
