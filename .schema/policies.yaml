# yaml-language-server: $schema=./meta/type.schema.json

type: policy
label: Policy
label-plural: Policies
folder: policies
page: policies.md
tier: normative
lifecycle: living
summary: A high-level engineering commitment, independent of any stack and rarely changed.
goes-here: A principle-level commitment about how software is engineered here
detail: >
  Alignment to an external framework is stated clause by clause. A standing such as certification belongs in
  `frameworks.md`.

versus:
  standards: >
    A policy stays true whatever the stack, the framework or the year: "we do not store secrets in source
    control". A standard is specific enough to check: "read secrets from the vault via workload identity". If a
    statement would survive replacing the whole technology estate, it is a policy.

lineage:
  prior-art: "[ComplianceForge HCGF](https://complianceforge.com/start-here/governance-risk-compliance-grc-content/hierarchical-cybersecurity-governance-framework), Policy layer"
  alignment: >
    Statements of intent, with the mandatory language pushed down to the layer below
  divergence: >
    HCGF policy is security-scoped and externally driven. A policy here states inward-facing engineering intent,
    and puts its obligations in a clause table, so each row can be cited

collision: >
  In ISO/IEC 27001 an information security policy is a mandatory, auditable artefact. Here a policy is the
  deliberately **non-binding** layer: it states intent, and the standard beneath it states the obligation. A
  reader arriving from an information security management system will read a policy here as binding, and be
  wrong.

# A four-character mnemonic, upper case in the id and lower case in the filename: pol-VURM is filed as
# vurm-vulnerability-remediation.md.
id:
  prefix: pol
  style: mnemonic
  width: 4

filename:
  pattern: '^[a-z][a-z0-9]{3}-[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  category:
    type: string
    from: sub-path
    description: The folder the policy is filed under, below `policies/`.
    notes: >
      A category says why the policy exists. `tags` say what topics it touches.

  status:
    required: true
    type: enum
    values: [draft, active, retired]
    description: Whether the policy is being agreed, in force, or retired. Retire a policy instead of deleting it.

  aligns-with:
    required: false
    type: list
    of: object
    entry:
      framework:
        required: true
        type: string
        description: The framework's link label, as the `Alignment` cell writes it, version included.
      clauses:
        required: false
        type: list
        of: string
        description: The references inside that framework this policy's clauses map to.
    description: The binding frameworks this policy's clauses map to, grouped with the references they cite.
    notes: >
      A framework cited with no reference into it takes no `clauses:`, as `[WCAG 2.2 AA]` does. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#the-framework-register>.

  review-by:
    required: true
    type: date
    description: The day the policy is looked at again, usually a year ahead.

# `Clauses` is the only place an obligation is stated. `Notes` takes the context: why the policy aligns to no
# framework, and what it leaves to an implementing process.
sections:
  required: [Purpose, Scope, Clauses]
  optional: [Exceptions, Notes]

# A clause id runs to seven characters, upper case, because a citation such as `pol-VURM.TIMEBOX` puts it beside
# the policy id. Binding levels are written bold and advisory plain, and rows are grouped by level, because a
# Markdown table has no divider. `clause-order` reports a table that leaves a level and re-enters it, and leaves
# the order inside a level to the author.
parts:
  source: table
  section: Clauses
  noun: clause
  columns: [Id, Clause, Alignment]
  id-pattern: '^[A-Z][A-Z0-9]{1,6}$'
  binding: [MUST, MUST NOT]
  advisory: [SHOULD, COULD]

export:
  version: 2
  fields: [id, title, category, status, review-by]
  sections:
    Purpose: summary
    Scope: full
    Exceptions: full
  frameworks: frameworks.jsonl
  parts:
    fidelity: full
    line:
      id: part.id
      clause: part.text
      level: part.level
      type: record.type
      record: record.id
      part: part.key
      status: front.status
      reviewBy: front.review-by
      path: record.path
      anchor: part.anchor
  notes: >
    A clause sends no `seeAlso`. A cross-reference is read from the body beneath a part, and a table row has no
    body. <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#policies> says what travels, and
    what stays behind.
index:
  columns: [id, title, category, status, aligns-with, review-by]
  sort: id

rules:
  - id: alignment-rollup
    description: >
      `aligns-with` lists every binding reference the `Alignment` column cites, and no others.
    severity: error
    postures: [Obliged, Self-obligated]
    # `postures:` lists the standings that oblige a summary, in the words `frameworks.md` files them under.
    # The corpus decides that list, and `kac` reads it.

  - id: posture-belongs-to-frameworks
    description: '"compliant", "certified" or "registered" written near a framework reference.'
    severity: warning
    # The pattern needs proximity: a policy may say "compliance" about a process without claiming a standing.
    expr: >-
      not matches('(?i)(compliant|compliance|certified|registered)[^.]{0,80}(ISO|GDPR|SOC ?2|PCI)|(ISO|GDPR|SOC ?2|PCI)[^.]{0,80}(compliant|compliance|certified|registered)')
    message: >
      this claims a standing against a framework. Say where the organisation stands in `frameworks.md`.
