# yaml-language-server: $schema=./meta/type.schema.json

type: policy
label: Policy
label-plural: Policies
folder: policies
page: policies.md
tier: normative
lifecycle: living
summary: "A high-level engineering commitment: the what and the why, largely stack-agnostic and changing rarely."
goes-here: A commitment about how we engineer, at principle level
detail: >
  Alignment to an external framework is stated clause by clause, as alignment rather than certification.

versus:
  standards: >
    A policy is true regardless of stack, framework or year: "we do not store secrets in source control". A
    standard is specific enough to check: "read secrets from the vault via workload identity". If it would
    still be true after replacing the entire technology estate, it is a policy.

lineage:
  prior-art: "[ComplianceForge HCGF](https://complianceforge.com/start-here/governance-risk-compliance-grc-content/hierarchical-cybersecurity-governance-framework), Policy layer"
  alignment: >
    Non-prescriptive statements of intent, with the mandatory language pushed down to the layer below
  divergence: >
    HCGF policy is security-scoped and externally driven. Ours is inward-facing engineering intent, and states its
    obligations as an addressable clause table rather than as prose

collision: >
  In ISO/IEC 27001 an information security policy is a mandatory, auditable artefact. Here, a policy is the
  deliberately **non-binding** layer: it states intent, and the standard beneath it carries the obligation. A
  reader arriving from an information security management system will read our policies as binding and be wrong
  about it.

# A four-character mnemonic, upper-case in the id and lower-case in the filename: pol-VURM in
# vurm-vulnerability-remediation.md. A policy is cited from standards, controls and processes, so the id
# is what a reader meets most often and it should say something. Draw it from the policy's concept rather
# than its wording: the mnemonic is immutable once the policy is active, so retitle freely and never
# re-mnemonic. A change big enough to invalidate it is a new policy and a retirement of the old one.
id:
  prefix: pol
  style: mnemonic
  width: 4

filename:
  pattern: '^[a-z][a-z0-9]{3}-[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  category:
    type: string
    from: sub-path
    description: The folder the policy is filed under, below `policies/`.
    notes: >
      Why the policy exists, where `tags` say what topics it touches. The two answer different questions
      and stay separate.

      Where you save the file is what sets it. A policy saved straight into `policies/` has no category,
      and the corpus stays as one list until it wants folders.

      The folders are the corpus's own and no list here closes them. A category earns its place by
      grouping enough policies to be worth navigating, and changing one means moving the file and
      repointing what links to it.

  status:
    required: true
    type: enum
    values: [draft, active, retired]
    description: '`draft` until agreed. `retired` rather than deleted.'

  aligns-with:
    required: false
    type: list
    of: object
    entry:
      framework:
        required: true
        type: string
        description: The framework's link label, as the `Alignment` cell writes it, version included.
      clauses:
        required: false
        type: list
        of: string
        description: The references inside that framework this policy's clauses map to.
    description: The binding frameworks this policy's clauses map to, with the references they reach.
    notes: >
      Every binding reference the document's clauses carry, grouped under the framework supplying it, so
      the generated index reads as a coverage table. The clause table is where a mapping is stated and
      this summarises it, so a reference here that no clause carries is a claim of coverage the document
      cannot show. `alignment-rollup` holds the two together in both directions.

      Binding is the word doing the work. A clause may cite a framework we took ideas from, and that
      citation is provenance rather than obligation. The roll-up carries the frameworks `frameworks.md`
      files as obliged or self-obligated, so the index answers what we are on the hook for.

      Grouped rather than flat because the number of frameworks a policy touches stays small while the
      number of references does not. A data protection policy maps to two frameworks and twenty of their
      references, and a flat list would give the frontmatter twenty lines saying which two.

      The framework is named by the label its `Alignment` cell carries, so `[ISO 27001:2022].A.8.24` in
      the table is `ISO 27001:2022` here. Naming it by the `frameworks.md` anchor instead would drop the
      version, which is the half a coverage claim turns on. A framework cited with no reference into it
      carries no `clauses:`, as `[WCAG 2.2 AA]` does.

  review-by:
    required: true
    type: date
    description: Quoted. Annual is usually right for a policy.

# `Clauses` is the policy proper: a table of addressable obligations, one row each, so a standard or a
# control can cite the commitment it answers rather than the whole document. It is the only place an
# obligation is stated, and a sentence that binds anywhere else has escaped the table.
#
# `Notes` holds what is contextual about this policy: why it carries no framework alignment, how it
# relates to the taxonomy, what it leaves to an implementing process.
sections:
  required: [Purpose, Scope, Clauses]
  optional: [Exceptions, Notes]

# Where a policy keeps the parts something else can cite, and the shape of the table it keeps them in. A
# type carries clauses by describing them here, and one with no `parts:` block offers none.
#
# Ids are short and upper-case because they are read inside a citation (`pol-VURM.TIMEBOX`), where a long
# one buries the policy it belongs to. Seven characters is enough for a word worth guessing at. Each is
# written beside its row.
#
# Binding levels are written bold and non-binding ones plain, and rows are grouped in the order below, so
# a reader sees the weight drop off down the table without needing a divider it cannot carry.
# `clause-order` reports a table that leaves a level and re-enters it. Inside a level the author's order
# stands, unchecked: related obligations are grouped by hand, and nobody reads a clause table by id.
#
# `Alignment` carries the frameworks a clause maps to, as reference links resolving into
# `/frameworks.md`. Per clause rather than per document, because a policy aligns with a control through
# one obligation and not through all of them, and an empty cell is the honest answer where no genuine
# mapping exists. What our standing against a framework is, whether obliged, self-obligated or
# inspiration, is stated once in `frameworks.md` and nowhere else.
parts:
  source: table
  section: Clauses
  noun: clause
  columns: [Id, Clause, Alignment]
  id-pattern: '^[A-Z][A-Z0-9]{1,6}$'
  binding: [MUST, MUST NOT]
  advisory: [SHOULD, COULD]

export:
  version: 2
  fields: [id, title, category, status, review-by]
  sections:
    Purpose: summary
    Scope: full
    Exceptions: full
  parts:
    fidelity: full
    line:
      id: part.id
      clause: part.text
      level: part.level
      type: record.type
      record: record.id
      part: part.key
      status: front.status
      reviewBy: front.review-by
      path: record.path
      anchor: part.anchor
  notes: >
    A clause carries its level as a key of its own. `MUST` and `COULD` open the same shape of sentence,
    so reading the words alone means holding this type's modals to tell an obligation from a
    suggestion. The key names the level instead, and an agent asking what it has to do filters on one
    value.

    `Scope` and `Exceptions` travel whole, because each bounds the clauses beneath it. A consumer
    holding a clause without them reads a stricter policy than the one we wrote. `Purpose` travels as
    its opening paragraph, which is where a policy states its position.

    Alignment stays behind entire, cell and roll-up alike. A reference resolves through `frameworks.md`,
    which says whether we are obliged, self-obligated or merely borrowing, and no consumer receives that
    page. A mapping carried without it says a policy touches A.8.24 and leaves the reader to guess what
    touching it commits us to.

    A clause carries no `seeAlso`: a cross-reference is read from the body beneath a part, and a table
    row has none. A clause pointing at another policy reaches a consumer as the id inside its words.

index:
  columns: [id, title, category, status, aligns-with, review-by]
  sort: id

rules:
  - id: alignment-rollup
    description: >
      `aligns-with` carries every binding reference the `Alignment` column cites, and no others.
    severity: error
    postures: [Obliged, Self-obligated]
    # Both directions. A reference in the table and not in the roll-up leaves the index under-reporting
    # coverage, and one in the roll-up and not in the table is a claim of coverage no clause can show. The
    # second is the worse of the two: it reads as evidence.
    #
    # `postures:` names the standings that oblige a summary, as `frameworks.md` heads them. A framework
    # binding nothing dilutes the only question a coverage table answers. The standings are the corpus's
    # judgement rather than the tool's, which is why they are declared here.
    #
    # An error rather than a warning, unlike the other checks over this table. The rest report how a clause
    # is written, where an author's judgement is what is being questioned. This one reports two copies of
    # one fact disagreeing.

  - id: posture-belongs-to-frameworks
    description: '"compliant", "certified" or "registered" near a framework reference. Standing belongs in `frameworks.md`.'
    severity: warning
    # Proximity rather than the bare word: a policy may reasonably say "compliance" about a process without
    # claiming a standing. It is the claim beside a framework's name that belongs somewhere else.
    expr: >-
      not matches('(?i)(compliant|compliance|certified|registered)[^.]{0,80}(ISO|GDPR|SOC ?2|PCI)|(ISO|GDPR|SOC ?2|PCI)[^.]{0,80}(compliant|compliance|certified|registered)')
    message: >
      This claims a standing against a framework. A policy maps clauses to controls. Where the organisation
      stands belongs in `frameworks.md`, the one place it can be kept true.
