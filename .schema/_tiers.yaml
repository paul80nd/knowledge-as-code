# The tiers, in the order a reader meets them, with the label and the behaviour a generated page needs.

notes: >
  Order is load-bearing. Every generated list of types groups by tier in the order declared here, from
  what has been decided to what has only been noticed.

tiers:

  decided:
    label: Decided
    behaviour: immutable once accepted
    note: >
      Superseded, never rewritten, so what was thought at the time survives being wrong.

  normative:
    label: Normative
    behaviour: living, owned, reviewed

  descriptive:
    label: Descriptive
    behaviour: living, must mirror reality
    note: >
      CI can check these against the estate itself. They also fall out of date fastest.

  procedural:
    label: Procedural
    behaviour: living, must be rehearsed
    note: >
      Each records when it was last rehearsed. An unrehearsed process is annoying. An unrehearsed
      runbook is dangerous.

  observed:
    label: Observed
    behaviour: perishable, unreviewed until promoted
    note: >
      The tier with the least authority is the one a corpus most depends on. Capture has to be cheap,
      or it does not happen.
