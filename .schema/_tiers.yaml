# The tiers, in the order a reader meets them, with the label and the behaviour a generated page needs.

notes: >
  Order is load-bearing. Every generated list of types groups by tier in the order declared here, from
  what has been decided to what has to be rehearsed.

tiers:

  decided:
    label: Decided
    behaviour: immutable once accepted, except to correct it
    note: >
      A decided record is about one moment: a decision, or an incident. Once accepted, it changes only to
      correct what it misstates about that moment, or to fix its prose and spelling. It never follows what
      changed afterwards, and a changed decision is a new record that supersedes it. A decided record states the
      constraints it asserts. It cites a descriptive record for background, and never as the authority behind a
      constraint.

  normative:
    label: Normative
    behaviour: living, owned, reviewed

  descriptive:
    label: Descriptive
    behaviour: living, must mirror reality
    note: >
      CI can check these against the estate itself. They also fall out of date fastest.

  procedural:
    label: Procedural
    behaviour: living, must be rehearsed
    note: >
      Each records when it was last rehearsed. An unrehearsed process is annoying. An unrehearsed
      runbook is dangerous.
