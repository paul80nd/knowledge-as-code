# yaml-language-server: $schema=./meta/type.schema.json

type: explanation
label: Explanation
label-plural: Explanations
folder: explanations
page: explanations.md
tier: descriptive
lifecycle: living
summary: Narrative that helps you understand how something works, or why it is shaped the way it is.
goes-here: How something works, or why it is shaped that way
detail: >
  Architecture overviews, conceptual walkthroughs, and how the pieces fit together. An explanation points at the
  documents with the detail and does not repeat it. One that accumulates facts of its own falls out of date as
  soon as those facts move.

versus:
  standards: >
    An explanation helps you understand. A standard tells you what to do. If it says you **MUST** do something,
    it is a standard however much context surrounds it.
  processes: >
    An explanation says how something works. A process says how to perform a task. If a reader is meant to
    follow it step by step, it is a process.
  services: >
    An explanation covers how the pieces fit together. A service document describes one deployable component. If
    it is about a single component, it is a service.
  adrs: >
    An explanation describes the shape something has. An ADR records the choice that gave it that shape, and is
    frozen at the moment of choosing.

lineage:
  prior-art: "[Diátaxis](https://diataxis.fr/explanation/), Explanation"
  alignment: >
    Name for name, and understanding-oriented. Diátaxis asks an explanation to stay closely bounded, and
    [the Good Docs Project's concept template](https://www.thegooddocsproject.dev/template/concept) opens with a
    required *Definition* that fixes the scope. `What this covers` is that section. Diátaxis also asks an
    explanation to make connections to other things, which is what `explains` and `Where the detail lives` record
  divergence: >
    Diátaxis asks an explanation to be discursive, and to weigh alternatives and counter-examples. Here the choice
    between alternatives is an ADR, and `links-rather-than-restates` rations the prose at about forty words for each
    outbound link. [arc42](https://docs.arc42.org/home/) keeps the decisions, the quality goals and the glossary
    inside the architecture document, where each is a separate type here. Diátaxis constrains explanation against
    tutorial, how-to and reference alone. This framework also forbids an explanation being normative or a catalogue
    entry
id:
  prefix: exp
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [draft, active, stale]
    in-force: active
    description: '`draft` while it is written, `active` once it is right, `stale` where it has fallen behind.'

  explains:
    required: true
    type: list
    of: id
    ref: [services, offerings, standards, processes, adrs]
    description: Ids of the services, offerings, standards, processes and ADRs this explains.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone confirms this is still true.
    notes: An explanation is the residual category, so the review date does more work here than on other types.

sections:
  required: [What this covers, Where the detail lives]
  optional: []
  notes: >
    `What this covers` states what the record covers and what it leaves to another record, which is what keeps the
    residual type bounded. `Where the detail lives` lists the records with the facts. Between them the body is
    free-form, because an explanation is narrative and its shape follows its subject.

export:
  version: 2
  fields: [id, title, status, explains, review-by, tags]
  sections:
    What this covers: full
    Where the detail lives: full
  notes: >
    `What this covers` tells a reader who cannot open the record what the record is about. `Where the detail lives`
    travels for the ids in it, because what an explanation points at is the rest of what it offers that reader.
    See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#explanations>.

index:
  columns: [id, title, explains, status, review-by]
  sort: id

rules:
  - id: links-rather-than-restates
    description: An explanation's prose stays proportionate to the links it makes.
    severity: warning
    # A ratio, so an explanation that links to nothing fails at any length.
    expr: "words() <= links() * 40"
    message: >
      prose has outgrown the links. Link to the document that owns each fact instead of restating it
      here.
  - id: not-normative
    description: No bold RFC 2119 keyword (MUST, MUST NOT, SHOULD, SHOULD NOT, MAY) binds from an explanation.
    severity: warning
    # Bold is what binds under BCP 14, so a keyword in plain text is a quotation.
    expr: >-
      not matches('\*\*(MUST NOT|MUST|SHOULD NOT|SHOULD|MAY)\*\*')
    message: >
      a bold RFC 2119 keyword binds, and an explanation does not. Move the obligation into a standard
      and link to it from here.
  - id: not-load-bearing
    description: No decided-tier document cites an explanation as the authority for a constraint.
    # The decided tier is an ADR or a postmortem, and an immutable record may not rest on a mutable one.
