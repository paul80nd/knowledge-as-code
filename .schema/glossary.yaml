type: glossary
label: Glossary
label-plural: Glossary
shape: single-document
page: glossary.md
tier: descriptive
lifecycle: living
summary: The ubiquitous language — terms whose meaning is specific to us, or which are easily confused.
goes-here: A term whose meaning isn't obvious, or that we use in a specific way
detail: >
  Small, high-value, and the one document worth loading into every session. A term that needs explaining every
  time it appears belongs here once, and everything else links to it.

lineage:
  prior-art: "Evans, *Domain-Driven Design* — ubiquitous language"
  alignment: >
    A rigorous shared vocabulary maintained against ambiguity, used identically by everyone
  divergence: >
    DDD scopes the language to a bounded context and expects a word to differ across contexts. Ours is corpus-wide
    and single-valued

notes: >
  The only type that is one document rather than a collection, which is what `shape` says. A
  single-document type declares no `folder:` — there are no per-term files and no per-record schema, so the
  frontmatter below belongs to `glossary.md` itself. Terms are H3 headings and their anchors are their
  identifiers, and nothing generates an index because the document is its own.

  A term is an H3 heading, a one-sentence definition, an optional `**Not:** …` line naming what it is most often
  confused with, and optional links to the owning service or an explanation. Those `**Not:**` lines are the most
  useful content in the file. One paragraph per term, because the rules digest carries this file whole and every
  paragraph is spent from the same budget. The list is alphabetical and flat — no A–Z sub-headings — so that it
  reads end to end and greps cleanly. All of that is held by whoever reviews the file: the rules below that would
  read a term's shape are declared and not built, and no check parses an entry.

id:
  prefix: null
  style: literal
  value: glossary

fields:

  status:
    required: true
    type: enum
    values: [draft, active]
    description: '`draft` while the terms are still settling.'

  review-by:
    required: true
    type: date
    description: Quoted. The whole file is reviewed at once.

sections:
  required:
    - "What is the glossary?"
    - "Why we use it"
    - "Scope"
    - "Terms"
    - "Adding a term"
  optional: []

rules:
  - id: carried-in-full-by-digest
    description: No glossary entry runs beyond one paragraph.
    # The generated rules digest carries this file whole, so every entry consumes budget directly.
  - id: undefined-terms
    description: >
      Reports terms appearing more than N times across the corpus with no glossary entry.
  - id: unused-terms
    description: Reports glossary entries not used anywhere else.
  - id: terms-are-singular
    description: Entry headings are singular and in canonical casing.
