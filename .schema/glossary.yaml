# yaml-language-server: $schema=./meta/type.schema.json

type: glossary
label: Glossary
label-plural: Glossaries
folder: glossary
page: glossary.md
tier: descriptive
lifecycle: living
summary: The ubiquitous language. Terms with a meaning specific to the organisation, or easily confused with another.
goes-here: A term whose meaning is local, or not obvious
detail: >
  One glossary per bounded context, each small enough to read end to end. A term that needs explaining every
  time it appears belongs in the most general glossary that admits it, and the narrower glossaries link to that
  entry.

lineage:
  prior-art: "Evans, *Domain-Driven Design*: ubiquitous language"
  alignment: >
    A rigorous shared vocabulary maintained against ambiguity, scoped to a bounded context and used identically
    within it
  divergence: >
    Evans' language is spoken as much as written, and lives in the model and the code. A glossary here is a set of
    documents, and nothing checks the code against them

notes: >
  A glossary covers one bounded context or product surface, never a topic. A narrower glossary redefines a term
  only where the meaning genuinely differs. The entries are one flat list with no A-Z sub-headings, so the file
  scans and greps cleanly.

id:
  prefix: gls
  style: slug
  notes: >
    The slug is the context, so the corpus-wide glossary takes the corpus's own name and a system's glossary
    takes the system's.

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [draft, active]
    description: '`draft` while the terms are still settling.'

  narrows:
    required: false
    type: id
    ref: glossary
    description: Id of the more general glossary this one narrows.
    notes: >
      Empty where no glossary sits above this one. The value records the ordering, so the most general
      glossary that admits a term is found from the index. A glossary every corpus shares leaves it empty,
      because a shared file cannot cite a record only one corpus has.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which the whole glossary is reviewed.

sections:
  required: [Scope, Terms]
  optional: []
  notes: >
    `Scope` says which context this glossary admits, so a contributor can decide whether a new word belongs
    here. The terms are H3s under `Terms`, and a cross-reference points at a term's anchor.

# A term is an H3 under `Terms`, cited by the anchor its heading slugs to. `Terms` is absent from `sections:`
# above, because `parts:` declares it here.
parts:
  source: headings
  section: Terms
  noun: term
  level: 3
  aside: Not

export:
  version: 1
  fields: [id, title, narrows, status, review-by, tags]
  sections:
    Scope: full
  parts:
    fidelity: full
    line:
      id: part.id
      title: part.text
      definition: part.lead
      not: part.aside
      seeAlso: part.see-also
      type: record.type
      record: record.id
      part: part.key
      status: front.status
      reviewBy: front.review-by
      path: record.path
      anchor: part.anchor
  notes: >
    A term travels whole: the definition, and the `**Not:**` line beneath it as a second piece.
    See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#glossary>.
index:
  columns: [id, title, narrows, status, owner, review-by]
  sort: id

rules:
  - id: redefinitions-are-reciprocal
    description: >
      Where one glossary redefines a term another defines, each entry links to the other entry's anchor.
    # Where the general glossary is a synced file, only the narrower entry states the reference.
  - id: carried-in-full-by-digest
    description: >
      No entry runs beyond one paragraph. The digest takes the glossaries in the order the export writes
      them.
    # A glossary is read end to end, so every entry's length is read by every reader.
  - id: undefined-terms
    description: >
      Reports terms appearing more than N times across the corpus with no glossary entry.
  - id: unused-terms
    description: Reports entries nothing uses, where a use inside the term's own context counts as one.
  - id: terms-are-alphabetical
    description: A glossary's entries are in alphabetical order, compared without regard to casing.
    severity: warning
  - id: terms-are-singular
    description: Entry headings are singular and in canonical casing.
