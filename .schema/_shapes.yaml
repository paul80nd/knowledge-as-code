# Object shapes used by more than one type. Referenced as `shape: <name>` on a field.
# A shape used by exactly one type lives in that type's file, as an `entry:` block.

notes: >
  A shape declares the keys of one object, in the order they are written. A field taking a shape takes
  all of them, because nothing narrows a shape at the point of use. A type that needs a narrower value
  writes a rule with an `expr:`, and the failure then appears on the record.

shapes:

  event:
    entry:
      at:
        required: true
        type: timestamp
        description: The moment it happened, in UTC as `2026-09-07T20:18:00Z`.
      by:
        required: true
        type: string
        description: Who or what acted. A type that limits this to one kind of actor writes a rule.
    notes: >
      An actor doing something at a point in time, as a person verifying an answer. The shape gives the
      actor and the moment, and says nothing about the act itself. `at` leads the entry, so a list of
      these sorts oldest first on its first key. `by` takes any string, because a verification gives a
      person, a process or an agent, and a type that limits the set writes a rule.

  run:
    entry:
      at:
        required: true
        type: date
        description: Quoted. The day it happened, as `"2026-10-20"`.
      by:
        required: true
        type: string
        description: Who did it. A type that limits this to one kind of actor writes a rule.
      method:
        required: false
        type: enum
        values: [live, tabletop]
        description: "How the walk went: `live` caused the fault, `tabletop` read the steps against the system."
    notes: >
      The last time somebody did something that leaves no log of its own: walked a runbook, followed a process end
      to end, or ran a check by hand. Git keeps the earlier runs. `at` is a day where `event` takes a moment,
      because nobody records the minute a walk ended. `method` belongs to a runbook, and a type with one way of
      doing the thing refuses it with a rule.
