# yaml-language-server: $schema=./meta/type.schema.json

type: discovery
label: Discovery
label-plural: Discoveries
folder: discoveries
page: discoveries.md
tier: observed
lifecycle: perishable
summary: Something noticed during work and not yet verified, captured cheaply and expiring unless promoted.
goes-here: Something surprising you noticed and have not verified
detail: >
  A title, an observation, why it might matter, and a confidence level. "The build fails silently if X" then
  has somewhere to go the moment somebody notices it.

versus:
  fixes: >
    A discovery is unverified, and might be wrong or already fixed. A fix has been checked by somebody, so it
    has authority. Never write straight to a fix from a session. Capture the discovery and let promotion do
    the work.

lineage:
  prior-art: "None. See [What has no precedent](https://paul80nd.github.io/knowledge-as-code/framework/lineage/#what-has-no-precedent)"

notes: >
  This type declares no `export:` block, so nothing in it travels. A discovery is unverified, expires by
  default, and is often true of one machine on one branch. Inheriting another corpus's discoveries would mix
  observations you cannot act on into your own view.
  See <https://paul80nd.github.io/knowledge-as-code/design/export/>.

id:
  prefix: dsc
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [open, promoted, expired, rejected]
    description: Open until promoted, expired or rejected.

  source:
    required: true
    type: enum
    values: [human, session, dreamed]
    description: Who or what observed it. `dreamed` means an agent proposed it.

  confidence:
    required: true
    type: enum
    values: [unverified, corroborated, confirmed]
    description: Starts at `unverified`, and moves only when somebody proves it.
    notes: An agent cannot confirm its own observation.

  expires:
    required: true
    type: date
    description: Quoted. The day the observation lapses, ninety days from capture.
    notes: >
      Nothing here writes a document's frontmatter, so the ninety days is the template's to set. An
      observation nobody has needed in ninety days was probably situational.

  provenance:
    required: false
    required-when: 'source == dreamed'
    type: string
    description: A reference back to the session and passage, so a reviewer can check the claim.
    notes: An unverifiable proposal is a rejected proposal.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this observation concerns.

  promoted-to:
    required: false
    required-when: 'status == promoted'
    type: id
    ref: [fixes, standards]
    reciprocal: promoted-from
    description: The fix or standard this became.

sections:
  required: [What I saw, Context, Why it might matter]
  optional: []

index:
  columns: [id, title, source, confidence, status, expires]
  sort: expires

rules:
  - id: low-ceremony
    description: A discovery stays within the length a capture needs.
    severity: warning
    expr: "words() <= 200"
    message: >
      this is longer than a capture should be. Promote it into a fix or a standard, and write the detail
      there.
  - id: expiry-sweep
    description: >
      Scheduled. A discovery past `expires` with no promotion is set to `expired` with a note, and kept.
