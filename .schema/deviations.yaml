# yaml-language-server: $schema=./meta/type.schema.json

type: deviation
label: Deviation
label-plural: Deviations
folder: deviations
page: deviations.md
tier: normative
lifecycle: living
summary: A knowing departure from a rule, the person who accepted the risk, and the date it is reviewed.
goes-here: A departure from a rule that somebody agreed to
detail: >
  The record says what is being done instead, why that was worth accepting, and what limits the risk meanwhile.
  A year later, nobody can tell an unwritten departure from ignorance of the rule.

versus:
  adrs: >
    An ADR decides how something is built, and the decision stays true. A deviation records a rule knowingly
    broken, and is written to be closed. If the estate is meant to look like this from now on, write the ADR
    and change the rule.
  policies: >
    A policy is the commitment. A deviation is one named, dated departure from it, and changes nothing the
    policy says. A departure everyone takes is a policy that needs rewriting.

lineage:
  prior-art: "[NIST SP 800-37 Rev. 2](https://csrc.nist.gov/pubs/sp/800/37/r2/final), the plan of action and milestones a named official accepts risk against"
  alignment: >
    A named individual accepts a residual risk for a bounded period, and the remediation stays tracked
  divergence: >
    A plan of action and milestones sits inside a system authorisation and feeds an accreditation. A
    deviation here departs from one internal rule, and nothing accredits it

collision: >
  In audit and quality practice a **deviation** is a finding. An auditor records a departure from a procedure
  after it happened, and a departure agreed in advance is called a waiver, an exception or a concession. Here
  the record *is* the agreement, written before the departure, or straight after one an incident left no time
  for.

  A reader arriving from that background will read this folder as a list of findings against the estate, and a
  growing count as the estate getting worse. The count says how much of the estate somebody wrote down. Say
  which sense you mean wherever the word crosses into an audit conversation.

id:
  prefix: dev
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, draft, closed]
    description: Whether the deviation is in force, still being agreed, or closed.
    notes: >
      A deviation whose review date has passed stays `active`. Nothing moves it, and `expiry` warns instead.

  departs-from:
    required: true
    type: list
    of: id
    ref: [policies, standards]
    part-required: true
    allow-literal: [none]
    description: Policy or standard clause ids this departs from, as `pol-TRUS.SCREEN`, or `none`.
    notes: >
      The field takes no `mirrors-citations:`. A deviation states one departure and writes no per-clause
      section, so there is no `Covers` line to check it against. Use `none` for a departure that breaks no
      stated rule, such as technical debt nobody wrote a clause about. `none` is a literal, and nothing looks
      it up.

  accepted-on:
    required: false
    required-when: 'status != draft'
    type: date
    description: The day the named owner accepted the risk.

  review-by:
    required: true
    type: date
    description: The day the deviation is looked at again.

  closed-on:
    required: false
    required-when: 'status == closed'
    type: date
    description: The day the gap was fixed, or the risk knowingly re-accepted.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    allow-literal: [all]
    description: Service ids, or `all`.

sections:
  required: [What we are doing instead, Why we need it, What compensates, How it closes]
  optional: [Scope, Related]

export:
  version: 1
  fields: [id, title, status, departs-from, owner, accepted-on, review-by, closed-on, applies-to, tags]
  sections:
    What we are doing instead: full
    Why we need it: full
    What compensates: full
    How it closes: full
    Scope: full
  notes: >
    `owner` travels here, and this is the only type where it does.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#deviations> says what else travels, and
    what stays behind.
index:
  columns: [id, title, status, departs-from, review-by, owner]
  sort: review-by

rules:
  - id: review-after-acceptance
    description: The review date falls after the day the risk was accepted.
    severity: error
    expr: "present('accepted-on') and present('review-by') implies field('review-by') > field('accepted-on')"
    message: >
      `review-by` falls on or before `accepted-on`, so this deviation expired as it was written. Set
      `review-by` to the day somebody has to look at this again.
  - id: not-open-ended
    description: The record does not claim the departure is permanent or open-ended.
    severity: warning
    expr: >-
      not matches('(?i)\b(permanent(ly)?|indefinite(ly)?|no expiry|until further notice)\b')
    message: >
      this record reads as a standing departure. Say what has to be true for it to close, and put the date
      in `review-by`.
  - id: expiry
    description: An active deviation is still inside its review date.
    # Warning severity, because an error would make deleting the record the cheapest way back to green.
    severity: warning
    expr: >-
      field('status') == 'active' and present('review-by') implies field('review-by') >= today()
    message: >
      this deviation is still active and its `review-by` has passed. Close it, or set a new date and say
      in the record what was re-accepted.
