# yaml-language-server: $schema=./meta/type.schema.json

type: control
label: Control
label-plural: Controls
folder: controls
page: controls.md
tier: normative
lifecycle: living
summary: "How a standard's rules are verified: the mechanism, the frequency, and the evidence it leaves."
goes-here: A check that proves a rule is being followed
detail: >
  Every control lists the rules it verifies. A rule nothing checks gets a control whose mechanism is
  `not-enforced`, so the gap is written down.

lineage:
  prior-art: "[NIST SP 800-53A Rev. 5](https://csrc.nist.gov/pubs/sp/800/53/a/r5/final), the assessment-procedure construct"
  alignment: >
    Objective, method and expected evidence, bound to the requirement it tests
  divergence: >
    800-53A procedures assess a federal catalogue inside an authorisation boundary. A control here verifies an
    internal standard, with no catalogue and no accreditation

collision: >
  In [NIST SP 800-53](https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final), ISO/IEC 27001 Annex A, ISO/IEC
  27002 and ComplianceForge, a *control* **is the safeguard itself**: the technical, administrative or
  physical measure that reduces risk. Here, a control is the **verification that a rule is being followed**,
  which those frameworks call an assessment procedure, a test, or a metric.

  A reader with a governance background will misread this type on sight, and will read a coverage report as a
  claim that safeguards exist. It claims only that checks exist. Say which sense you mean wherever the word
  crosses into a compliance conversation.

id:
  prefix: ctl
  style: numbered
  width: 4

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, planned, retired]
    description: Whether the control is running, intended, or stood down.

  verifies:
    required: true
    type: list
    of: id
    ref: standards
    reciprocal: verified-by
    description: The standard ids this control checks, as rule-level anchors where possible.

  mechanism:
    required: true
    type: enum
    values: [ci, review-checklist, manual-periodic, runtime-alert, not-enforced]
    description: How the check runs, or `not-enforced` where nothing checks the rule.
    notes: >
      The coverage report counts `not-enforced`. Do not invent a mechanism to avoid using it.

  frequency:
    required: false
    required-when: 'mechanism != not-enforced'
    type: enum
    values: [per-pr, per-deploy, daily, monthly, quarterly, annual]
    description: How often it runs.

  evidence:
    required: false
    type: string
    description: 'Where the proof lives: the build log, the audit note, or the dashboard.'

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    allow-literal: [all]
    description: Service ids, or `all`.

sections:
  required: [What it checks, How it works, Coverage and gaps]
  optional: [Evidence, Owner]

export:
  version: 1
  fields: [id, title, status, verifies, mechanism, frequency, evidence, applies-to, tags]
  sections:
    What it checks: full
    How it works: full
    Coverage and gaps: full
  notes: >
    Every section of a control travels, `not-enforced` records included. See
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#controls>.
index:
  columns: [id, title, mechanism, frequency, verifies, status]
  sort: id

rules:
  - id: mechanism-has-evidence
    description: >
      A running control says where its evidence can be found.
    severity: warning
    expr: "field('mechanism') != 'not-enforced' implies present('evidence')"
    message: >
      this control claims to run and does not say where the proof lives. Set `evidence` to the build log,
      the audit note or the dashboard.
  - id: coverage-report
    description: The share of MUST / MUST NOT rules in active standards claimed by an enforced control.
    # Enforced means any mechanism other than `not-enforced`. The figure is generated for the corpus, and no
    # single document fails it.
