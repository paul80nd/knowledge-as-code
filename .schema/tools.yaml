# yaml-language-server: $schema=./meta/type.schema.json

type: tool
label: Tool
label-plural: Tools
folder: tools
page: tools.md
tier: descriptive
lifecycle: living
summary: The approved-software register. What is chosen, rejected or deprecated, and the version range for each.
goes-here: A tool or package approved, rejected, or on trial
detail: >
  Knowing what was turned down, and why, saves the next person the evaluation.

versus:
  adrs: >
    Adopting a tool is often a decision worth an ADR *and* an entry in the register. The ADR records the
    reasoning. The register records the current state and the version range. Small, uncontroversial adoptions
    need only the register.

lineage:
  prior-art: "[Thoughtworks Technology Radar](https://www.thoughtworks.com/radar)"
  alignment: >
    Named technologies sorted by stance, with rejections recorded beside adoptions
  divergence: >
    The Radar is industry opinion, published periodically and explicitly non-binding. This type is an internal
    register with binding version ranges

id:
  prefix: tol
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [approved, trial, deprecated, rejected]
    description: '`approved` applies to new work. Existing use of a tool with any other status is drift.'
    notes: >
      Finding drift is a manual job. `drift-against-manifests` is declared and does not run.

  category:
    type: string
    from: sub-path
    description: The folder the tool is filed under, below `tools/`.
    notes: >
      `from: sub-path` reads the value off the folder, so an author never writes it and it cannot disagree with
      where the file sits. A folder groups the tools somebody comes looking for, such as `testing` or
      `observability`.

  versions:
    required: false
    type: string
    description: The version range approved for new work.
    notes: >
      Nothing checks the form, so a pin passes. Installed versions live in the package manifests across the estate.

  licence:
    required: false
    type: string
    pattern: '^[A-Za-z0-9.\-+ ()]+$'
    description: The licence, as an SPDX identifier.
    notes: The pattern accepts an SPDX expression too, so `Apache-2.0 OR MIT` passes.

  decided-in:
    required: false
    type: id
    ref: adrs
    description: The ADR id recording the decision to adopt this tool.

  replaces:
    required: false
    type: id
    ref: tools
    reciprocal: successor
    description: The tool id this supersedes.

  successor:
    required: false
    type: id
    ref: tools
    reciprocal: replaces
    description: The tool id that replaces this one.
    notes: The reciprocal is checked, so stating `successor` at one end requires `replaces` at the other.

sections:
  required: [What we use it for, Status]
  optional: [Trial criteria, Where it is used, Alternatives considered, Licence and obligations, Related]

export:
  version: 1
  fields: [id, title, status, category, versions, licence, decided-in, replaces, successor, tags]
  sections:
    What we use it for: full
    Status: full
    Licence and obligations: full
    Where it is used: full
  notes: >
    A tool register says what an estate builds on, which is the question an inventory exists to answer.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#tools> says what else travels, and what stays
    behind.
index:
  columns: [id, title, category, status, versions, licence]
  sort: [category, id]

rules:
  - id: deprecated-has-successor
    description: A deprecated tool states what replaces it.
    severity: warning
    expr: "field('status') == 'deprecated' implies present('successor')"
    message: >
      this tool is deprecated and states no successor. Set `successor` to the tool that replaced it, so a reader
      arriving from a manifest has somewhere to go.
  - id: trial-has-criteria
    description: A tool in `trial` states what would end the trial.
    severity: warning
    expr: "field('status') == 'trial' implies section('Trial criteria')"
    message: >
      this tool is in trial and nothing says what would end the trial. Add a `## Trial criteria` section stating
      what is being evaluated, where, and what would settle it.
  - id: drift-against-manifests
    description: Every package in use is in the register, and every approved tool is in use.
    # Runs on a schedule. Reports a package in use that was never approved, and an approved tool nothing uses.
