type: runbook
label: Runbook
label-plural: Runbooks
folder: runbooks
page: runbooks.md
tier: procedural
lifecycle: living
summary: "An incident-time procedure read under pressure: terse, imperative, structured as a decision tree."
goes-here: A step-by-step for when something is broken

id:
  prefix: rbk
  style: slug
  notes: Named for the failure, not the fix — that is what someone searches for at 2am.

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, draft, retired]
    description: Whether the runbook is current, drafted, or stood down.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this runbook covers.

  severity:
    required: false
    type: enum
    values: $enums.severity
    description: The severity this runbook is written for.

  last-rehearsed:
    required: true
    type: date
    allow-literal: [never]
    description: '`"never"` is permitted, and is worth knowing before the incident rather than during it.'
    notes: >
      `"never"` is permitted, and is exactly the thing worth knowing before the incident rather than during it.

  rehearsal-frequency:
    required: false
    type: enum
    values: $enums.rehearsal-frequency
    description: How often it should be exercised.

  requires-access:
    required: false
    type: list
    of: string
    notes: >
      Must be complete. Discovering you lack a permission mid-incident is its own outage.

sections:
  required: [Symptoms, Immediate actions, Diagnosis, Resolution, Escalation]
  optional: [Afterwards, Related]

index:
  columns: [id, title, severity, status, last-rehearsed]
  sort: [severity, id]

rules:
  - id: symptoms-first
    description: Symptoms is the first section after the H1 — that is how the reader finds the document.
    severity: error
    expr: "first_section() == 'Symptoms'"
    message: >
      Symptoms must be the first section. Someone reaching for this at 2am matches on what they are
      seeing, not on what the document is called.
  - id: escalation-required
    description: Every diagnosis branch ends in a resolution or an escalation, never a dead end.
    # `sections` requires the heading; the shape beneath it is what this adds, and only reading the tree finds a dead
    # end.
  - id: staleness-loud
    description: Rehearsal staleness, reported more prominently than a process's.
    # Scheduled. An unrehearsed process is annoying; an unrehearsed runbook is dangerous.
