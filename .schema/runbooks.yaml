# yaml-language-server: $schema=./meta/type.schema.json

type: runbook
label: Runbook
label-plural: Runbooks
folder: runbooks
page: runbooks.md
tier: procedural
lifecycle: living
summary: "An incident-time procedure read under pressure: terse, imperative, structured as a decision tree."
goes-here: A step-by-step for when something is broken
detail: >
  Disaster recovery and estate rebuild are runbooks.

lineage:
  prior-art: >-
    [Google SRE, *Introduction*](https://sre.google/sre-book/introduction/): the playbook.
    [Google SRE Workbook, *On-Call*](https://sre.google/workbook/on-call/): what a playbook explains.
    [AWS Well-Architected OPS07-BP03](https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/ops_ready_to_support_use_runbooks.html):
    the runbook that achieves an outcome, and
    [OPS07-BP04](https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/ops_ready_to_support_use_playbooks.html):
    the playbook that investigates an issue
  alignment: >
    The response written down before the incident. Google measures roughly a threefold improvement in mean time to
    recovery over improvising it. The workbook asks a playbook to explain an alert's severity and impact, which
    `severity` and `Impact` state. AWS asks for step-by-step discovery, and for the tools and permissions to start:
    `Diagnosis`, `requires-tools` and `requires-access`. It asks for a route out where nobody finds the cause, and a
    plan for telling the people waiting: `Escalation` and `Communication`
  divergence: >
    Google specifies no form. This type mandates one: terse, imperative, structured as a decision tree, opening on
    `Symptoms`. AWS writes two documents, a playbook to find the cause and a runbook to resolve it. This type is both
    on one page, because a reader at 2am opens one document. The workbook and AWS each send a deterministic list of
    commands to automation, and this type stays a document. Asking every runbook for a rehearsal date is this
    framework's own, and no source states it

collision: >
  The industry does not agree on *runbook* and *playbook*. Google's SRE material says *playbook* for investigating a
  failure and for resolving it. AWS splits the two: a runbook achieves a known outcome, and a playbook investigates an
  issue. This framework says *runbook* for the incident-time document and *process* for the planned one. *Playbook*
  also means an executable artefact in configuration-management tooling, and a word meaning both a document and a
  program gets misread in a repository holding both.

id:
  prefix: rbk
  style: slug
  notes: Named for the failure a reader is seeing, which is what somebody searches for.

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, draft, retired]
    description: Whether the runbook is current, drafted, or stood down.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this runbook covers.

  severity:
    required: true
    type: enum
    values: $enums.severity
    description: The severity this runbook is written for.
    notes: >
      `severity` says how urgent, and `Impact` says who is affected. A reader deciding whether to wake somebody
      needs both.

  last-rehearsed:
    required: true
    type: date
    allow-literal: [never]
    description: Quoted. The day somebody last followed the runbook end to end, or `"never"`.
    notes: >
      Editing the page does not move this date. A runbook showing `"never"` is worth finding before the
      incident, while there is still time to rehearse it.

  rehearsal-frequency:
    required: true
    type: enum
    values: $enums.rehearsal-frequency
    description: How often, or on what event, to rehearse the runbook.

  requires-tools:
    required: false
    type: list
    of: string
    description: The tools the reader needs installed before starting.
    notes: >
      Separate from `requires-access`. A tool is something you install, and a permission is something somebody
      grants you.

  requires-access:
    required: false
    type: list
    of: string
    description: The permissions or roles the reader needs before starting.
    notes: List every one. A permission found missing mid-incident extends the outage.

# `Impact` follows `Symptoms`, so a reader learns whether this is their failure and then how bad it is.
# `Communication` follows `Escalation`, because waking somebody and telling everybody else are one moment.
sections:
  required: [Symptoms, Impact, Immediate actions, Diagnosis, Resolution, Escalation, Communication]
  optional: [Afterwards, Related]

export:
  version: 2
  fields:
    [id, title, status, severity, applies-to, last-rehearsed, rehearsal-frequency, requires-tools, requires-access,
     tags]
  sections:
    Symptoms: full
    Impact: full
  notes: >
    The steps are left out on purpose.
    See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#runbooks>.
index:
  columns: [id, title, severity, status, last-rehearsed]
  sort: [severity, id]

rules:
  - id: symptoms-first
    description: Symptoms is the first section after the H1.
    severity: error
    expr: "first_section() == 'Symptoms'"
    message: >
      the first section here is not `Symptoms`. Move `## Symptoms` above the others, so a reader who arrives
      with a symptom finds it first.
  - id: escalation-required
    description: Every diagnosis branch ends in a resolution or an escalation.
    # `sections` requires the heading. This rule checks the branches under it.
  - id: staleness-loud
    description: Rehearsal staleness, reported more loudly than a process's.
    # Scheduled. An unrehearsed runbook is followed during an incident.
