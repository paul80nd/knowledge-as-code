# yaml-language-server: $schema=./meta/type.schema.json

type: adr
label: ADR
label-plural: ADRs
folder: adrs
page: adrs.md
tier: decided
lifecycle: immutable
summary: An architecturally significant decision affecting more than one repository, and the reasoning behind it.
goes-here: A decision that affects more than one repo, and its reasoning
detail: >
  The context, the choice, the alternatives weighed, the consequences. Immutable once accepted and superseded by
  a new ADR rather than rewritten. A decision local to a single repository belongs in the repo that holds it,
  not here.

versus:
  standards: >
    The ADR is the decision and its reasoning, frozen. The standard is the rule that results, kept current. If
    you are writing "we considered X and rejected it", that is an ADR. If you are writing "you **MUST** do Y",
    that is a standard. Most substantial changes produce both.

lineage:
  prior-art: "[Nygard, *Documenting Architecture Decisions*](https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions) (2011)"
  alignment: >
    Context / Decision / Consequences, and the rule that a reversed decision is superseded rather than rewritten
  divergence: >
    Nygard scopes decisions to one codebase. Ours must affect more than one repository. Mandatory *Alternatives*
    is ours, not his

id:
  prefix: adr
  style: numbered
  width: 4

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [proposed, accepted, deprecated, superseded]
    description: Immutable once `accepted`. Supersede rather than rewrite.

  decided-on:
    required: false
    required-when: 'status == accepted'
    type: date
    notes: The acceptance date. Bare key until accepted.

  supersedes:
    required: false
    type: id
    ref: adrs
    reciprocal: superseded-by
    notes: The ADR this replaces.

  superseded-by:
    required: false
    required-when: 'status == superseded'
    type: id
    ref: adrs
    reciprocal: supersedes
    notes: CI reconciles both directions, so a one-sided supersession fails the build.

  deciders:
    required: false
    type: list
    of: string
    pattern: '^human:[a-z0-9.-]+$'
    description: The people who agreed it, each as `human:alex.doe`.
    notes: >
      A post cannot agree a decision, so `role:` is refused here. The people in the room agreed it, and
      they stay named after any of them moves on.

  related:
    required: false
    type: list
    of: id
    ref: adrs
    mirrors-section: Related
    notes: >
      Must match the ids named in the `## Related` section. CI reconciles the two, case-insensitively.

sections:
  required: [Context, Decision, Alternatives Considered, Consequences]
  optional: [Related, References]

export:
  version: 1
  fields: [id, title, status, decided-on, supersedes, superseded-by, related, tags]
  sections:
    Context: summary
    Decision: full
    Consequences: full
  notes: >
    A standard cites the decision its authority comes from, and `derived-from` resolves only where the
    ADR travelled too. So a consumer inheriting a rule can read what was decided behind it.

    `Decision` travels whole, because the decision sentence is the record. `Consequences` travels whole
    beside it: a consumer reading what a decision bought and not what it cost reads a better decision
    than the one we took. `Context` travels as its opening paragraph, which is where an ADR says what
    problem it was answering.

    `Alternatives Considered` stays behind. It is the longest section an ADR holds, it argues against
    options this estate weighed, and the record is a fetch away for a reader who wants the weighing.

    `supersedes` and `superseded-by` travel together. A superseded decision still binds whatever was
    built under it, so a consumer meeting one needs the id that replaced it.

    `deciders` and `owner` stay behind. Both name people, and whoever holds a vendored copy has no
    standing to ask them anything.

index:
  columns: [id, title, status, decided-on]
  sort: id

rules:
  - id: immutable-after-accepted
    description: Once status is `accepted`, only typo fixes, link corrections and status transitions are allowed.
    # A substantive edit fails with a pointer to the supersession process.
  - id: y-statement-present
    description: A block-quote below the H1 states all six Y-statement moves, within `max-words`.
    # The six: in the context of / facing / we decided / rather than / to achieve / accepting. Naming the absent one is
    # what needs code rather than an expression.
    max-words: 60
    severity: warning
  - id: alternatives-have-verdicts
    description: Every bullet in Alternatives Considered states an outcome.
    # An alternative left open means the decision has not been made.
    severity: warning
