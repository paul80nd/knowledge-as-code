# yaml-language-server: $schema=./meta/type.schema.json

type: adr
label: ADR
label-plural: ADRs
folder: adrs
page: adrs.md
tier: decided
lifecycle: immutable
summary: An architecturally significant decision affecting more than one repository, and the reasoning behind it.
goes-here: A decision affecting more than one repository, and its reasoning
detail: >
  The context, the choice, the alternatives weighed, and the consequences. An accepted ADR is immutable, so a
  later ADR supersedes it. A decision that affects only one repository belongs in that repository.

versus:
  standards: >
    An ADR is the decision and its reasoning, frozen. A standard is the rule that follows, kept current.
    Recording that an option was weighed and turned down is an ADR. Recording "you **MUST** do Y" is a
    standard. Most substantial changes produce an ADR and a standard.

lineage:
  prior-art: >
    [Nygard, *Documenting Architecture
    Decisions*](https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions) (2011), the ADR as a short
    record of one decision and what followed from it. [Zimmermann's
    Y-statement](https://ozimmer.ch/practices/2020/04/27/ArchitectureDecisionMaking.html), a decision written as one
    sentence in six moves
  alignment: >
    Nygard's Context / Decision / Consequences, his four status values, and the rule that a reversed decision is
    superseded and left standing. The block-quote under the title states Zimmermann's six moves. A mandatory
    *Alternatives Considered* section matches [MADR 4](https://adr.github.io/madr/), which also asks for the options
    weighed
  divergence: >
    Nygard scopes a decision to one codebase. An ADR here affects more than one repository. Every alternative states a
    verdict, and *Consequences* is required where MADR leaves it optional. A fifth status, `rejected`, keeps a
    proposal the team turned down. A supersession is a pair of fields checked both ways, not a phrase inside the
    status. MADR's *Confirmation* is a separate type here: a standard cites the ADR it distils, and a control checks
    the standard. MADR's `consulted` and `informed` are not kept
id:
  prefix: adr
  style: numbered
  width: 4

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [proposed, rejected, accepted, deprecated, superseded]
    description: Where the decision stands.
    notes: >
      The other four values are Nygard's, and the order is the one MADR 4 lists.

  decided-on:
    required: false
    required-when: 'status in [accepted, rejected]'
    type: date
    description: The day the decision was settled.

  supersedes:
    required: false
    type: id
    ref: adrs
    reciprocal: superseded-by
    description: The ADR this one replaces.

  superseded-by:
    required: false
    required-when: 'status == superseded'
    type: id
    ref: adrs
    reciprocal: supersedes
    description: The ADR that replaces this one.

  deciders:
    required: false
    type: list
    of: string
    pattern: '^human:[a-z0-9.-]+$'
    description: The people who agreed it, each as `human:alex.doe`.
    notes: >
      A role cannot agree a decision, so a `role:` identifier is refused here. A person who agreed it stays
      named after they move on.

  related:
    required: false
    type: list
    of: id
    ref: adrs
    mirrors-section: Related
    description: Other ADRs worth reading beside this one, matching the `## Related` section.
    notes: The match against the section is case-insensitive.

sections:
  required: [Context, Decision, Alternatives Considered, Consequences]
  optional: [Related, References]

export:
  version: 1
  fields: [id, title, status, decided-on, supersedes, superseded-by, related, tags]
  sections:
    Context: summary
    Decision: full
    Consequences: full
  notes: >
    `Context` travels as its opening paragraph, where an ADR states the problem it answered.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#adrs> says what else travels, and what
    stays behind.
index:
  columns: [id, title, status, decided-on]
  sort: id

rules:
  - id: immutable-after-accepted
    description: >
      Once status is `accepted` or `rejected`, the decision changes only by a superseding ADR, never by an
      edit in place.
    # Declared and not running. Telling a changed decision from a correction needs the git history `kac` does not read.
  - id: y-statement-present
    description: A block-quote below the H1 states all six Y-statement moves, within `max-words`.
    # The six moves: in the context of / facing / we decided / rather than / to achieve / accepting.
    max-words: 60
    severity: warning
  - id: alternatives-have-verdicts
    description: Every bullet in Alternatives Considered states an outcome.
    # An alternative left open means the decision has not been made.
    severity: warning
