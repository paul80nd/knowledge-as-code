type: nfr
label: NFR
label-plural: NFRs
folder: nfrs
page: nfrs.md
tier: normative
lifecycle: living
summary: A non-functional requirement — availability, latency, RPO, RTO — stated with how it is measured.
goes-here: A target for speed, uptime, or recovery
detail: >
  Capacity assumptions belong here too. An NFR with no measurement method is an aspiration, not a requirement.

lineage:
  prior-art: "[ISO/IEC 25010:2023](https://www.iso.org/standard/78176.html) product quality model"
  alignment: >
    Quality characteristics that exist to be specified, measured and evaluated — the measurement obligation is
    25010's premise
  divergence: >
    25010 is a taxonomy of characteristics, not a document type. RPO and RTO come from continuity practice, and
    per-service budgets from SLO practice

id:
  prefix: nfr
  style: numbered
  width: 4

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [draft, agreed, retired]
    description: '`agreed` is a commitment someone accepted, not an aspiration.'
    notes: >
      `agreed` is a commitment someone has actually accepted, not an aspiration. Stay in `draft` until then.

  applies-to:
    required: true
    type: list
    of: id
    ref: [services, capabilities]
    description: Estate-wide targets are almost always wrong — scope them.
    notes: >
      Estate-wide targets are almost always wrong — a marketing page and the booking flow do not deserve the
      same budget.

  target:
    required: true
    type: string
    notes: Concrete and arguable — `99.5% monthly`, `p95 < 400ms`, `RTO 4h`. Include the measurement window.

  measured-by:
    required: true
    type: string
    notes: >
      An NFR you cannot measure is a wish. "We'd notice" is not a measurement method.

  constrained-by:
    required: false
    type: list
    of: id
    ref: integrations
    description: Integrations whose own SLA caps this target.
    notes: >
      External dependencies whose own SLA caps this target. A target exceeding what a dependency promises is
      a hope, not a commitment.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone confirms this is still true.

sections:
  required: [Target, How it is measured, If it is breached]
  optional: [Current actual, Constraints, Related]

index:
  columns: [id, title, applies-to, target, status, review-by]
  sort: id

rules:
  - id: target-is-measurable
    description: '`measured-by` names an instrument, not a hedge — "monitored", "as needed", "where practical".'
    severity: warning
    expr: >-
      not field_matches('measured-by',
      '(?i)\b(monitored|manually|as needed|as required|where practical|where possible|if possible|ad hoc|periodically)\b')
    message: >
      `measured-by` hedges rather than measures. Name the instrument and the number it reports — an NFR
      measured "where practical" is one nobody has to meet.
  - id: constraint-consistency
    description: >
      Where `constrained-by` names an integration whose `their-sla` is weaker than this target, report it.
