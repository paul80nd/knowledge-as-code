# yaml-language-server: $schema=./meta/type.schema.json

type: nfr
label: NFR
label-plural: NFRs
folder: nfrs
page: nfrs.md
tier: normative
lifecycle: living
summary: A non-functional requirement (availability, latency, RPO, RTO) stated with how it is measured.
goes-here: A target for speed, uptime, or recovery
detail: >
  Capacity assumptions belong here too. A target nobody measures is an aspiration.

lineage:
  prior-art: "[ISO/IEC 25010:2023](https://www.iso.org/standard/78176.html) product quality model"
  alignment: >
    Quality characteristics written so that each one can be specified, measured and evaluated
  divergence: >
    25010 lists the characteristics and stops. This type is a document. RPO and RTO come from continuity practice,
    and per-service budgets from SLO practice

id:
  prefix: nfr
  style: numbered
  width: 4

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [draft, agreed, retired]
    description: '`agreed` means somebody accepted the commitment.'
    notes: Nothing checks the move out of `draft`. An author sets `agreed` once somebody has accepted the number.

  applies-to:
    required: true
    type: list
    of: id
    ref: [services, capabilities]
    description: The service or capability ids this target binds.
    notes: >
      A target listing every service must meet the strictest case among them. Write a second NFR where one service
      needs a stricter number than the rest.

  target:
    required: true
    type: string
    description: 'The number this commits to, with its measurement window: `99.5% monthly`, `p95 < 400ms`.'

  measured-by:
    required: true
    type: string
    description: The instrument that reports the number, and where to read it.

  constrained-by:
    required: false
    type: list
    of: id
    ref: integrations
    description: Integrations whose own SLA caps this target.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone confirms this is still true.

sections:
  required: [Target, How it is measured, If it is breached]
  optional: [Current actual, Constraints, Related]

export:
  version: 1
  fields: [id, title, status, applies-to, target, measured-by, constrained-by, review-by, tags]
  sections:
    Target: full
    How it is measured: full
    If it is breached: full
    Constraints: full
  notes: >
    An NFR is normative, and a reader may act on it without opening anything else.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#nfrs> says what else travels, and what stays
    behind.
index:
  columns: [id, title, applies-to, target, status, review-by]
  sort: id

rules:
  - id: target-is-measurable
    description: '`measured-by` states an instrument. A hedge such as "monitored" or "where practical" fails.'
    severity: warning
    expr: >-
      not field_matches('measured-by',
      '(?i)\b(monitored|manually|as needed|as required|where practical|where possible|if possible|ad hoc|periodically)\b')
    message: >
      `measured-by` is hedged. Write the dashboard, query or report that gives the number.
  - id: constraint-consistency
    description: >
      Every integration in `constrained-by` states a `their-sla` at least as strong as this target.
