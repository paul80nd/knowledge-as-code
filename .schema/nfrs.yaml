# yaml-language-server: $schema=./meta/type.schema.json

type: nfr
label: NFR
label-plural: NFRs
folder: nfrs
page: nfrs.md
tier: normative
lifecycle: living
summary: A non-functional requirement (availability, latency, RPO, RTO) stated with how it is measured.
goes-here: A target for speed, uptime, or recovery
detail: >
  Capacity assumptions belong here too. A target nobody measures is an aspiration.

lineage:
  prior-art: >-
    [ISO/IEC 25010:2023](https://www.iso.org/standard/78176.html): the product quality model.
    [Google SRE, *Implementing SLOs*](https://sre.google/workbook/implementing-slos/): the service level objective
  alignment: >
    25010 splits quality into characteristics that can each be specified and measured, and `characteristic` states
    which one a target commits to. The SRE workbook asks an SLO document for the indicator reporting the objective,
    the day somebody approved it, the day it is next reviewed, and the reasoning behind the number: `measured-by`,
    `agreed-on`, `review-by` and `Why this number`. The workbook gives the time window a section of its own, and
    `window` is where a target states it
  divergence: >
    25010 lists the characteristics and stops. This type is a document, and `characteristic` takes 25010's
    subcharacteristic level, because an estate commits to availability and recovery and not to reliability. RPO and
    RTO come from continuity practice. The SRE workbook turns a target into an error budget a team spends. An error
    budget policy then says what to stop once the budget runs out. Here a target is a commitment with a named
    consequence, and no record does that arithmetic

id:
  prefix: nfr
  style: numbered
  width: 4

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [draft, agreed, retired]
    description: '`agreed` means somebody accepted the commitment.'
    notes: >
      `owner` names who accepted the number. Nothing checks that the owner named today is the person who did.

  characteristic:
    required: true
    type: enum
    values: [accuracy, availability, capacity, latency, recovery, scalability, throughput]
    description: The quality of service this target commits to.
    notes: >
      The values sit at ISO/IEC 25010's subcharacteristic level. `availability`, `capacity` and `scalability` are
      25010's own names, `recovery` is its recoverability, `latency` and `throughput` divide its time behaviour,
      and `accuracy` is its functional correctness.

  applies-to:
    required: true
    type: list
    of: id
    ref: [services, offerings]
    reciprocal: nfrs
    description: The service or offering ids this target binds.
    notes: >
      A target listing every service must meet the strictest case among them. Write a second NFR where one service
      needs a stricter number than the rest. A wait a customer feels binds an offering, and a property of one
      deployment binds a service. Both ends state the edge, so a record named here lists this NFR back.

  target:
    required: true
    type: string
    description: 'The number this commits to: `99.5%`, `p95 under 400ms`, `RPO 5 minutes`.'

  window:
    required: false
    required-when: 'characteristic in [availability, capacity, latency, throughput]'
    type: string
    description: 'The period the number is read over: `rolling 1 hour`, `monthly`, `rolling 4 weeks`.'
    notes: >
      The four characteristics `required-when` names are the ones that state a rate or a percentile. A recovery,
      scalability or accuracy target binds each event or each value.

  measured-by:
    required: true
    type: string
    description: The instrument that reports the number, and where to read it.

  constrained-by:
    required: false
    type: list
    of: id
    ref: integrations
    description: Integrations whose own SLA caps this target.

  agreed-on:
    required: false
    required-when: 'status == agreed'
    type: date
    description: The day the named owner accepted the commitment.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone confirms this is still true.

sections:
  required: [Target, Why this number, How it is measured, If it is breached]
  optional: [Current actual, Constraints, Related]

export:
  version: 2
  fields: [id, title, status, characteristic, applies-to, target, window, measured-by, constrained-by, agreed-on,
           review-by, tags]
  sections:
    Target: full
    Why this number: full
    How it is measured: full
    If it is breached: full
    Constraints: full
  notes: >
    An NFR is normative, and a reader may act on it without opening anything else.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#nfrs> says what else travels, and what stays
    behind.
index:
  columns: [id, title, characteristic, applies-to, target, status, review-by]
  sort: id

rules:
  - id: target-is-measurable
    description: '`measured-by` states an instrument. A hedge such as "monitored" or "where practical" fails.'
    severity: warning
    expr: >-
      not field_matches('measured-by',
      '(?i)\b(monitored|manually|as needed|as required|where practical|where possible|if possible|ad hoc|periodically)\b')
    message: >
      `measured-by` is hedged. Write the dashboard, query or report that gives the number.
  - id: constraint-consistency
    description: >
      Every integration in `constrained-by` states a `their-sla` at least as strong as this target.
