# yaml-language-server: $schema=./meta/type.schema.json

type: integration
label: Integration
label-plural: Integrations
folder: integrations
page: integrations.md
tier: descriptive
lifecycle: living
summary: "An external system the estate depends on: its contract, auth, failure modes, SLA and fallback."
goes-here: A third-party or external system the estate depends on
detail: >
  One document per external system. It records the contract, how a caller authenticates, what happens when the
  system is down, and who to call about it.

lineage:
  prior-art: >-
    [Nygard, *Release It!* (2nd ed.)](https://pragprog.com/titles/mnee2/release-it-second-edition/): integration
    points. [DORA](https://eur-lex.europa.eu/eli/reg/2022/2554/oj), Articles 28 and 30: the register of ICT
    third-party arrangements
  alignment: >
    Every integration point needs a deliberate failure mode and a fallback, so the type requires both. DORA Article
    30(2) asks a vendor contract for a description of the service, a service level and a notice period: `What it
    does`, `their-sla` and `Commercials`. `Exit` and `successor` answer Article 30(3)(f), on moving to another
    supplier. `criticality` grades an integration the way Article 28(3) separates a critical or important function
    from the rest
  divergence: >
    *Release It!* is a pattern book. Its remedies are timeouts and circuit breakers, which a service implements
    and a vendor record does not state. DORA's register is a supervisory return of machine-readable fields, and
    this is a document somebody reads. Article 30(2)(b) and (c) put data location and personal data in the
    vendor contract. Here `data` states them, through `region`, `personal-data` and `flows-to`, so an
    integration record has neither

id:
  prefix: itg
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, trial, retired]
    description: Whether the integration is active, on trial, or retired.

  vendor:
    required: true
    type: string
    description: Who supplies the system.

  used-by:
    required: true
    type: list
    of: id
    ref: services
    description: Ids of the services that call this integration.
    notes: An integration no service uses is a candidate for retirement, so the field is required.

  criticality:
    required: true
    type: enum
    values: $enums.criticality
    description: The impact on a customer when the integration is unavailable.

  their-sla:
    required: false
    type: string
    description: What the vendor's contract promises, in the contract's own words.
    notes: >
      `constraint-consistency` on `nfrs` compares this value against an NFR target, so quote the contract
      itself.

  replaces:
    required: false
    type: id
    ref: integrations
    reciprocal: successor
    description: The integration id this one took over from.

  successor:
    required: false
    type: id
    ref: integrations
    reciprocal: replaces
    description: The integration id that took over from this one.
    notes: The reciprocal is checked, so stating `successor` at one end requires `replaces` at the other.

sections:
  required: [What it does, Contract, Failure modes]
  optional: [Trial criteria, Their SLA, Exit, Commercials, Contacts, Related]

export:
  version: 2
  fields: [id, title, status, vendor, used-by, criticality, their-sla, replaces, successor, tags]
  sections:
    What it does: full
    Failure modes: full
    Exit: full
  notes: >
    The sections left behind describe owning the account, which is the estate's own business and not a
    consumer's. See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#integrations>.

index:
  columns: [id, title, vendor, criticality, their-sla, status]
  sort: id

rules:
  - id: retired-has-successor
    description: A retired integration states what took over from it.
    severity: warning
    expr: "field('status') == 'retired' implies present('successor')"
    message: >
      this integration is retired and names no successor. Set `successor` to the integration that took the
      traffic, so a reader arriving from an old citation has somewhere to go.
  - id: trial-criteria-required
    description: An integration on trial states what would end the trial.
    severity: warning
    expr: "field('status') == 'trial' implies section('Trial criteria')"
    message: >
      this integration is on trial and nothing says what would end the trial. Add a `## Trial criteria`
      section stating what is being evaluated and what would settle it.
  - id: exit-required
    description: A critical or important integration still in use states how the estate would leave it.
    severity: warning
    # `retired` is excluded because leaving is already done, and `supporting` because nothing a customer
    # feels depends on it.
    expr: "field('status') != 'retired' and field('criticality') != 'supporting' implies section('Exit')"
    message: >
      this integration is critical or important and nothing says how the estate would leave it. Add an
      `## Exit` section stating what would have to move, and what would make the move hard.
  - id: fallback-required
    description: The Failure modes section mentions a fallback somewhere, or says there is none.
    severity: warning
    # A section-wide match, so this catches a document with no fallback anywhere in it.
    expr: "section_matches('Failure modes', '(?i)fallback')"
    message: >
      the Failure modes section gives no fallback. Say what happens when this integration fails, or say
      plainly that nothing does.
  - id: no-credentials
    description: Nothing reads as a token, key, password or connection string.
    severity: error
    # The pattern needs an assignment, so a document may discuss a password without quoting its value.
    expr: >-
      not matches('(?i)(password|passwd|secret|api[_-]?key|access[_-]?key|token)\s*[:=]\s*["'']?[A-Za-z0-9/+_.-]{8,}')
    message: >
      this looks like a real credential. Write the mechanism and where the value is kept, never the value
      itself.
