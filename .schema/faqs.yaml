# yaml-language-server: $schema=./meta/type.schema.json

type: faq
label: FAQ
label-plural: FAQs
folder: faqs
page: faqs.md
tier: normative
lifecycle: living
summary: A problem with a confirmed fix, promoted from a discovery once a human has verified it.
goes-here: A problem with a known, confirmed fix
detail: >
  It carries provenance back to the observation it came from, so the reader can see how far the fix has been
  taken on trust.

lineage:
  prior-art: "ITIL Problem Management, the *known error* construct"
  alignment: >
    A problem whose cause is understood and whose fix is documented, and the observed → analysed → promoted lifecycle
  divergence: >
    ITIL binds a known error to a formal problem record and an owning practice. Ours is promoted by any human
    verification, from anything noticed

id:
  prefix: faq
  style: numbered
  width: 4

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the symptom, not the cause. That is what people search for.

fields:

  status:
    required: true
    type: enum
    values: [active, superseded, fixed-upstream]
    description: '`fixed-upstream` means the cause is gone. The entry stays for whoever searches for it.'

  symptom-keywords:
    required: true
    type: list
    of: string
    min-items: 3
    description: 'Over-fill it: error text, service names, and what someone types before they know the cause.'
    notes: This is the field that makes the document findable.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this answer concerns.

  promoted-from:
    required: false
    type: id
    ref: discoveries
    reciprocal: promoted-to
    description: The discovery this was promoted from.

  confirmed:
    required: true
    type: list
    of: object
    entry:
      at:
        required: true
        type: timestamp
        description: The moment of the confirmation, in UTC as `2026-09-07T20:18:00Z`.
      by:
        required: true
        type: string
        pattern: '^human:[a-z0-9.-]+$'
        description: The person who confirmed it, as `human:alex.doe`.
    description: Every confirmation this answer has had, oldest first, one line each.
    notes: >
      An FAQ nobody confirmed is a discovery, and this field is what separates the two tiers. The list
      keeps every confirmation the answer has had, so a reader sees when it was last checked, by whom,
      and who checked it before that. One confirmation is one entry, so the moment and the person are
      edited together.

      `at` leads the entry because the list sorts on its first key and an index column renders it. A
      confirmation history then reads oldest first, and the index carries the moment.

      `by` refuses an agent, a session id and a team alias, because none of them can be asked what they
      checked. It refuses `role:` as well: a post cannot read an answer, and the person who did read it
      stays named after the post changes hands.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone confirms this is still true.

sections:
  required: [Symptom, Cause, Fix]
  optional: [Why it happens, How we found it, Related]

index:
  columns: [id, title, applies-to, status, confirmed]
  sort: id

rules:
  - id: one-problem-per-document
    description: One Symptom section, because an FAQ is found by its symptom.
    severity: warning
    expr: "section_count('Symptom') <= 1"
    message: >
      This carries more than one Symptom section, so it is more than one FAQ. Someone arriving with a
      symptom matches on the first one and never reads the second. Split it.
