type: faq
label: FAQ
folder: faqs
page: faqs.md
tier: normative
lifecycle: living

id:
  prefix: faq
  style: numbered
  width: 4

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the symptom, not the cause — that is what people search for.

fields:

  status:
    required: true
    type: enum
    values: [active, superseded, fixed-upstream]
    description: '`fixed-upstream` means the cause is gone; the entry stays for whoever searches for it.'

  symptom-keywords:
    required: true
    type: list
    of: string
    min-items: 3
    description: 'Over-fill it: error text, service names, and what someone types before they know the cause.'
    notes: >
      Be generous — the literal error text, the service names, and the words someone would type who does not
      yet know what is wrong. This is the field that makes the document findable, so over-fill it.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this answer concerns.

  promoted-from:
    required: false
    type: id
    ref: discoveries
    reciprocal: promoted-to
    description: The discovery this was promoted from.

  confirmed-by:
    required: true
    type: string
    notes: >
      A named human. An FAQ nobody confirmed is a discovery — this field is what separates the two tiers.

  confirmed-on:
    required: true
    type: date
    description: Quoted. When a human last confirmed the answer still holds.

  review-by:
    required: true
    type: date
    description: Quoted. Drives the staleness report.

sections:
  required: [Symptom, Cause, Fix]
  optional: [Why it happens, How we found it, Related]

index:
  columns: [id, title, applies-to, status, confirmed-on]
  sort: id

rules:
  - id: one-problem-per-document
    description: One Symptom section, because an FAQ is found by its symptom.
    severity: warning
    expr: "section_count('Symptom') <= 1"
    message: >
      This carries more than one Symptom section, so it is more than one FAQ. Someone arriving with a
      symptom matches on the first one and never reads the second — split it.
  - id: human-confirmed
    description: >
      `confirmed-by` must be present and must not be an agent, a session id or a team alias.
