# yaml-language-server: $schema=./meta/type.schema.json

type: process
label: Process
label-plural: Processes
folder: processes
page: processes.md
tier: procedural
lifecycle: living
summary: A planned procedure (releasing, onboarding, provisioning, rotating a secret).
goes-here: A step-by-step for a planned task
detail: >
  Write each one for somebody who has not done it before.

versus:
  runbooks: >
    Are you doing this because you planned to, or because something is broken? Planned is a process. Broken is a
    runbook.

lineage:
  prior-art: "[ComplianceForge HCGF](https://complianceforge.com/start-here/governance-risk-compliance-grc-content/hierarchical-cybersecurity-governance-framework), Procedure layer, and [Diátaxis how-to guide](https://diataxis.fr/how-to-guides/)"
  alignment: >
    Steps that operationalise the standard above them
  divergence: >
    Splitting the procedural layer by reading conditions is this framework's own.
    See [What has no precedent](https://paul80nd.github.io/knowledge-as-code/framework/lineage/#what-has-no-precedent)

id:
  prefix: prc
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, draft, retired]
    description: Whether the process is current, drafted, or stood down.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this process concerns.

  last-rehearsed:
    required: true
    type: date
    allow-literal: [never]
    description: Quoted. The day somebody last followed the process end to end, or `"never"`.
    notes: >
      Editing the page does not move this date. Where nobody has followed the process end to end, `"never"` is
      better than a guess.

  rehearsal-frequency:
    required: false
    type: enum
    values: $enums.rehearsal-frequency
    description: How often to rehearse the process.

  requires-access:
    required: false
    type: list
    of: string
    description: The systems or roles the reader needs before step 1.

sections:
  required: [When to use this, Prerequisites, Steps, Verification]
  optional: [If it goes wrong, Related]

export:
  version: 1
  fields: [id, title, status, applies-to, last-rehearsed, rehearsal-frequency, tags]
  sections:
    When to use this: full
    Prerequisites: full
  notes: >
    The steps are left out on purpose.
    See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#processes>.
index:
  columns: [id, title, status, last-rehearsed, owner]
  sort: id

rules:
  - id: staleness
    description: >
      Scheduled. Reports a process past its rehearsal frequency, or one whose `last-rehearsed` is `never`.
  - id: no-hedged-ordering
    description: No step hedged with "typically", "usually" or "normally".
    severity: warning
    expr: >-
      not section_matches('Steps', '(?i)\b(typically|usually|normally)\b')
    message: >
      a step hedged with "typically", "usually" or "normally" leaves the reader to decide. Say what the
      ordering depends on, or state it plainly.
