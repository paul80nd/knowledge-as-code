# yaml-language-server: $schema=./meta/type.schema.json

type: process
label: Process
label-plural: Processes
folder: processes
page: processes.md
tier: procedural
lifecycle: living
summary: A planned procedure (releasing, onboarding, provisioning, rotating a secret).
goes-here: A step-by-step for a planned task
detail: >
  Write each one for somebody who has not done it before.

versus:
  runbooks: >
    Are you doing this because you planned to, or because something is broken? Planned is a process. Broken is a
    runbook.

lineage:
  prior-art: >
    [ComplianceForge
    HCGF](https://complianceforge.com/start-here/governance-risk-compliance-grc-content/hierarchical-cybersecurity-governance-framework),
    Procedure layer. [Diátaxis how-to guide](https://diataxis.fr/how-to-guides/), the shape of a task document. [EPA
    QA/G-6](https://www.epa.gov/sites/default/files/2015-06/documents/g6-final.pdf), the elements of a written
    procedure
  alignment: >
    Steps that operationalise the standard above them. From Diátaxis, the shape: `Steps` is one sequence,
    `Prerequisites` states what the reader needs before the first of them, and `When to use this` names the problem
    that sequence solves. EPA QA/G-6 asks for a check before the work is accepted, and for a troubleshooting step:
    `Verification` and `If it goes wrong`. It states a review frequency and a date on the procedure, as
    `rehearsal-frequency` and `last-rehearsed`. It takes a procedure out of use once nobody follows it, as
    `status: retired`
  divergence: >
    Diátaxis writes for the already-competent reader. This type writes for one who has never done the task, and EPA
    QA/G-6 for one who has a basic understanding of the field. EPA QA/G-6 asks a procedure to state that experience.
    `Prerequisites` states it in prose, and no field records it. That reader is as often an agent with no memory of the
    last run. Splitting the procedural layer by reading conditions is this framework's own. EPA QA/G-6 dates a document
    review, and tests a draft once before release. `last-rehearsed` dates one walk-through, and its frequency repeats
    it. EPA QA/G-6 also prints a revision number on every page, where git keeps the history. It has a supervisor and a
    quality assurance officer sign a procedure before use, where `owner` names the person accountable and no field
    records an approval date.
    See [What has no precedent](https://paul80nd.github.io/knowledge-as-code/framework/lineage/#what-has-no-precedent)

collision: >
  ITIL and BPMN use *process* for a chain of activities across an organisation. Both reserve *procedure* for the
  document that says how one is carried out. ComplianceForge HCGF names its layer Procedures on the same reading.
  Here a process is that document. A reader arriving from any of them will look for the wider thing and find one
  procedure.

id:
  prefix: prc
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, draft, retired]
    description: Whether the process is current, drafted, or stood down.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this process concerns.

  last-rehearsed:
    required: true
    type: date
    allow-literal: [never]
    description: Quoted. The day somebody last followed the process end to end, or `"never"`.
    notes: >
      Editing the page does not move this date. Where nobody has followed the process end to end, `"never"` is
      better than a guess.

  rehearsal-frequency:
    required: true
    type: enum
    values: $enums.rehearsal-frequency
    description: How often, or on what event, to rehearse the process.

  requires-access:
    required: false
    type: list
    of: string
    description: The systems or roles the reader needs before step 1.

sections:
  required: [When to use this, Prerequisites, Steps, Verification, If it goes wrong]
  optional: [Related]

export:
  version: 1
  fields: [id, title, status, applies-to, last-rehearsed, rehearsal-frequency, tags]
  sections:
    When to use this: full
    Prerequisites: full
  notes: >
    The steps are left out on purpose.
    See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#processes>.
index:
  columns: [id, title, status, last-rehearsed, owner]
  sort: id

rules:
  - id: staleness
    description: >
      A process past its rehearsal frequency, or one whose `last-rehearsed` is `never`.
    severity: warning
    # 92 days is the longest quarter, and 366 the longest year.
    expr: >-
      field('last-rehearsed') != 'never'
      and (field('rehearsal-frequency') == 'quarterly' implies days_since('last-rehearsed') <= 92)
      and (field('rehearsal-frequency') == 'annual' implies days_since('last-rehearsed') <= 366)
    message: >
      nobody has walked this process inside its `rehearsal-frequency`. Follow it end to end and set
      `last-rehearsed` to that day, or state a cadence somebody keeps.
  - id: no-hedged-ordering
    description: No step hedged with "typically", "usually" or "normally".
    severity: warning
    expr: >-
      not section_matches('Steps', '(?i)\b(typically|usually|normally)\b')
    message: >
      a step hedged with "typically", "usually" or "normally" leaves the reader to decide. Say what the
      ordering depends on, or state it plainly.
