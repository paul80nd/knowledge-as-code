# yaml-language-server: $schema=./meta/type.schema.json

type: standard
label: Standard
label-plural: Standards
folder: standards
page: standards.md
tier: normative
lifecycle: living
summary: The rulebook, imperative, RFC 2119, with concrete examples and a conformance checklist.
goes-here: A rule people must follow when building
detail: >
  Imperative throughout: **MUST**, **SHOULD**, **MAY**. Composed rather than read alone: the rules for a piece
  of work are the union of the layers that apply to it.

versus:
  controls: >
    The standard says what to do. The control says how we know it happened. "Secrets **MUST** come from the
    vault" is a standard. "CI runs secret scanning on every PR" is a control. If it can fail a build, it is a
    control.

lineage:
  prior-art: "[ComplianceForge HCGF](https://complianceforge.com/start-here/governance-risk-compliance-grc-content/hierarchical-cybersecurity-governance-framework), Standard layer, and [BCP 14](https://www.rfc-editor.org/rfc/rfc8174) for the grammar"
  alignment: >
    Granular and prescriptive requirements, the RFC 2119 keyword set, and the all-capitals rule
  divergence: >
    We compose standards by union across the folders that apply. HCGF has no composition model

collision: >
  In ordinary engineering conversation a *standard* is something an external body publishes: an ISO, an IEEE,
  an RFC. Here it is an internal rulebook. The collision is unavoidable, since the governance frameworks we take
  the layering from have the same problem, but it is worth saying aloud.

  The grammar is worth being precise about too. The keyword set comes from **BCP 14**, which is [RFC
  2119](https://www.rfc-editor.org/rfc/rfc2119) *and* [RFC 8174](https://www.rfc-editor.org/rfc/rfc8174)
  together. RFC 8174 establishes that the keywords carry their normative meaning **only when written in
  capitals**, and that is the rule this type depends on. Citing RFC 2119 alone leaves it unsupported.

# A mnemonic drawn from the concept the standard governs, two to seven characters. Standards are cited
# constantly from controls and from other standards, so the id is what a reader meets most often and it
# should say something. The length follows the word rather than a column: std-PR and std-SECRET are each
# as long as the thing they name. The filename carries none of it, which is what `carries-id:` says.
id:
  prefix: std
  style: mnemonic
  width:
    min: 2
    max: 7

filename:
  pattern: '^[a-z0-9-]+\.md$'
  carries-id: false
  slug-max: 30
  notes: >
    A standard is named for the rule area alone and carries no part of its id. The category folder and
    the topical slug already say what the file holds, and prefixing the mnemonic gives
    `common/secr-secret-handling.md`. The mnemonic lives in frontmatter. A repeated area name is the
    composition model made concrete, so `common/testing.md` and `platform/node/testing.md` are one
    topic written at two altitudes.

fields:

  status:
    required: true
    type: enum
    values: [draft, active, deprecated, superseded]
    description: Plain values only. Enforcement notes belong in `verified-by`.
    notes: >
      A status of "until ADR-NNNN is accepted" is derivable from `derived-from` plus that ADR's own status.

  category:
    type: string
    from: sub-path
    description: The folder the standard is filed under, below `standards/`.
    notes: >
      Standards compose: the rule-set that binds a piece of work is the union of the folders that apply
      to it. So a folder groups the standards a reader goes looking for together, and a rule is written
      at the most general folder where it is still true.

      Where you save the file is what sets it. Folders can nest, so `platform/node` is a category and
      `platform` is the category above it. A standard saved straight into `standards/` has no category.
      You choose the folders.

  derived-from:
    required: false
    type: list
    of: id
    ref: adrs
    description: The ADRs this standard distils. Provenance may come from `implements` instead.
    notes: >
      `provenance-required` below is what enforces it. `implements` satisfies it where the standard descends
      from a policy rather than a decision.

  implements:
    required: false
    type: list
    of: id
    ref: policies
    part-required: true
    description: Policy clause ids this standard puts into practice, as `pol-EVER.BRANCH`.
    notes: >
      Clause by clause, and a bare policy id is refused. A standard discharges some of a policy's clauses
      and seldom all of them, so a bare id is one keystroke shorter than the honest list and reads to
      anything counting coverage as every clause covered. A standard that does cover every clause lists
      every clause. The policies it relates to are readable from the clause ids, so no second field
      carries them.

      One-way, and pointed upward. A standard names the clause it puts into practice. The policy does not
      name its standards. Policies are the layer a downstream corpus inherits and a standard is the layer it
      writes for itself, so the set of implementers is unknowable from where the policy sits. A policy
      with no implementer named is the normal state, not a gap.

  verified-by:
    required: false
    type: list
    of: id
    ref: controls
    reciprocal: verifies
    description: Control ids that check it.

  applies-to:
    required: true
    type: list
    of: id
    ref: services
    allow-literal: [all]
    description: Service ids, or `all`.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone confirms this is still true.

sections:
  required: [Summary, Rules, Examples, Conformance checklist, Rationale and provenance]
  optional: [Sources and further reading, Changelog]

index:
  columns: [id, title, category, status, derived-from, review-by]
  sort: id

rules:
  - id: provenance-required
    description: A standard cites an ADR in `derived-from`, a policy clause in `implements`, or both.
    severity: error
    expr: "present('derived-from') or present('implements')"
    message: >
      A standard cites where its authority comes from: an ADR in `derived-from`, a policy clause in
      `implements`, or both. With neither this is guidance, and guidance is an explanation.
  - id: rules-have-controls
    description: >
      Every MUST / MUST NOT rule is claimed by a control, or the standard declares the gap explicitly.
  - id: changelog-begins-at-active
    description: Changelog entries are material changes only, and begin when status becomes `active`.
    # Material means a rule added, removed or changed in effect. Wording, examples, link fixes and typos are not. Git
    # has those.
  - id: changelog-on-material-change
    description: >
      If the Rules section changed and status is `active`, a new changelog entry is required in the same commit.
