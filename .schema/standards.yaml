type: standard
label: Standard
label-plural: Standards
folder: standards
page: standards.md
tier: normative
lifecycle: living
summary: The rulebook — imperative, RFC 2119, with concrete examples and a conformance checklist.
goes-here: A rule people must follow when building
detail: >
  Imperative throughout — **MUST**, **SHOULD**, **MAY**. Composed rather than read alone: the rules for a piece
  of work are the union of the layers that apply to it.

versus:
  controls: >
    The standard says what to do; the control says how we know it happened. "Secrets **MUST** come from the
    vault" is a standard. "CI runs secret scanning on every PR" is a control. If it can fail a build, it is a
    control.

lineage:
  prior-art: "[ComplianceForge HCGF](https://complianceforge.com/start-here/governance-risk-compliance-grc-content/hierarchical-cybersecurity-governance-framework), Standard layer; [BCP 14](https://www.rfc-editor.org/rfc/rfc8174) for the grammar"
  alignment: >
    Granular, prescriptive requirements; the RFC 2119 keyword set and the all-capitals rule
  divergence: >
    We compose standards by union across the axes the type declares. HCGF has no composition model

id:
  prefix: std
  style: numbered
  width: 4

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: >
    Standards are filed under a category folder (common/, platform/, public-api/, …) and named for the rule
    area, not numbered in the filename. The numeric id lives in frontmatter.

fields:

  status:
    required: true
    type: enum
    values: [draft, active, deprecated, superseded]
    description: Plain values only — enforcement notes belong in `verified-by`.
    notes: >
      Plain values only. Enforcement notes belong in `verified-by`; "until ADR-NNNN is accepted" is derivable
      from `derived-from` plus that ADR's own status.

  axis:
    required: true
    type: enum
    values: [common, platform, interface, domain]
    description: The layer where the rule is actually true. TODO — four formulations exist; settle before use.
    notes: >
      TODO — unresolved. Four formulations exist across the corpus (`standards.md` schema block,
      `standards.md` prose which names `framework`, `taxonomy.md` which says "interface/domain", and
      `standards/README.md` which splits differently). Settle before generating.

  derived-from:
    required: false
    type: list
    of: id
    ref: adrs
    description: The ADRs this standard distils. Provenance may come from `implements` instead.
    notes: >
      The ADRs this standard distils. Provenance is required — see `provenance-required` below — but may be
      satisfied by `implements` instead where the standard descends from a policy rather than a decision.

  implements:
    required: false
    type: list
    of: id
    ref: policies
    description: Policy ids this standard puts into practice.
    notes: >
      One-way, and pointed upward. A standard names the policy it puts into practice; the policy does not
      name its standards. Policies are the layer a downstream corpus inherits and a standard is the layer it
      writes for itself, so the set of implementers is unknowable from where the policy sits — and a policy
      with no implementer named is the normal state, not a gap.

  verified-by:
    required: false
    type: list
    of: id
    ref: controls
    reciprocal: verifies
    description: Control ids that check it.

  applies-to:
    required: true
    type: list
    of: id
    ref: services
    allow-literal: [all]
    description: Service ids, or `all`.

  review-by:
    required: true
    type: date
    description: Quoted. Drives the staleness report.

sections:
  required: [Summary, Rules, Examples, Conformance checklist, Rationale and provenance]
  optional: [Changelog]

index:
  columns: [id, title, axis, status, derived-from, review-by]
  sort: [axis, id]

rules:
  - id: provenance-required
    description: A standard cites an ADR in `derived-from`, a policy in `implements`, or both.
    severity: error
    expr: "present('derived-from') or present('implements')"
    message: >
      A standard cites where its authority comes from — an ADR in `derived-from`, a policy in `implements`,
      or both. With neither this is guidance, and guidance is an explanation.
  - id: rules-have-controls
    description: >
      Every MUST / MUST NOT rule is claimed by a control, or the standard declares the gap explicitly.
  - id: changelog-begins-at-active
    description: Changelog entries are material changes only, and begin when status becomes `active`.
    # Material means a rule added, removed or changed in effect. Wording, examples, link fixes and typos are not; git
    # has those.
  - id: changelog-on-material-change
    description: >
      If the Rules section changed and status is `active`, a new changelog entry is required in the same commit.
