# yaml-language-server: $schema=./meta/type.schema.json

type: fix
label: Fix
label-plural: Fixes
folder: fixes
page: fixes.md
tier: normative
lifecycle: living
summary: A problem with a confirmed resolution, promoted from a discovery once a human has verified it.
goes-here: A problem with a known, confirmed resolution
detail: >
  It carries provenance back to the observation it came from, so the reader can see how far the resolution has
  been taken on trust.

lineage:
  prior-art: "ITIL Problem Management, the *known error* construct"
  alignment: >
    A problem whose cause is understood and whose fix is documented, and the observed → analysed → promoted lifecycle
  divergence: >
    ITIL binds a known error to a formal problem record and an owning practice. Ours is promoted by any human
    verification, from anything noticed

id:
  prefix: fix
  style: numbered
  width: 4

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the symptom, not the cause. That is what people search for.

fields:

  status:
    required: true
    type: enum
    values: [active, superseded, fixed-upstream]
    description: '`fixed-upstream` means the cause is gone. The entry stays for whoever searches for it.'

  symptom-keywords:
    required: true
    type: list
    of: string
    min-items: 3
    description: 'Over-fill it: error text, service names, and what someone types before they know the cause.'
    notes: This is the field that makes the document findable.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this fix concerns.

  promoted-from:
    required: false
    type: id
    ref: discoveries
    reciprocal: promoted-to
    description: The discovery this was promoted from.

  confirmed:
    required: true
    type: list
    of: object
    shape: event
    description: Every confirmation this fix has had, oldest first, one line each.
    notes: >
      A fix nobody confirmed is a discovery, and this field is what separates the two tiers. The list
      keeps every confirmation the fix has had, so a reader sees when it was last checked, by whom,
      and who checked it before that. One confirmation is one entry, so the moment and the person are
      edited together.

      A confirmation is an actor doing something at a point in time, so the keys come from the `event`
      shape rather than being written out here. Who may confirm is this type's own question, and
      `confirmed-by-a-person` below is where it is asked.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone confirms this is still true.

sections:
  required: [Symptom, Cause, Resolution]
  optional: [Why it happens, How we found it, Related]

index:
  columns: [id, title, applies-to, status, review-by]
  sort: id

rules:
  - id: confirmed-by-a-person
    description: A confirmation names the person who made it.
    severity: error
    expr: "entries_match('confirmed', 'by', '^human:[a-z0-9.-]+$')"
    message: >
      A confirmation here names something other than a person. Write `human:alex.doe`. An agent, a
      session id and a team alias are all refused, because none of them can be asked what it checked.
      `role:` is refused as well: a post cannot read an answer, and the person who did read it stays
      named after the post changes hands.

  - id: one-problem-per-document
    description: One Symptom section, because a fix is found by its symptom.
    severity: warning
    expr: "section_count('Symptom') <= 1"
    message: >
      This carries more than one Symptom section, so it is more than one fix. Someone arriving with a
      symptom matches on the first one and never reads the second. Split it.
