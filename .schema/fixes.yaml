# yaml-language-server: $schema=./meta/type.schema.json

type: fix
label: Fix
label-plural: Fixes
folder: fixes
page: fixes.md
tier: normative
lifecycle: living
summary: A problem with a verified resolution, promoted from a discovery once somebody has checked it.
goes-here: A problem with a known, verified resolution
detail: >
  It carries provenance back to the observation it came from, so the reader can see how far the resolution has
  been taken on trust.

lineage:
  prior-art: "ITIL Problem Management, the *known error* construct"
  alignment: >
    A problem whose cause is understood and whose fix is documented, and the observed → analysed → promoted lifecycle
  divergence: >
    ITIL binds a known error to a formal problem record and an owning practice. Ours is promoted by any
    verification, from anything noticed

id:
  prefix: fix
  style: numbered
  width: 4

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the symptom, not the cause. That is what people search for.

fields:

  status:
    required: true
    type: enum
    values: [active, superseded, fixed-upstream]
    description: '`fixed-upstream` means the cause is gone. The entry stays for whoever searches for it.'

  symptom-keywords:
    required: true
    type: list
    of: string
    min-items: 3
    description: 'Over-fill it: error text, service names, and what someone types before they know the cause.'
    notes: This is the field that makes the document findable.

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this fix concerns.

  promoted-from:
    required: false
    type: id
    ref: discoveries
    reciprocal: promoted-to
    description: The discovery this was promoted from.

  verified:
    required: true
    type: list
    of: object
    shape: event
    description: Every verification this fix has had, oldest first, one line each.
    notes: >
      A fix nobody verified is a discovery, and this field is what separates the two tiers. The list
      keeps every verification the fix has had, so a reader sees when it was last checked, by whom, and
      who checked it before that. One verification is one entry, so the moment and the actor are edited
      together.

      Any actor may verify, bar a post. An agent that reproduced the symptom and ran the resolution has
      checked something real, and refusing the entry leaves that work nowhere to go. A `role:` is
      refused because a post cannot read an answer, and `verified-by-a-known-actor` below is where both
      halves of that are asked.

      How far the fix has been taken on trust is read off this list. Entries by agents alone leave it
      machine-confirmed, and one `human:` entry makes it human-reviewed. Those are the Open Knowledge
      Format's words for the same reading, and `trust` carries it into the export. The exporter derives
      that tier from this list, so a record has one place saying who checked.

      A verification is an actor doing something at a point in time, so the keys come from the `event`
      shape rather than being written out here. `verified` is the name the Open Knowledge Format gives
      the same list, and taking it lets a reader who knows that format read this one.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone verifies this is still true.

sections:
  required: [Symptom, Cause, Resolution]
  optional: [Why it happens, How we found it, Related]

export:
  version: 1
  fields: [id, title, status, symptom-keywords, applies-to, verified, review-by, tags]
  sections:
    Symptom: full
    Cause: full
    Resolution: full
  notes: >
    `symptom-keywords` is what a lookup searches on, and a fix arriving without it is one nobody
    downstream can find. It is the field this type exports for.

    `Symptom`, `Cause` and `Resolution` travel whole. A reader matches on the symptom, checks the cause
    is theirs, and then acts, so a resolution arriving without its cause is half an answer. All three
    are short, because this type holds one problem per document.

    `verified` travels, and `trust` is derived from it. This type exists to say how far a resolution has
    been taken on trust, and a consumer that cannot read the list weighs the answer by its wording
    alone.

    `status` and `review-by` say whether the answer still holds. `fixed-upstream` is the value that
    earns the pair: the cause is gone, and a consumer following the resolution would be repairing
    something it does not have.

    `applies-to` names services, and a service travels, so a consumer holding the catalogue follows each
    id to the record.

    `How we found it` stays behind, for the reason `Rationale and provenance` stays behind on a
    standard. It carries the diagnostic route, and a consumer acts on the answer. `Why it happens` goes
    with it, because it points at the design flaw the resolution works around and at wherever that flaw
    is tracked, which is a place only this estate can open.

    `promoted-from` names a discovery, and a discovery travels nowhere, so the id would reach nothing.

    `owner` stays behind. Who answers for a fix is a fact about this corpus, and whoever holds a copy
    has nobody to ask.

index:
  columns: [id, title, applies-to, status, review-by]
  sort: id

rules:
  - id: verified-by-a-known-actor
    description: A verification names a person or a producer, and never a post.
    severity: error
    expr: "entries_match('verified', 'by', '^(human:[a-z0-9.-]+|[a-z0-9.-]+/[^ ]+)$')"
    message: >
      A verification here names neither a person nor a producer. Write `human:alex.doe`, or name an
      agent the way a tool names itself, as `symptom-sweep/1.4.0`. `role:` is refused: a post cannot
      read an answer, and the person who did read it stays named after the post changes hands.

  - id: raiser-does-not-verify
    description: An agent does not verify a fix it raised.
    notes: >
      Verifying your own work confirms nothing, and it is the one thing accepting any actor opens up.
      Nothing on a fix names who raised it: `owner` names the person answerable for it now, and the
      discovery it was promoted from is another record a rule reading one document cannot open. So this
      is declared and does not run.

      A report asks the narrower question its own frontmatter can answer, and `no-self-verification`
      there is built: `generated.by` names the producer, so the one actor that may not verify is on the
      record already.

  - id: one-problem-per-document
    description: One Symptom section, because a fix is found by its symptom.
    severity: warning
    expr: "section_count('Symptom') <= 1"
    message: >
      This carries more than one Symptom section, so it is more than one fix. Someone arriving with a
      symptom matches on the first one and never reads the second. Split it.
