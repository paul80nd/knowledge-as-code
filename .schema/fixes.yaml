# yaml-language-server: $schema=./meta/type.schema.json

type: fix
label: Fix
label-plural: Fixes
folder: fixes
page: fixes.md
tier: normative
lifecycle: living
summary: A problem with a verified resolution, promoted from a discovery once somebody has checked it.
goes-here: A problem with a known, verified resolution
detail: >
  Each fix lists its verifications, so a reader can see how far the resolution has been taken on trust.

lineage:
  prior-art: "ITIL Problem Management, the *known error* construct"
  alignment: >
    A problem whose cause is understood and whose fix is documented, along with the observed → analysed → promoted
    lifecycle
  divergence: >
    ITIL binds a known error to a formal problem record and an owning practice. A fix here is promoted by any
    verification, from anything somebody noticed

id:
  prefix: fix
  style: numbered
  width: 4

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: >
    The pattern accepts any slug, so the symptom is a convention. Build the slug from the symptom, because that is
    what somebody searches for.

fields:

  status:
    required: true
    type: enum
    values: [active, superseded, fixed-upstream]
    description: '`fixed-upstream` means the cause is gone. The entry stays for whoever searches for it.'

  symptom-keywords:
    required: true
    type: list
    of: string
    min-items: 3
    description: 'Over-fill it: error text, service names, and what someone types before they know the cause.'

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this fix concerns.

  promoted-from:
    required: false
    type: id
    ref: discoveries
    reciprocal: promoted-to
    description: The discovery this was promoted from.

  verified:
    required: true
    type: list
    of: object
    shape: event
    description: Every verification this fix has had, oldest first, one line each.
    notes: >
      A fix nobody verified is still a discovery, which is why this field is required. The entries take the same
      shape as a report's.
      <https://paul80nd.github.io/knowledge-as-code/design/reports/#the-provenance-frontmatter> gives that shape,
      the actors it refuses, and the trust tier derived from the list.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone verifies this is still true.

sections:
  required: [Symptom, Cause, Resolution]
  optional: [Why it happens, How we found it, Related]

export:
  version: 1
  fields: [id, title, status, symptom-keywords, applies-to, verified, review-by, tags]
  sections:
    Symptom: full
    Cause: full
    Resolution: full
    Why it happens: full
  notes: >
    `symptom-keywords` is what a lookup searches on, and the field this type exports for.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#fixes> says what else travels, and what stays
    behind.
index:
  columns: [id, title, applies-to, status, review-by]
  sort: id

rules:
  - id: verified-by-a-known-actor
    description: A verification names a person or a producer, and never a post.
    severity: error
    expr: "entries_match('verified', 'by', '^(human:[a-z0-9.-]+|[a-z0-9.-]+/[^ ]+)$')"
    message: >
      the `by` in this verification is neither a person nor a producer. Write `human:alex.doe` for a person, or
      `symptom-sweep/1.4.0` for an agent.

  - id: raiser-does-not-verify
    description: An agent does not verify a fix it raised.
    notes: >
      Nothing on a fix states who raised it. `owner` gives the person answerable for it now, and `promoted-from`
      points at a discovery, which a rule reading one document cannot open. The rule is declared and does not run.

  - id: one-problem-per-document
    description: A fix has one Symptom section, and a record with two is two fixes.
    severity: warning
    expr: "section_count('Symptom') <= 1"
    message: >
      this record has more than one Symptom section, so it describes more than one fix. Split it, one fix per
      symptom.
