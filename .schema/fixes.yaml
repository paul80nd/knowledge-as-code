# yaml-language-server: $schema=./meta/type.schema.json

type: fix
label: Fix
label-plural: Fixes
folder: fixes
page: fixes.md
tier: normative
lifecycle: living
summary: A problem with a resolution somebody has verified.
goes-here: A problem with a known, verified resolution
detail: >
  Each fix lists its verifications, so a reader can see how far the resolution has been taken on trust.

lineage:
  prior-art: >
    ITIL Problem Management, the *known error* construct, and
    [the KCS v6 article](https://library.serviceinnovation.org/KCS/KCS_v6/KCS_v6_Practices_Guide/030/040/010/020)
  alignment: >
    A problem whose cause is understood and whose resolution is documented. KCS structures such an article as *Issue*,
    *Environment*, *Resolution* and *Cause*. The four sections this type requires are those. [The Good Docs Project's
    troubleshooting template](https://www.thegooddocsproject.dev/template/troubleshooting) asks for three of them, as
    *Symptoms*, *Causes* and *Solutions*. ITIL requires a documented cause, which KCS marks optional, and this type
    requires it
  divergence: >
    ITIL binds a known error to a formal problem record and an owning practice. A fix here is written from anything
    somebody noticed, and any verification gives it authority. ITIL also expects a workaround while a permanent fix is
    outstanding, and [the ServiceNow known error
    article](https://www.servicenow.com/docs/bundle/zurich-it-service-management/page/product/problem-management/reference/known-error-article-form.html)
    gives *Workaround* a field of its own. This type asks for one resolution somebody has verified, so a problem with
    no answer yet stays in the tracker. KCS reviews an article when somebody uses it, where `review-by` sets a date.
    `How we found it` is this type's own, and no source states it

id:
  prefix: fix
  style: numbered
  width: 4

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30
  notes: >
    The pattern accepts any slug, so the symptom is a convention. Build the slug from the symptom, because that is
    what somebody searches for.

fields:

  status:
    required: true
    type: enum
    values: [active, draft, superseded, fixed-upstream]
    description: Whether the fix is current, unverified, replaced, or no longer needed.
    notes: >
      `draft` is a fix written from an observation that nobody has verified. `fixed-upstream` means the cause is
      gone, and the entry stays for whoever searches for the symptom.

  symptom-keywords:
    required: true
    type: list
    of: string
    min-items: 3
    description: 'Over-fill it: error text, service names, and what someone types before they know the cause.'

  applies-to:
    required: false
    type: list
    of: id
    ref: services
    description: Service ids this fix concerns.

  verified:
    required: false
    required-when: 'status != draft'
    type: list
    of: object
    shape: event
    description: Every verification this fix has had, oldest first, one line each.
    notes: >
      A draft states no verification, and every other status must. The entries take the same shape as a report's.
      <https://paul80nd.github.io/knowledge-as-code/design/reports/#the-provenance-frontmatter> gives that shape,
      the actors it refuses, and the trust tier derived from the list.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone verifies this is still true.

sections:
  required: [Symptom, Environment, Cause, Resolution]
  optional: [Why it happens, How we found it, Related]

export:
  version: 2
  fields: [id, title, status, symptom-keywords, applies-to, verified, review-by, tags]
  sections:
    Symptom: full
    Environment: full
    Cause: full
    Resolution: full
    Why it happens: full
  notes: >
    `symptom-keywords` is what a lookup searches on, and the field this type exports for.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#fixes> says what else travels, and what stays
    behind.
index:
  columns: [id, title, applies-to, status, review-by]
  sort: id

rules:
  - id: verified-by-a-known-actor
    description: A verification names an actor the Open Knowledge Format defines, and never a post.
    severity: error
    expr: "entries_match('verified', 'by', '^(human:[a-z0-9.-]+|process:[a-z0-9.-]+|[a-z0-9.-]+/[^ ]+)$')"
    message: >
      the `by` in this verification states no known actor. Write `human:alex.doe` for a person,
      `process:nightly-sweep` for an automated process, or `symptom-sweep/1.4.0` for an agent.

  - id: raiser-does-not-verify
    description: An agent does not verify a fix it raised.
    notes: >
      Nothing on a fix states who raised it. `owner` gives the person answerable for it now, and `sources` points
      outside the corpus, which a rule reading one document cannot follow. The rule is declared and does not run.

  - id: one-problem-per-document
    description: A fix has one Symptom section, and a record with two is two fixes.
    severity: warning
    expr: "section_count('Symptom') <= 1"
    message: >
      this record has more than one Symptom section, so it describes more than one fix. Split it, one fix per
      symptom.
