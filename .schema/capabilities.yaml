# yaml-language-server: $schema=./meta/type.schema.json

type: capability
label: Capability
label-plural: Capabilities
folder: capabilities
page: capabilities.md
tier: descriptive
lifecycle: living
summary: What the organisation offers a customer, and why, with links to the services and NFRs behind it.
goes-here: What the organisation offers a customer, and why
detail: >
  A capability sits above the work items. It links to the ones that detail it, the services that implement it,
  the feature files that test it, and the NFRs that constrain it. A capability that accumulates detail of its own
  has stopped being one.

versus:
  services: >
    A capability is what a customer gets. A service is something the organisation deploys. One capability usually
    spans several services. One service usually contributes to several capabilities.

lineage:
  prior-art: "None that fits. See [Capability](#capability) below"

collision: >
  [ArchiMate](https://pubs.opengroup.org/architecture/archimate3-doc/ch-Strategy-Layer.html) uses the word for an
  ability an organisation possesses, and [SAFe](https://framework.scaledagile.com/features-and-capabilities) uses
  it for solution functionality that sits below an epic. Here a capability is what the organisation offers a
  customer, and it sits above the epic layer. Say which sense you mean wherever the word crosses into an
  architecture conversation.

id:
  prefix: cap
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [planned, building, live, deprecated]
    description: Lifecycle of the capability itself, which may differ from the lifecycle of its services.

  implemented-by:
    required: true
    type: list
    of: id
    ref: services
    mirrors-section: Where the detail lives
    description: Ids of the services that implement this capability.

  feature-files:
    required: false
    type: list
    of: string
    description: Paths to the feature files that test this capability, each one beginning with its repository.
    notes: >
      A path names the repository first, spelled as that repository's service spells `repo:`, then the path
      inside it. `feature-file-repo` checks that first segment. The rest is a plain string, so
      `ref-resolves` never sees it and nothing reads it until `feature-file-orphans` runs.

  nfrs:
    required: false
    type: list
    of: id
    ref: nfrs
    reciprocal: applies-to
    mirrors-section: Where the detail lives
    description: Ids of the NFRs this capability must meet.

sections:
  required: [What it does, Why it exists, Where the detail lives]
  optional: [Surfaces, Known limitations]

export:
  version: 1
  fields: [id, title, status, implemented-by, feature-files, nfrs, tags]
  sections:
    What it does: full
    Why it exists: full
    Surfaces: full
    Where the detail lives: full
    Known limitations: full
  notes: >
    Every section travels. `Where the detail lives` is the only place the work items are written, and no field
    states them, so a consumer reads each one's label and not its address.
    See <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#capabilities>.

index:
  columns: [id, title, status, implemented-by]
  sort: id

rules:
  - id: hub-not-specification
    description: A capability's prose stays proportionate to the links it makes.
    severity: warning
    # A ratio, so a capability that links to nothing fails at any length.
    expr: "words() <= links() * 40"
    message: >
      prose has outgrown the links. Move the detail into the documents this points at, and link to them
      from here.
  # The only part of a feature file path this corpus can check without reading a code repository.
  - id: feature-file-repo
    description: A feature file path begins with a repository one of the implementing services names.
    severity: warning
  - id: feature-file-orphans
    description: >
      Scheduled. Reports feature files in the code repositories no capability claims, and paths here that
      no longer exist.
