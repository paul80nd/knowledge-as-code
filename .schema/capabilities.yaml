type: capability
label: Capability
label-plural: Capabilities
folder: capabilities
page: capabilities.md
tier: descriptive
lifecycle: living
summary: What we offer a customer and why, as a hub linking to what implements, tests and constrains it.
goes-here: A description of what we offer a customer, and why
detail: >
  A hub, sitting above the epic layer: it links to the work items that detail it, the services that implement
  it, the feature files that test it, and the NFRs that constrain it. A capability that starts accumulating
  detail of its own has stopped being one.

versus:
  services: >
    A capability is what a customer gets. A service is a thing we deploy. One capability typically spans several
    services; one service often contributes to several capabilities.

id:
  prefix: cap
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [planned, building, live, deprecated]
    description: Lifecycle of the capability, not of the services behind it.

  implemented-by:
    required: true
    type: list
    of: id
    ref: services
    description: Service ids. A capability no service implements is a plan.

  ado-epics:
    required: false
    type: list
    of: int
    notes: ADO work item ids. Not resolvable by CI; recorded for humans and for the reverse harvest.

  feature-files:
    required: false
    type: list
    of: string
    description: 'Repo-relative paths. Checked both ways: a missing path fails, an unclaimed file is reported.'
    notes: >
      Repo-relative paths. Checked in both directions — a path that does not exist fails, and a feature file
      claimed by no capability is reported.

  nfrs:
    required: false
    type: list
    of: id
    ref: nfrs
    description: NFR ids — the targets this capability is held to.

sections:
  required: [What it does, Why it exists, Where the detail lives]
  optional: [Surfaces, Known limitations]

index:
  columns: [id, title, status, implemented-by]
  sort: id

rules:
  - id: hub-not-specification
    description: A capability's prose stays proportionate to its links — a hub, not a specification.
    severity: warning
    # A capability linking to nothing is a specification however short it is, which is why the
    # allowance is a ratio rather than a ceiling.
    expr: "words() <= links() * 40"
    message: >
      Prose has outgrown the links. A capability is a hub — move the detail into the documents it should
      be pointing at, and link to them from here.
  - id: feature-file-orphans
    description: >
      Scheduled. Reports feature files in the code repositories claimed by no capability, and paths here
      that no longer exist.
