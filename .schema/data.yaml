# yaml-language-server: $schema=./meta/type.schema.json

type: data
label: Data
label-plural: Data
folder: data
page: data.md
tier: descriptive
lifecycle: living
summary: Which service owns which data, how long it is kept, how sensitive it is, and where personal data flows.
goes-here: Where data lives, how long it is kept, and its sensitivity
detail: >
  One document per data domain, written for an engineer. It records the entities in the domain, the store they
  live in, the service that owns them, how sensitive they are, and how long they are kept.

lineage:
  prior-art: "[GDPR Article 30](https://eur-lex.europa.eu/eli/reg/2016/679/oj), records of processing activities"
  alignment: >
    Article 30(1)'s purposes of the processing as `Purpose`, its categories of data subjects as `data-subjects`, its
    categories of recipients as `flows-to`, and its time limit for erasure as `retention`. `region` is the NIST
    Privacy Framework's ID.IM-P7 and `data-subjects` its ID.IM-P3. Whether deletion runs is this type's own question,
    which that framework asks as CT.DM-P5. The
    [ICO](https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/storage-limitation/)
    asks you to review retained personal data regularly. [NIST SP
    800-53r5](https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final) RA-2 asks that a categorisation be revisited.
    `review-by` answers both
  divergence: >
    Article 30 is organised by processing activity and by controller, and this type by data domain. **A Data document
    is not a ROPA and does not satisfy Article 30**: it names no controller, no representative and no data protection
    officer, and describes no security measures, which Article 30(1)(g) asks for. Article 30(1)(c) also asks for the
    categories of personal data, where `Entities` lists the domain's objects. Article 30(1)(e)'s transfer to a third
    country is a column of the `Flows` table and not a field. `classification` and `personal-data` split one question
    the sources ask separately: ISO/IEC 27002:2022 5.12 grades confidentiality, and GDPR Article 9 names a category.
    Neither the ICO nor RA-2 sets a review interval, so `review-by` fixes one per document
notes: >
  The folder is singular because English gives `data` no plural. `glossary/` is the other singular folder in the
  taxonomy.

id:
  prefix: dat
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, deprecated]
    in-force: active
    description: Whether this data is current or deprecated.

  owned-by:
    required: true
    type: id
    ref: services
    description: Id of the service that owns this data.
    notes: >
      The field takes a single id. Settle who owns the data before writing the document, because shared
      ownership leaves nobody answerable.

  classification:
    required: true
    type: enum
    values: [public, internal, confidential]
    description: How widely the data may be shared, from published to need-to-know.
    notes: >
      The three values grade confidentiality alone. ISO/IEC 27002:2022 5.12 classifies on confidentiality,
      integrity and availability, and this field takes the first of the three because it is the one a
      reader acts on.

  personal-data:
    required: true
    type: enum
    values: [none, personal, special-category]
    description: Whether the data identifies a living person, and whether GDPR Article 9 applies to it.
    notes: >
      A category of data, never a grade of sensitivity, which is why it sits apart from `classification`.
      Data can be `confidential` and `none`, or `public` and `personal`. GDPR Article 9 names the special
      categories.

  data-subjects:
    required: false
    required-when: 'personal-data != none'
    type: list
    of: string
    pattern: '^[a-z0-9-]+$'
    description: Categories of people the data is about, such as `borrowers` or `staff`.
    notes: >
      GDPR Article 30(1)(c) asks for the categories of data subjects beside the categories of personal
      data, and the NIST Privacy Framework asks the same as ID.IM-P3. The values are the corpus's own
      words, as `tags` are.

  retention:
    required: false
    required-when: 'personal-data in [personal, special-category]'
    type: string
    description: How long the data is kept in practice. Where that differs from the policy, record both.
    notes: 'Nothing parses the value, so "Indefinitely" and "7 years" are equally valid.'

  region:
    required: true
    type: string
    description: Where the data is stored and processed, as a cloud region or a place.
    notes: >
      The value is prose, so "UK South" and "On-premises, Leeds" are equally valid. GDPR Article 30(1)(e)
      asks about a transfer by a recipient, which this field does not answer: it states where the owning
      service keeps the data.

  flows-to:
    required: false
    type: list
    of: id
    ref: [services, integrations]
    description: Ids of the services and integrations this data is sent to.
    notes: >
      The field resolves against integrations as well as services, so a flow that leaves the estate is
      recorded here too.

  review-by:
    required: true
    type: date
    description: Quoted. The date by which someone confirms the classification and the retention still hold.
    notes: >
      `classification-in-date` warns once the date has passed, and `export.exclude` withholds the record
      where a corpus asks for it. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#data>.

sections:
  required: [Purpose, Entities, Where it lives, Classification, Retention]
  optional: [Flows, Related]

export:
  version: 2
  fields: [id, title, status, owned-by, classification, personal-data, data-subjects, retention, region, flows-to,
           review-by, tags]
  sections:
    Purpose: full
    Entities: full
    Where it lives: full
    Classification: full
    Retention: full
    Flows: full
  notes: >
    A service's `data-stores` travels as ids, and these records are what a reader follows them to. Each
    section qualifies a frontmatter value a consumer filters on.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#data> says what else travels, and
    what stays behind.

index:
  columns: [id, title, owned-by, classification, personal-data, retention, review-by]
  sort: classification

rules:
  - id: no-actual-data
    description: >
      Fails on an email address outside `example.com`. Nothing catches an identifier or a connection string.
    severity: error
    expr: >-
      not matches('[A-Za-z0-9._%+-]+@(?!example\.com)[A-Za-z0-9.-]+\.[A-Za-z]{2,}')
    message: >
      this address looks real. Write it under `example.com`, which RFC 2606 reserves so it can never be
      anybody's.
  - id: classification-in-date
    description: A document names a review date that has not passed.
    severity: warning
    expr: "present('review-by') implies field('review-by') >= today()"
    message: >
      this document's `review-by` has passed. Check the classification and the retention against the store,
      then set `review-by` to the next day someone looks at it.
