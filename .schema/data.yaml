# yaml-language-server: $schema=./meta/type.schema.json

type: data
label: Data
label-plural: Data
folder: data
page: data.md
tier: descriptive
lifecycle: living
summary: Which service owns which data, how long it is kept, how sensitive it is, and where personal data flows.
goes-here: Where data lives, how long it is kept, and its sensitivity
detail: >
  One document per data domain, written for an engineer. It records the entities in the domain, the store they
  live in, the service that owns them, how sensitive they are, and how long they are kept.

lineage:
  prior-art: "[GDPR Article 30](https://eur-lex.europa.eu/eli/reg/2016/679/oj), records of processing activities"
  alignment: >
    Categories of data, recipients, transfers, erasure time limits, security measures
  divergence: >
    Article 30 is organised by processing activity and by controller. This type is organised by data domain. **A Data
    document is not a ROPA and does not satisfy Article 30**

notes: >
  The folder is singular because English gives `data` no plural. `glossary/` is the other singular folder in the
  taxonomy.

id:
  prefix: dat
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [active, deprecated]
    description: Whether this data is current or deprecated.

  owned-by:
    required: true
    type: id
    ref: services
    description: Id of the service that owns this data.
    notes: >
      The field takes a single id. Settle who owns the data before writing the document, because shared
      ownership leaves nobody answerable.

  classification:
    required: true
    type: enum
    values: [public, internal, confidential, personal, special-category]
    description: How sensitive the data is. `personal` and `special-category` make `retention` required.

  retention:
    required: false
    required-when: 'classification in [personal, special-category]'
    type: string
    description: How long the data is kept in practice. Where that differs from the policy, record both.
    notes: 'Nothing parses the value, so "Indefinitely" and "7 years" are equally valid.'

  flows-to:
    required: false
    type: list
    of: id
    ref: [services, integrations]
    description: Ids of the services and integrations this data is sent to.
    notes: >
      The field resolves against integrations as well as services, so a flow that leaves the estate is
      recorded here too.

sections:
  required: [Entities, Where it lives, Classification, Retention]
  optional: [Flows, Related]

index:
  columns: [id, title, owned-by, classification, retention]
  sort: classification

rules:
  - id: no-actual-data
    description: >
      Fails on an email address outside `example.com`. Nothing catches an identifier or a connection string.
    severity: error
    expr: >-
      not matches('[A-Za-z0-9._%+-]+@(?!example\.com)[A-Za-z0-9.-]+\.[A-Za-z]{2,}')
    message: >
      this address looks real. Write it under `example.com`, which RFC 2606 reserves so it can never be
      anybody's.
  - id: store-has-service
    description: Every store named here resolves to a service in the catalogue.
