# Fields every document in the taxonomy has.
# A type file may refine a field here, and may declare fields of its own.

notes: >
  Some fields are absent on purpose. `title` is the H1. Git supplies `created` and `updated`.
  `lifecycle` follows from `tier`.

fields:

  id:
    required: true
    type: string
    description: Stable, unique across the corpus, never reused, in the format the type sets.
    notes: >
      Every cross-reference resolves against the id. Correct a filename freely. Never change an id.
      The type's `id` block also sets the width.

  type:
    required: true
    type: string
    description: The singular name of the type, which CI checks against the folder.
    notes: >
      The folder already gives this. The frontmatter states it anyway, so a record read away from
      its folder still says what kind of thing it is.

  tier:
    required: true
    type: enum
    values: [decided, normative, descriptive, procedural, observed]
    description: The record's trust level, fixed for the type and checked against the folder.
    notes: >
      The folder already gives this. The frontmatter states it anyway, so "observed" at the top of
      a page tells a reader how much weight to give the record.

  status:
    required: true
    type: enum
    values: []          # supplied by each type
    description: The record's current state, from the values this type sets.

  owner:
    required: true
    type: string
    pattern: '^(human|role):[a-z0-9.-]+$'
    description: A person as `human:alex.doe`, or a post as `role:head-of-engineering`.
    notes: >
      The pattern admits a person and a post, and no team alias. The prefix states which kind of
      actor the value is, so a reader never infers it from the spelling. `human:` is the Open
      Knowledge Format's actor form for a person, taken unchanged. `role:` is this framework's own,
      because OKF describes a person, a process or a producer and has no form for a post.

  sources:
    required: false
    type: list
    of: object
    entry:
      resource:
        required: true
        type: string
        description: A work item, a page, a path, or the population the content was drawn from.
    description: Where the content came from, one entry per source.
    notes: >
      `resource` is the Open Knowledge Format's one required key on a source, taken unchanged. OKF's
      optional `id`, `title`, `author`, `usage_count` and `last_modified` are left out until
      something here reads one. `reports` is the only type that exports this field, and it refines
      it into a list of corpora.

  tags:
    required: false
    type: list
    of: string
    pattern: '^[a-z0-9-]+$'
    description: Free-form, lowercase and hyphenated. A reader searches on these across types.

# The validator accepts these keys and reads nothing from them. Azure DevOps labels a wiki page with them.
reserved:
  - title
  - allowTitleToDifferFromFilename
