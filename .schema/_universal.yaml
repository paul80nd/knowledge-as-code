# Fields carried by every document in the taxonomy.
# Type files may override `values` (status differs per type) and add their own fields.

notes: >
  What is deliberately not a field here. `type` is inferred from the folder and `title` is the H1. `created`
  and `updated` are what git knows. `lifecycle` follows from `tier`, and a second field could disagree with
  the first.

fields:

  id:
    required: true
    type: string
    description: Stable, unique across the corpus, never reused. Format set by the type.
    notes: >
      The anchor every cross-reference resolves against, so a filename may be corrected and an id may not.
      Format and width are set by the type's `id` block.

  tier:
    required: true
    type: enum
    values: [decided, normative, descriptive, procedural, observed]
    description: Fixed for the type. A trust signal for the reader. CI checks it matches the folder.
    notes: >
      Derivable from the folder, and stated in frontmatter anyway: "observed" at the top of a page tells the
      reader how much weight to give it.

  status:
    required: true
    type: enum
    values: []          # supplied by each type
    description: Values vary by type.

  owner:
    required: true
    type: string
    description: A named person, never a team alias.
    notes: >
      Someone has to be answerable, which a team alias leaves open.

  tags:
    required: false
    type: list
    of: string
    pattern: '^[a-z0-9-]+$'
    description: Free-form, lowercase, hyphenated. Used for cross-cutting search.

# Keys the validator admits and reads nothing from. Azure DevOps uses them to label a page in wiki
# navigation, which is a rendering concern rather than document metadata.
reserved:
  - title
  - allowTitleToDifferFromFilename
