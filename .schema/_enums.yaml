# Enums used by more than one type. Referenced as $enums.<name>.
# An enum used by exactly one type lives in that type's file.

notes: >
  Nothing here records which types use an enum. A list would be a second place to keep in step, and it would be
  wrong in a corpus that adopted only some of these types. Grep the enum's name to find them.

enums:

  criticality:
    values: [critical, important, supporting]
    notes: >
      `critical` means a customer-facing failure, `important` means degraded service, and `supporting`
      means internal impact only.

  monitoring-output:
    values: [alert, ticket, log, none]
    notes: >
      `alert` means a person acts now, `ticket` means the system files one and a person acts later, and `log` means
      the fault is recorded and nobody reads it. `none` means nothing is emitted. The first three are the monitoring
      output the SRE Book lists, and `none` is this framework's own.

  severity:
    values: [sev1, sev2, sev3]

  rehearsal-frequency:
    values: [on-change, per-release, quarterly, annual]
    notes: >
      `quarterly` and `annual` are cycles, so a date check can measure a record against either. `on-change` and
      `per-release` state an event, which no window measures, so such a record is reported only where
      `last-rehearsed` is `"never"`.
