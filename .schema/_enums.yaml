# Enums used by more than one type. Referenced as $enums.<name>.
# An enum used by exactly one type lives in that type's file.

notes: >
  Which types draw on an enum is not recorded here. A list would be a second place to keep in step, and wrong in
  a corpus that adopted some of these types and not the others. Grep the enum's name to find them.

enums:

  criticality:
    values: [critical, important, supporting]
    notes: >
      Judged by what a customer experiences when it is unavailable. `critical` means customer-facing failure,
      `important` means degraded service, `supporting` means internal impact only. It sets runbook and NFR
      priority.

  severity:
    values: [sev1, sev2, sev3]

  rehearsal-frequency:
    values: [per-release, quarterly, annual]
