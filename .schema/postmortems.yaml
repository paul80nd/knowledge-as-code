# yaml-language-server: $schema=./meta/type.schema.json

type: postmortem
label: Postmortem
label-plural: Postmortems
folder: postmortems
page: postmortems.md
tier: decided
lifecycle: immutable
summary: What happened during an incident (timeline, impact, root cause, contributing factors, actions).
goes-here: An account of an incident and what caused it
detail: >
  Blameless, and immutable once published. An ADR records the intention, and a postmortem records the
  outcome.

lineage:
  prior-art: "[Google SRE, *Postmortem Culture*](https://sre.google/sre-book/postmortem-culture/)"
  alignment: >
    The field set (impact, actions, root cause, follow-up), and blamelessness defined as naming causes
    without naming people
  divergence: >
    Google reviews before publication and treats the document as living. This type freezes a postmortem once
    it is published, and separates root cause from contributing factors

id:
  prefix: pmt
  style: numbered
  width: 4
  notes: >
    `pmt-` names the document, as every prefix here does. `inc-` would name the incident, and one incident
    can produce more than one record.

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the symptom customers experienced, which is what somebody searches for.

fields:

  status:
    required: true
    type: enum
    values: [draft, published]
    description: '`published` freezes the document. A new understanding is a new postmortem citing this one.'

  occurred-at:
    required: true
    type: timestamp
    description: The moment the incident began, in UTC as `2026-09-07T20:18:00Z`.

  detected-at:
    required: true
    type: timestamp
    description: The moment somebody noticed the incident, in UTC as `2026-09-07T20:18:00Z`.
    notes: >
      Separate from `occurred-at`, because the gap between them is often the finding. A timestamp rather
      than a date, because a detection gap is usually measured in minutes.

  duration:
    required: true
    type: string
    description: How long the incident lasted, in whatever unit fits.

  severity:
    required: true
    type: enum
    values: $enums.severity
    description: The severity the incident was handled at.

  affected:
    required: true
    type: list
    of: id
    ref: [services, capabilities]
    description: Service and capability ids the incident affected.

  prompted:
    required: false
    type: list
    of: id
    ref: [adrs, runbooks, nfrs, fixes, standards]
    description: The ADRs, runbooks, NFRs, fixes and standards this incident caused.

sections:
  required: [Summary, Timeline, Impact, Root cause, Contributing factors, What went well, Actions]
  optional: [Related]

export:
  version: 1
  fields: [id, title, status, occurred-at, detected-at, duration, severity, affected, prompted, tags]
  sections:
    Summary: full
    Impact: summary
    Root cause: full
    Contributing factors: full
    What went well: full
  notes: >
    `Timeline` and `Actions` stay behind, because both name this estate's own clocks, systems and work
    items. <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#postmortems> says what else
    travels, and what stays behind.

index:
  columns: [id, title, occurred-at, severity, duration, affected]
  sort: occurred-at
  order: descending

rules:
  - id: immutable-after-published
    description: >
      Once `status` is `published`, the account changes only by a new postmortem, never by an edit in place.
  - id: detected-not-before-occurred
    description: '`detected-at` is at or after `occurred-at`.'
    severity: error
    # Guarded, so a missing timestamp is reported once, by `required-field`.
    expr: "present('detected-at') and present('occurred-at') implies field('detected-at') >= field('occurred-at')"
    message: >
      `detected-at` is before `occurred-at`, and an incident cannot be found before it began. If both
      moments are right, the earlier one is `occurred-at`.
  - id: blameless
    description: >
      Flags a personal name in the Timeline, Root cause or Contributing factors sections. Name the role or
      the system.
  - id: recurring-root-causes
    description: >
      Scheduled. Reports root causes recurring across postmortems.
