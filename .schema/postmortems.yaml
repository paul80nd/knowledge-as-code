# yaml-language-server: $schema=./meta/type.schema.json

type: postmortem
label: Postmortem
label-plural: Postmortems
folder: postmortems
page: postmortems.md
tier: decided
lifecycle: immutable
summary: What happened during an incident (timeline, impact, root cause, contributing factors, actions).
goes-here: An account of an incident and what caused it
detail: >
  Blameless, and immutable once published. An ADR records the intention, and a postmortem records the
  outcome.

lineage:
  prior-art: "[Google SRE, *Postmortem Culture*](https://sre.google/sre-book/postmortem-culture/)"
  alignment: >
    The field set (impact, resolution, actions, root cause, follow-up), the three lessons Google groups as
    *what went well*, *what went wrong* and *where we got lucky*, and blamelessness defined as naming
    causes without naming people
  divergence: >
    Google reviews before publication and treats the document as living. This type freezes a postmortem once
    it is published, separates root cause from contributing factors, asks for each of the three lessons
    under its own heading rather than grouping them, and states the three moments of an incident as
    fields, where Google leaves them in the timeline and the duration in prose

id:
  prefix: pmt
  style: numbered
  width: 4
  notes: >
    `pmt-` names the document, as every prefix here does. `inc-` would name the incident, and one incident
    can produce more than one record.

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the symptom customers experienced, which is what somebody searches for.

fields:

  status:
    required: true
    type: enum
    values: [draft, published]
    description: '`published` freezes the document. A new understanding is a new postmortem citing this one.'

  occurred-at:
    required: true
    type: timestamp
    description: The moment the incident began, in UTC as `2026-09-07T20:18:00Z`.

  detected-at:
    required: true
    type: timestamp
    description: The moment somebody noticed the incident, in UTC as `2026-09-07T20:18:00Z`.
    notes: >
      Separate from `occurred-at`, because the gap between them is often the finding. A timestamp rather
      than a date, because a detection gap is usually measured in minutes.

  restored-at:
    required: false
    required-when: 'status == published'
    type: timestamp
    description: The moment service was back for users, in UTC as `2026-09-07T20:18:00Z`.
    notes: >
      Service back for users, which is what an availability budget counts. Not the moment the cause was
      fixed, and not the moment the actions closed. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#postmortems>.

  duration:
    required: false
    required-when: 'status == published'
    type: string
    description: How long the incident lasted, as an ISO 8601 duration such as `PT4H20M`.
    notes: >
      The span from `occurred-at` to `restored-at`, stated so that an index can show it without
      computing it. `duration-matches-the-moments` fails a value the two moments refuse.

  severity:
    required: true
    type: enum
    values: $enums.severity
    description: The severity the incident was handled at.

  affected:
    required: true
    type: list
    of: id
    ref: [services, offerings]
    description: Service and offering ids the incident affected.

  prompted:
    required: false
    type: list
    of: id
    ref: [adrs, runbooks, nfrs, fixes, standards]
    description: The ADRs, runbooks, NFRs, fixes and standards this incident caused.

# The three lessons are H2s of their own rather than subheadings under one. Google groups them under
# `Lessons Learned`, and a group is a heading an author can satisfy by writing under any part of it.
# Declared separately, `required-section` asks for each and `empty-section` refuses a bare one, which is
# what makes `Where we got lucky` get answered rather than skipped.
sections:
  required:
    - Summary
    - Timeline
    - Impact
    - Resolution
    - Root cause
    - Contributing factors
    - What went well
    - What went wrong
    - Where we got lucky
    - Actions
  optional: [Related]

export:
  version: 1
  fields: [id, title, status, occurred-at, detected-at, restored-at, duration, severity, affected, prompted, tags]
  sections:
    Summary: full
    Impact: summary
    Resolution: full
    Root cause: full
    Contributing factors: full
    What went well: full
    What went wrong: full
    Where we got lucky: full
  notes: >
    `Timeline` and `Actions` stay behind, because both name this estate's own clocks, systems and work
    items. <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#postmortems> says what else
    travels, and what stays behind.

index:
  columns: [id, title, occurred-at, severity, duration, affected]
  sort: occurred-at
  order: descending

rules:
  - id: immutable-after-published
    description: >
      Once `status` is `published`, the account changes only by a new postmortem, never by an edit in place.
  - id: detected-not-before-occurred
    description: '`detected-at` is at or after `occurred-at`.'
    severity: error
    # Guarded, so a missing timestamp is reported once, by `required-field`.
    expr: "present('detected-at') and present('occurred-at') implies field('detected-at') >= field('occurred-at')"
    message: >
      `detected-at` is before `occurred-at`, and an incident cannot be found before it began. If both
      moments are right, the earlier one is `occurred-at`.
  - id: restored-not-before-occurred
    description: '`restored-at` is at or after `occurred-at`.'
    severity: error
    # Guarded, so a missing timestamp is reported once, by `required-field`.
    expr: "present('restored-at') and present('occurred-at') implies field('restored-at') >= field('occurred-at')"
    message: >
      `restored-at` is before `occurred-at`, and service cannot come back before it went. If both moments
      are right, the earlier one is `occurred-at`.
    notes: >
      Against `occurred-at` and not against `detected-at`. An incident can recover before anybody notices
      it, so a record written from the logs afterwards states a `detected-at` later than its `restored-at`
      and states it truthfully.
  - id: duration-matches-the-moments
    description: '`duration` is the span from `occurred-at` to `restored-at`.'
    severity: error
    # In C# rather than an `expr:`, because the message carries the span the moments give.
    notes: >
      The span is written in hours, minutes and seconds, and never in days. See
      <https://paul80nd.github.io/knowledge-as-code/design/expressions/>.
  - id: blameless
    description: >
      Flags a personal name in the Timeline, Root cause or Contributing factors sections. Name the role or
      the system.
  - id: recurring-root-causes
    description: >
      Scheduled. Reports root causes recurring across postmortems.
