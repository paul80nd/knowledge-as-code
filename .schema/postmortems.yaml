type: postmortem
label: Postmortem
label-plural: Postmortems
folder: postmortems
page: postmortems.md
tier: decided
lifecycle: immutable
summary: What actually happened during an incident — timeline, impact, root cause, contributing factors, actions.
goes-here: An account of an incident and what caused it
detail: >
  Blameless, and immutable once published. The honest counterpart to the decision log: an ADR records what was
  intended, a postmortem what the estate did about it.

lineage:
  prior-art: "[Google SRE, *Postmortem Culture*](https://sre.google/sre-book/postmortem-culture/)"
  alignment: >
    The field set — impact, actions, root cause, follow-up — and blamelessness defined as causes without
    indictment
  divergence: >
    Google reviews before publication and treats the document as living; ours is immutable once published. We
    separate root cause from contributing factors

id:
  prefix: pmt
  style: numbered
  width: 4
  notes: >
    TODO — `pmt-` may collide with an organisation's own abbreviations and read ambiguously. `inc-` is the obvious
    alternative but describes the incident rather than the document. Settle before the first record.

filename:
  pattern: '^\d{4}-[a-z0-9-]+\.md$'
  slug-max: 30
  notes: Named for the symptom as customers experienced it, not the cause.

fields:

  status:
    required: true
    type: enum
    values: [draft, published]
    description: '`published` freezes the document; a new understanding is a new postmortem.'
    notes: >
      `published` freezes the document. A materially different understanding is a new postmortem that
      references this one.

  occurred-on:
    required: true
    type: date
    description: Quoted. When the incident began, not when it was noticed.

  detected-on:
    required: true
    type: date
    notes: Separate from `occurred-on` for a reason — the gap between them is often the finding.

  duration:
    required: true
    type: string
    description: How long it lasted, in whatever unit reads honestly.

  severity:
    required: true
    type: enum
    values: $enums.severity
    description: The severity it was handled at.

  affected:
    required: true
    type: list
    of: id
    ref: [services, capabilities]
    description: Service and capability ids that suffered.

  prompted:
    required: false
    type: list
    of: id
    ref: [adrs, runbooks, nfrs, faqs, standards]
    notes: What this incident caused to be written.

sections:
  required: [Summary, Timeline, Impact, Root cause, Contributing factors, What went well, Actions]
  optional: [Related]

index:
  columns: [id, title, occurred-on, severity, duration, affected]
  sort: occurred-on
  order: descending

rules:
  - id: immutable-after-published
    description: >
      Once status is `published`, content changes are limited to typo fixes. Same rule as ADRs.
  - id: detected-not-before-occurred
    description: '`detected-on` is on or after `occurred-on`.'
    severity: error
    # Guarded, because a missing date is `required-field`'s to report: without the guard a postmortem
    # that omits one would be told about the same omission twice, in two vocabularies.
    expr: "present('detected-on') and present('occurred-on') implies field('detected-on') >= field('occurred-on')"
    message: >
      `detected-on` is before `occurred-on` — an incident cannot be found before it began. If the dates are
      right, the earlier one is when it started.
  - id: what-went-well-required
    description: The What went well section has something under it, not just the heading.
    severity: warning
    # Guarded, because an absent section is `required-section`'s to report: without the guard a postmortem
    # missing the heading would be told about the same omission twice, in two vocabularies.
    expr: "section('What went well') implies section_matches('What went well', '\\w')"
    message: >
      The What went well section is empty. An incident that taught nothing about what held is half a
      lesson, and the half nobody writes down is the half that stops being true.
  - id: blameless
    description: >
      Flags personal names inside the Timeline, Root cause and Contributing factors sections. Roles and
      systems, not people.
  - id: recurring-root-causes
    description: >
      Scheduled. Reports root causes recurring across postmortems — the highest-signal output in the corpus.
