# yaml-language-server: $schema=./meta/type.schema.json

type: service
label: Service
label-plural: Services
folder: services
page: services.md
tier: descriptive
lifecycle: living
summary: "One deployable component: purpose, repo, platform, environments, dependencies, data stores, owner."
goes-here: A description of what a deployable component is and does
detail: >
  The anchor most other types point at. Without it, a cross-reference has nothing to resolve against.

lineage:
  prior-art: "[Backstage software catalog](https://backstage.io/docs/features/software-catalog/system-model/), `Component`"
  alignment: >
    A deployable unit carrying owner, dependencies and consumed APIs, acting as the hub of the entity graph
  divergence: >
    Backstage models APIs, resources, systems and domains as separate kinds. We fold dependencies, data stores and
    environments into the service document

id:
  prefix: svc
  style: slug
  notes: >
    Names the deployable, not the repository it lives in. A repository shipping three app services yields three ids,
    and none of them is the repository's name. The repository is carried by `repo`.

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [live, building, deprecated, retired]
    description: Where the service is in its life.

  repo:
    required: true
    type: string
    description: Where the code lives.

  platform:
    required: true
    type: enum
    values: $corpus.platform
    description: What it is built on. Drives which standards apply.
    notes: >
      The range is the estate's, so `.corpus.yaml` states it under `enums:` and this file states none. A corpus
      walks its own deployables, groups them by the runtime and framework a contributor has to know, and closes
      the list on what it found. The type page records how it reached them, and
      <https://paul80nd.github.io/knowledge-as-code/corpus-descriptor/> carries the block.

  criticality:
    required: true
    type: enum
    values: $enums.criticality
    description: Judged by what a customer experiences when it is unavailable.

  depends-on:
    required: false
    type: list
    of: id
    ref: services
    description: What this service calls, downward only.
    notes: >
      An edge means this service is configured to reach that one. Messages over a bus are not an edge, because
      the publisher does not know its consumers. One-directional on purpose: the reverse view is a reader's
      question rather than a second field to keep in step.

  data-stores:
    required: false
    type: list
    of: id
    ref: data
    description: Data ids this service owns or reads.

  facets:
    required: false
    type: list
    of: string
    pattern: '^[a-z0-9-]+$'
    min-records: 2
    description: Slices the catalogue. One exposure, then any traits. Each value groups services.
    notes: >
      A facet divides the catalogue into groups worth browsing, so a value means something only once several
      services share it. `internal` answers "which of these is reachable from outside". A word describing one
      service answers nothing and belongs in `tags`. The floor holds the shape of a vocabulary and never its
      membership, which the type page records for this estate.

sections:
  required: [What it does, Where it lives, Environments]
  optional: [Dependencies, Data, Operational notes]

export:
  version: 1
  fields: [id, title, status, platform, criticality, repo, depends-on, data-stores, facets, tags]
  sections:
    What it does: full
    Where it lives: full
    Dependencies: full
    Data: full
  notes: >
    A service id is cited from every other type, so what travels is what makes that id resolve to
    something a reader recognises. `What it does` and `Where it lives` are both short, and together they
    say which deployable this is and where its code sits.

    `depends-on` carries the estate's own graph, and it is the reason this type exports at all. A consumer
    holding the catalogue walks the edges without opening a record. `Dependencies` travels beside it,
    because an edge says which service and the prose says what the call is for.

    `data-stores` travels as ids that a consumer cannot follow, because a data record travels nowhere.
    `Data` is what that consumer reads instead, and it says in words what the service owns.

    `platform`, `criticality` and `facets` are the three keys an agent filters on. A question about the
    estate is usually a question about a slice of it.

    `Environments` stays behind. It is a table of addresses that mean something to whoever operates the
    service, and a consumer holding a copy can reach none of them. `Operational notes` stays behind with
    it, because both describe running the thing rather than depending on it.

    `owner` stays behind. Who runs a service is a fact about this corpus, and whoever holds a vendored
    copy has no standing to ask them anything.

index:
  columns: [id, title, platform, criticality, status, owner]
  sort: id

rules:
  # A loop lives in the set of edges and no one document holds it, so this is a corpus rule rather than an
  # expression. It warns rather than fails: two services calling each other is a fact about the estate, and
  # the message names the services the loop runs through.
  - id: no-dependency-cycles
    description: A cycle in the dependency graph, naming the services the loop runs through.
    severity: warning
  # The state this compares against lives outside the repository, so it can never run in the per-PR pass
  # every other rule here runs in.
  - id: drift-against-repos
    description: The catalogue against the real repository list, in both directions.
    # Scheduled, not per-PR. Reports services documented but deleted, and repositories with no service document.
