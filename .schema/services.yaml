# yaml-language-server: $schema=./meta/type.schema.json

type: service
label: Service
label-plural: Services
folder: services
page: services.md
tier: descriptive
lifecycle: living
summary: "One deployable component: purpose, repos, platform, environments, dependencies, data stores, owner."
goes-here: What a deployable component is and does
detail: >
  The record most other types point at. Without it, a cross-reference has nothing to resolve against.

lineage:
  prior-art: >
    [Backstage software catalog](https://backstage.io/docs/features/software-catalog/system-model/), `Component`,
    [OpsLevel `opslevel.yml`](https://docs.opslevel.com/docs/opslevel-yml) and the [Cortex entity
    descriptor](https://docs.cortex.io/ingesting-data-into-cortex/entities-overview/entities/yaml): three
    machine-readable catalogues of an estate's deployables
  alignment: >
    A deployable unit with its owner and its dependencies, at the centre of the graph every other type cites.
    Backstage, OpsLevel and Cortex each require a word for the sort of component this is, which `component-type`
    states. `criticality` grades a service by what a customer loses while it is down, which is OpsLevel's tier and
    which Backstage has no field for. `repos` takes a list because OpsLevel lets one component name several
    repositories, where Cortex takes one per git provider and Backstage one source location. `interfaces` points at a
    contract, as Cortex's `x-cortex-link` and an OpsLevel `tools` entry each do
  divergence: >
    Backstage, OpsLevel and Cortex each produce a row of metadata. This type produces a document somebody reads, so
    `What it does`, `Where it lives` and `Environments` are required prose. Backstage models APIs, resources, systems
    and domains as separate kinds, where this type folds dependencies, data stores and environments into one document.
    Backstage's `spec.definition` puts the contract text inside the catalogue, where `interfaces` states the address
    the contract is published at. `facets` refuses a value fewer than two services share, and no source has anything
    like it. Backstage, OpsLevel and Cortex say lifecycle and tier where this type says
    `status` and `criticality`: `tier` already grades a record's authority, and `status` is on every type. Each of
    them puts a paging tool's id in `pagerduty.com/service-id`, `alert_sources` or `x-cortex-oncall`, where
    `monitoring-output` states a standing commitment a reader can act on. Its `alert`, `ticket` and `log` are the
    three monitoring outputs the [SRE Book](https://sre.google/sre-book/introduction/) lists, and `none` is this
    framework's own: no source found names the case where nothing is emitted at all. A `repos` entry is a bare
    name where each source writes an address: Backstage puts the provider in the annotation key and the value in
    `org/repo`, OpsLevel puts it in a sibling `provider:` beside an `org/repo` `name:`, and Cortex puts it in the
    nesting level beside a `repository:` and, for Azure DevOps, a `project:`. Every one of them states the
    provider outside the value, and `repos-base` in `.corpus.yaml` does the same once per corpus.
    [purl](https://ecma-international.org/wp-content/uploads/ECMA-427_1st_edition_december_2025.pdf) addresses a
    repository as `pkg:git/<host>/<owner>/<repo>` and answers the mixed estate none of these corpora has, and it
    was declined because `feature-file-repo` reads the first segment of a path and `pkg:git` is what it would
    read there
id:
  prefix: svc
  style: slug
  notes: >
    The id identifies the deployable. A repository shipping three services gets three ids, and `repos` is where
    the repository goes.

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [live, building, deprecated, retired]
    in-force: live
    description: Where the service is in its life.

  component-type:
    required: true
    type: enum
    values: $corpus.component-type
    description: The sort of component this is, which `platform` does not say.
    notes: >
      The range belongs to the estate, so `.corpus.yaml` states it under `enums:` and this file states none.
      Backstage, OpsLevel and Cortex each require this word and each leave the vocabulary to the adopter.

  repos:
    required: true
    type: list
    of: string
    pattern: '^[a-z0-9-]+$'
    description: Repositories a change to this service is made in.
    notes: >
      A list, because an asset surface can be filled by one repository and served from another. Every entry is
      a repository a contributor edits to change this service, named as the host names it and never as a path.
      `repos-base` in `.corpus.yaml` is what resolves one.
      See <https://paul80nd.github.io/knowledge-as-code/corpus-descriptor/#repos-base>.

  platform:
    required: true
    type: enum
    values: $corpus.platform
    description: What it is built on. Drives which standards apply.
    notes: >
      The range belongs to the estate, so `.corpus.yaml` states it under `enums:` and this file states none.
      <https://paul80nd.github.io/knowledge-as-code/corpus-descriptor/> describes that block.

  criticality:
    required: true
    type: enum
    values: $enums.criticality
    description: Judged by what a customer experiences when it is unavailable.

  monitoring-output:
    required: false
    required-when: 'status in [live, deprecated]'
    type: enum
    values: $enums.monitoring-output
    description: How a live problem with this service reaches a person.
    notes: >
      A standing commitment, and never a rota or a paging tool's id. Backstage, OpsLevel and Cortex each store that
      id because a program dereferences it, where a reader of this record gets a dead string. Required once a service
      runs, so `building` and `retired` are exempt. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#services>.

  interfaces:
    required: false
    type: list
    of: object
    entry:
      type:
        required: true
        type: enum
        values: $corpus.interface-type
        description: The contract format, such as `openapi` or `asyncapi`.
      contract:
        required: true
        type: string
        pattern: '^https://\S+$'
        description: The address the contract is published at.
    description: The interfaces this service offers, with the contract for each.
    notes: >
      A pointer to the contract, and never a copy of it. The value is a whole URL, because `repos`
      states a bare repository name and no convention derives a path from one. The range belongs to the
      estate, so `.corpus.yaml` states it under `enums:` and this file states none. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#services>.

  depends-on:
    required: false
    type: list
    of: id
    ref: services
    description: What this service calls, downward only.
    notes: >
      An edge means this service is configured to call that one. A message over a bus is not an edge, because the
      publisher does not know its consumers. The field records outward calls only. See
      <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#services>.

  data-stores:
    required: false
    type: list
    of: id
    ref: data
    description: Data ids this service owns or reads.

  nfrs:
    required: false
    type: list
    of: id
    ref: nfrs
    reciprocal: applies-to
    description: Ids of the NFRs this service must meet.
    notes: >
      A property of this one deployment, such as a recovery point. `nfrs.applies-to` says which records an
      NFR may bind, and which of them this one named.

  facets:
    required: false
    type: list
    of: string
    pattern: '^[a-z0-9-]+$'
    min-records: 2
    description: 'Slices the catalogue: one exposure value, then any traits.'
    notes: >
      A facet divides the catalogue into groups worth browsing, so `min-records: 2` refuses a value only one service
      uses. The `pattern` fixes the shape of a value, and each corpus records its own values on its type page. A
      word describing one service belongs in `tags`.

sections:
  required: [What it does, Where it lives, Environments]
  optional: [Dependencies, Data, Operational notes]

export:
  version: 2
  fields: [id, title, status, component-type, platform, criticality, monitoring-output, repos, interfaces, depends-on, data-stores, nfrs, facets, tags]
  sections:
    What it does: full
    Where it lives: full
    Dependencies: full
    Data: full
  notes: >
    `depends-on` is the estate's own graph, and the reason this type exports at all.
    <https://paul80nd.github.io/knowledge-as-code/design/shaping-a-type/#services> says what else travels, and what
    stays behind.
index:
  columns: [id, title, component-type, platform, criticality, monitoring-output, status, owner]
  sort: id

rules:
  # Two services calling each other is a fact about the estate.
  - id: no-dependency-cycles
    description: A cycle in the dependency graph, with every service the loop runs through.
    severity: warning
  # `criticality` is ranked, so a service and the ones it calls can be compared.
  - id: dependency-criticality
    description: No service is graded above the criticality of anything it depends on.
    severity: warning
  # The status guard matches the field's own `required-when`, so stating `none` on a draft is never worse
  # than leaving the key out.
  - id: critical-service-is-alerted
    description: A service graded `critical` emits something when it fails.
    severity: warning
    expr: >-
      (field('status') == 'live' or field('status') == 'deprecated')
      and field('criticality') == 'critical'
      implies field('monitoring-output') != 'none'
    message: >
      this service is `critical` and emits nothing when it fails. Set `monitoring-output` to what a live
      problem raises, or record the gap in `Operational notes` and leave this warning standing.
  # `mirrors-section:` cannot ask this: it reconciles ids, and a repository name resolves to no record.
  - id: mirrors-repo-links
    description: Every `repos` entry is linked under `Where it lives`, and every repository linked there is stated.
    severity: warning
  - id: drift-against-repos
    description: Every service has a repository, and every repository has a service document.
    # Runs on a schedule. Reports a service whose repository is gone, and a repository with no service document.
