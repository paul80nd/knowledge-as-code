type: service
label: Service
folder: services
page: services.md
tier: descriptive
lifecycle: living

id:
  prefix: svc
  style: slug
  notes: >
    Names the deployable, not the repository it lives in — a repository shipping three app services yields three ids
    and none of them is the repository's name. The repository is carried by `repo`.

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [live, building, deprecated, retired]
    description: Where the service is in its life.

  repo:
    required: true
    type: string
    description: Where the code lives.

  platform:
    required: true
    type: enum
    values: [dotnet-web, dotnet-api, azure-function, static, typescript, terraform, mixed]
    description: What it is built on. Drives which standards apply.

  criticality:
    required: true
    type: enum
    values: $enums.criticality
    description: Judged by what a customer experiences when it is unavailable.

  depends-on:
    required: false
    type: list
    of: id
    ref: services
    description: Downward only — what this service calls. Nothing yet checks that the ids resolve.
    notes: >
      Downward only — what this service calls. An edge means this service is configured to reach that one; messages
      over a bus are not an edge, because the publisher does not know its consumers. Deliberately one-directional:
      the reverse view is a reader's question, not a second field to keep in step. Nothing generates that view today
      and nothing resolves the ids, so both are the author's responsibility for now.

  data-stores:
    required: false
    type: list
    of: id
    ref: data
    description: Data ids this service owns or reads.

sections:
  required: [What it does, Where it lives, Environments]
  optional: [Dependencies, Data, Operational notes]

index:
  columns: [id, title, platform, criticality, status, owner]
  sort: id

rules:
  - id: no-dependency-cycles
    description: A cycle in the dependency graph is reported, not failed — some are legitimate.
  - id: drift-against-repos
    description: >
      Scheduled, not per-PR. Compares the catalogue against the actual ADO repository list; reports services
      documented but deleted, and repositories with no service document.
  - id: reverse-dependencies-generated
    description: Generates the depended-on-by view and the mermaid dependency diagram from `depends-on`.
