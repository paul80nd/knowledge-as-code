type: widget
label: Widget
label-plural: Widgets
# No `folder:`, so its records have nowhere to live.
page: widgets.md
tier: experimental
lifecycle: living
summary: >-
  A summary long enough to be the paragraph it should have pointed at, which is the one thing a cell in a
  generated table cannot be — and no `goes-here:` at all, which is the other half of the same assertion.
detail: >
  The paragraph the summary above was trying to be. Present and sound, so that the length and the absence
  beside it are the only things this type says wrong about itself.

notes: >
  A type that exists only to be wrong. Every declaration below was accepted in silence before the
  schema-load pass, and each is the shape of a real one: a promise the tool cannot keep, written by
  someone with every reason to believe it could.

stability: experimental

versus:
  gizmos: >
    A disambiguation against a type no schema covers, which renders a heading naming nothing.
  widgets: >
    And one against itself, which renders "Widget vs Widget".

id:
  prefix: wdg
  style: roman-numeral
  width: 4
  notes: >
    Commentary at a level that parses none of it. Admitted in silence, which is the assertion — closing the key
    space works only if these files can still say why.

fields:

  classification:
    required: true
    type: enum
    values: $enums.sensitivity

  tags:
    required: true
    type: list
    of: string
    values: [internal, public]

  related:
    type: list
    of: id
    ref: [widgets, gizmos]
    mirrors-section: See also
    unique: true

  retention:
    type: string
    required-when: classification is personal
    min-items: 2

sections:
  required:
    - Summary
  optional: []

index:
  columns: [id, title]
  sort: id
  order: newest-first

rules:
  - id: widgets-are-blue
    description: Every widget is blue.
    severity: warning

  - id: widgets-have-an-owner
    description: A widget names someone who answers for it.
    severity: error
    expr: "present('owner'"
    message: This widget names no owner.

  - id: widgets-are-documented
    description: A widget says what it is for.
    expr: "words() > 0"
    message: This widget is empty.
