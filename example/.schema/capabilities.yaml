# yaml-language-server: $schema=./meta/type.schema.json

type: capability
label: Capability
label-plural: Capabilities
folder: capabilities
page: capabilities.md
tier: descriptive
lifecycle: living
summary: What we offer a customer and why, as a hub linking to what implements, tests and constrains it.
goes-here: A description of what we offer a customer, and why
detail: >
  A hub, sitting above the epic layer: it links to the work items that detail it, the services that implement
  it, the feature files that test it, and the NFRs that constrain it. A capability that starts accumulating
  detail of its own has stopped being one.

versus:
  services: >
    A capability is what a customer gets. A service is a thing we deploy. One capability typically spans several
    services. One service often contributes to several capabilities.

lineage:
  prior-art: "None that fits. See [Capability](#capability) below"

collision: >
  **The weakest row in the set, and the one carrying two collisions at once.**

  [ArchiMate](https://pubs.opengroup.org/architecture/archimate3-doc/ch-Strategy-Layer.html) defines a
  capability as an *ability an organisation possesses*. Ours is what the organisation *offers a customer*,
  which in ArchiMate's own vocabulary is a Product, a Business Service, or a Value Stream. The concepts are
  adjacent but not the same, and ArchiMate's Value Stream is the closer fit.

  [SAFe](https://framework.scaledagile.com/features-and-capabilities) defines a capability as large solution
  functionality spanning multiple trains within a programme increment, which sits **below** an epic. Ours sits
  **above** the epic layer. The hierarchy is inverted relative to the framework in which most engineering
  organisations will have met the word.

  Neither mapping holds. This type is best read as unrelated to both, and the name is a live question rather
  than a settled one.

id:
  prefix: cap
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [planned, building, live, deprecated]
    description: Lifecycle of the capability, not of the services behind it.

  implemented-by:
    required: true
    type: list
    of: id
    ref: services
    description: Service ids. A capability no service implements is a plan.

  ado-epics:
    required: false
    type: list
    of: int
    notes: ADO work item ids. CI cannot resolve them, so they are here for humans and for the reverse harvest.

  feature-files:
    required: false
    type: list
    of: string
    description: Repo-relative paths. Nothing resolves them today.
    notes: >
      Repo-relative paths. No check reads them: the field carries plain strings rather than references, so
      `ref-resolves` never sees it, and `feature-file-orphans` is declared and does not run. A path that goes
      stale here goes stale silently.

  nfrs:
    required: false
    type: list
    of: id
    ref: nfrs
    description: NFR ids, the targets this capability is held to.

sections:
  required: [What it does, Why it exists, Where the detail lives]
  optional: [Surfaces, Known limitations]

index:
  columns: [id, title, status, implemented-by]
  sort: id

rules:
  - id: hub-not-specification
    description: A capability's prose stays proportionate to its links, because it is a hub.
    severity: warning
    # A capability linking to nothing is a specification however short it is, which is why the
    # allowance is a ratio rather than a ceiling.
    expr: "words() <= links() * 40"
    message: >
      Prose has outgrown the links. A capability is a hub. Move the detail into the documents it should
      be pointing at, and link to them from here.
  - id: feature-file-orphans
    description: >
      Scheduled. Reports feature files in the code repositories claimed by no capability, and paths here
      that no longer exist.
