# CI for the knowledge-as-code corpus.
#
# Runs the kac validator, the generated-content freshness check and the export on
# pull requests into main. It NEVER commits anything it produces. `index --check`
# only verifies the tracked generated files are fresh and fails, naming the command
# a human runs locally (`dotnet run .tooling/kac.cs -- index`). The export lands in
# an untracked .dist/ that the agent throws away. This pipeline is read-only and
# pushes nothing.
#
# What CI produces is never written back over a file a human edits, which is the
# rule the line above keeps. Publishing the built bundle is a different act: on
# GitHub, .github/workflows/publish.yml writes it to an orphaned marketplace
# branch that shares no commit with main. There is no Azure DevOps equivalent
# yet, so nothing is published from here.
#
# Wiring PR validation (important): this is an Azure Repos repository, where the
# YAML `pr:` trigger below is IGNORED. Add this pipeline as a required
# Branch Policy → Build Validation on `main`:
#   Project settings → Repositories → <your-repo> → Policies → Branch Policies →
#   main → Build Validation → + → select this pipeline → Required.
# The `pr:` block is kept for intent, and works as-is if the repo is ever
# mirrored to GitHub.

trigger: none                 # no CI on branch pushes; PR validation is via branch policy

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  # One invocation per subcommand, run sequentially. File-based apps share build
  # output, so the kac runs must not execute concurrently.
  - script: dotnet run .tooling/kac.cs -- validate
    displayName: Validate frontmatter, links and structure
    workingDirectory: $(Build.SourcesDirectory)

  - script: dotnet run .tooling/kac.cs -- index --check
    displayName: Check generated indexes are fresh
    workingDirectory: $(Build.SourcesDirectory)

  # Proves the corpus still exports. The shape it exports in is held by a golden
  # in the test suite, which a corpus running this pipeline does not carry.
  - script: dotnet run .tooling/kac.cs -- export
    displayName: Build the export
    workingDirectory: $(Build.SourcesDirectory)

  # Assembles what `export` wrote, together with the .plugin/ tree, into an
  # installable plugin under .dist/plugin/, with .dist/ itself as the marketplace
  # naming it. The fourth and last kac invocation, so the one-at-a-time rule
  # above still holds.
  - script: dotnet run .tooling/kac.cs -- bundle
    displayName: Assemble the plugin bundle
    workingDirectory: $(Build.SourcesDirectory)

  # Taken at `latest` rather than pinned, because the bundle has to be valid
  # against the CLI a reader actually runs.
  - script: npm install -g @anthropic-ai/claude-code@latest
    displayName: Install the Claude Code CLI

  # Two manifests are checked: the plugin a reader installs, and the marketplace
  # offering it. `--strict` fails on the warnings the runtime tolerates, which is
  # what its own help text asks CI to do.
  #
  # The CLI finds components by convention — a directory under skills/, a
  # hooks/hooks.json — and names one only when it has a fault to report. A clean
  # run prints the manifest line alone, so its silence says nothing about how much
  # it looked at, and a plugin carrying no component at all passes. The two guards
  # after it are what close that. bundle.json lists what this build put in, so the
  # first asserts each of those components is really in the tree; the second
  # asserts .claude-plugin/ holds the manifest and nothing else, because a
  # component filed in there is loaded by nothing and reported by nothing.
  #
  # Held to the POSIX subset Git Bash and older macOS bash agree on: no arrays, no
  # `[[`, no process substitution, and no command substitution, whose `$(...)` an
  # Azure pipeline reads as its own macro before the shell ever sees it. The loop
  # reads from a file rather than a pipe, so the variable it sets survives into the
  # test below it. TEMPDIR arrives from the agent rather than being named inline,
  # which is what leaves this script word for word the one in
  # .github/workflows/kac.yml.
  - script: |
      claude plugin validate ./.dist/plugin --strict
      claude plugin validate ./.dist --strict

      jq -r '.included[].path' .dist/plugin/bundle.json > "$TEMPDIR/included.txt"

      missing=''
      while read -r component; do
        [ -d ".dist/plugin/$component" ] || missing="$missing $component"
      done < "$TEMPDIR/included.txt"

      if [ -n "$missing" ]; then
        echo "bundle.json includes components the assembled plugin does not hold:$missing"
        exit 1
      fi

      find .dist/plugin/.claude-plugin -mindepth 1 -maxdepth 1 ! -name plugin.json > "$TEMPDIR/stray.txt"

      if [ -s "$TEMPDIR/stray.txt" ]; then
        echo "filed inside .claude-plugin/, where nothing loads it:"
        cat "$TEMPDIR/stray.txt"
        exit 1
      fi
    displayName: Validate the assembled plugin and its marketplace
    workingDirectory: $(Build.SourcesDirectory)
    env:
      TEMPDIR: $(Agent.TempDirectory)
