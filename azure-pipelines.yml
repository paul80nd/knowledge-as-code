# CI for the knowledge-as-code wiki.
#
# Runs the kac validator and the generated-content freshness check on pull
# requests into main. It NEVER writes or commits generated files: `index --check`
# only verifies they are fresh and fails, naming the command a human runs locally
# (`dotnet run .ci/kac.cs -- index`). A pipeline must never push.
#
# Wiring PR validation (important): this is an Azure Repos repository, where the
# YAML `pr:` trigger below is IGNORED. Add this pipeline as a required
# Branch Policy → Build Validation on `main`:
#   Project settings → Repositories → <your-repo> → Policies → Branch Policies →
#   main → Build Validation → + → select this pipeline → Required.
# The `pr:` block is kept for intent, and works as-is if the repo is ever
# mirrored to GitHub.

trigger: none                 # no CI on branch pushes; PR validation is via branch policy

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  # One invocation per subcommand, run sequentially. File-based apps share build
  # output, so the two kac runs must not execute concurrently.
  - script: dotnet run .ci/kac.cs -- validate
    displayName: Validate frontmatter, links and structure
    workingDirectory: $(Build.SourcesDirectory)

  - script: dotnet run .ci/kac.cs -- index --check
    displayName: Check generated indexes are fresh
    workingDirectory: $(Build.SourcesDirectory)
