type: gizmo
label: Gizmo
label-plural: Gizmos
folder: gizmos
page: gizmos.md
tier: descriptive
lifecycle: living
summary: A fixture type, carrying the two lines every type owes so that only the mirroring is under test here.
goes-here: A gizmo, which is a thing this fixture has and nothing else does
detail: >
  Carrying the lines every type owes so that only the mirroring is under test here.

lineage:
  prior-art: None — a fixture type has no ancestor to claim.

notes: >
  A fixture type laid over the real schema so that the two mirroring checks are exercised away from the
  types that declare them. The section a field mirrors is whatever the field names, and the ADR type —
  the only real one that mirrors a section — cannot say that on its own. The label a field reconciles
  its citations against is whatever the field names too, and 'standards' is the only real type
  declaring one.

id:
  prefix: giz
  style: slug

filename:
  pattern: '^[a-z0-9-]+\.md$'
  slug-max: 30

fields:

  status:
    required: true
    type: enum
    values: [live, retired]
    description: Where the gizmo is in its life.

  depends-on:
    required: false
    type: list
    of: id
    ref: gizmos
    mirrors-section: Dependencies
    description: What this gizmo calls, repeated as prose in the section it mirrors.

  covers:
    required: false
    type: list
    of: id
    ref: gizmos
    part-required: true
    mirrors-citations: Covers
    description: Behaviours of another gizmo this one answers, named again in a footnote closing each section.

sections:
  required: [What it does]
  optional: [Dependencies, Behaviours]

parts:
  source: headings
  section: Behaviours
  noun: behaviour

index:
  columns: [id, title, status, owner]
  sort: id
