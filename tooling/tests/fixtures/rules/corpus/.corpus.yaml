# This fixture declares a name and a content version so that `report-stale` has something to compare a
# report's `sources` against, and a repository base so that `mirrors-repo-links` has something to resolve a
# `repos` entry to. Everything else stays at its default, as an absent descriptor would leave it.
corpus: fixture-corpus
content-version: 0.2.0
repos-base: https://git.example.com/fixture

# The range `platform` draws on, which the schema leaves to the corpus. Stated so that the services
# below report the rules this fixture is about and nothing else.
enums:
  component-type: [api, worker]
  platform: [azure-function, dotnet-web]
