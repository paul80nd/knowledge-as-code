descriptor-version: 1
corpus: test-inherited
shortcode: own

# Restored beside this file, so the export carries it. The `imports` fixture is the other half of this
# pair: it declares the same thing with nothing restored, and `validate` reports it.
consumes:
  - corpus: example-engineering
    shortcode: eng
    version: ^0.1.0
    source: ../engineering/.dist/package
    resolved: "0.4.1"

upstream:
  url:

# Stated, so the golden manifest proves a tracker travels. The other export fixtures state none, and
# theirs proves the absence is written down rather than left out.
framework:
  target: github
  base: https://github.com/example/framework

# Stated rather than derived, and stated as a repository inside a project, so the golden manifest proves
# both: a corpus files where it says, and an Azure DevOps backlog is the project holding the repository.
tracker:
  target: azure-devops
  base: https://dev.azure.com/acme/Standards/_git/corpus

skip: []
